<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>WorkHub Pro</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --main-purple: #6366f1; --bg: #f8faff; --white: #ffffff; --border: #eef2ff; --admin-red: #ef4444; }
  body { font-family: 'Pretendard', sans-serif; margin: 0; background: var(--bg); color: #1e293b; }
  
  header { padding: 30px 40px; text-align: center; background: transparent; position: relative; }
  .logo { font-size: 28px; font-weight: 900; color: #334155; margin-bottom: 10px; }
  .header-admin { position: absolute; right: 40px; top: 40px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: #64748b; font-weight: 700; }
  
  /* 네비게이션 탭 (이미지 상단 스타일) */
  .nav-tabs { display: inline-flex; background: #fff; padding: 5px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .nav-btn { padding: 12px 25px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; color: #64748b; background: transparent; display: flex; align-items: center; gap: 8px; }
  .nav-btn.active { background: var(--main-purple); color: #fff; }

  main { max-width: 1400px; margin: 0 auto; padding: 20px; display: none; grid-template-columns: 1.8fr 1fr; gap: 30px; }
  main.active { display: grid; }

  /* 카드 공통 스타일 */
  .card { background: var(--white); border-radius: 30px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); position: relative; }
  .card-title { font-size: 22px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
  .card-title::before { content: ''; width: 6px; height: 22px; background: var(--main-purple); border-radius: 10px; }

  /* 가이드 보관함 (왼쪽) */
  .search-wrap { display: flex; gap: 10px; margin-bottom: 20px; }
  .input-search { flex: 1; padding: 18px 25px; border-radius: 20px; border: none; background: #f1f5f9; font-size: 16px; }
  .select-comp { width: 150px; padding: 0 20px; border-radius: 20px; border: none; background: #f1f5f9; font-weight: 700; }

  /* 오늘의 공유사항 (오른쪽 등록폼) */
  .input-area { width: 100%; height: 120px; padding: 20px; border-radius: 20px; border: none; background: #f1f5f9; margin-bottom: 15px; font-family: inherit; resize: none; font-size: 15px; }
  .btn-submit { width: 100%; padding: 20px; border-radius: 20px; border: none; background: var(--main-purple); color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; }

  /* 스위치 디자인 */
  .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
  .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--admin-red); }
  input:checked + .slider:before { transform: translateX(22px); }

  .share-item { padding: 20px; border-bottom: 1px solid #f8fafc; position: relative; }
  .admin-btns { display: none; position: absolute; top: 20px; right: 20px; gap: 5px; }
  .btn-red { background: var(--admin-red); color: #fff; border: none; padding: 5px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 700; }
  
  /* 기업관리 테이블 (탭 0) */
  .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
  .status-box { background: #fff; padding: 20px; border-radius: 25px; text-align: center; }
  .status-val { font-size: 24px; font-weight: 900; color: var(--main-purple); }
  .comp-table { width: 100%; border-collapse: collapse; }
  .comp-table td, .comp-table th { padding: 15px; text-align: left; border-bottom: 1px solid #f1f5f9; }
</style>
</head>
<body>

<header>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn" onclick="tab(0)">🏢 기업관리시스템</button>
    <button class="nav-btn active" onclick="tab(1)">🚀 워크허브</button>
  </div>
  <div class="header-admin">
    관리자
    <label class="switch">
      <input type="checkbox" id="admin-switch" onchange="toggleAdmin()">
      <span class="slider"></span>
    </label>
  </div>
</header>

<main id="tab-0">
  <section>
    <div class="status-grid">
      <div class="status-box"><div>전체 기업</div><div class="status-val" id="c-all">0</div></div>
      <div class="status-box"><div>운영중</div><div class="status-val" id="c-on">0</div></div>
      <div class="status-box"><div>종료</div><div class="status-val" id="c-off">0</div></div>
    </div>
    <div class="card">
      <div class="card-title">기업 리스트</div>
      <table class="comp-table"><tbody id="comp-tbody"></tbody></table>
    </div>
  </section>
  <aside>
    <div class="card">
      <div class="card-title">기업 등록</div>
      <input type="text" id="add-name" placeholder="기업명" class="input-search" style="background:#f8faff; margin-bottom:10px;">
      <input type="text" id="add-period" placeholder="운영기간 (2026.01~)" class="input-search" style="background:#f8faff; margin-bottom:10px;">
      <button class="btn-submit" onclick="addComp()">기업 등록하기</button>
    </div>
  </aside>
</main>

<main id="tab-1" class="active">
  <section class="card">
    <div class="card-title">가이드 보관함</div>
    <div class="search-wrap">
      <input type="text" id="g-search" placeholder="가이드 내용 검색..." class="input-search" onkeypress="if(event.keyCode==13) filterGuides()">
      <select id="g-filter" class="select-comp" onchange="filterGuides()">
        <option value="">전체 기업</option>
      </select>
    </div>
    <div id="guide-list" style="min-height:200px;">
      <div style="text-align:center; color:#94a3b8; padding:50px;">검색 결과가 없습니다.</div>
    </div>
  </section>

  <aside class="card">
    <div class="card-title">오늘의 공유사항</div>
    <input type="text" id="reg-comp" placeholder="기업명 입력" class="input-search" style="background:#f8faff; margin-bottom:10px; padding:15px;">
    <input type="text" id="reg-key" placeholder="키워드 입력" class="input-search" style="background:#f8faff; margin-bottom:10px; padding:15px;">
    <textarea id="reg-content" class="input-area" placeholder="공유할 내용을 입력하세요..."></textarea>
    <button class="btn-submit" onclick="addGuide()">소식 공유</button>
    
    <div style="margin-top:20px;">
       <button class="btn-submit" onclick="downSample()" style="background:#1e293b; font-size:13px; padding:12px;">📥 양식 다운로드</button>
       <input type="file" id="xl-file" style="margin-top:10px; font-size:12px;">
       <button class="btn-submit" onclick="upExcel()" style="background:#475569; font-size:13px; padding:12px; margin-top:5px;">엑셀 대량 등록</button>
    </div>
  </aside>
</main>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAtn4kWV3_D18zivOHIEAkW09Lqt2ZjHqE",
    authDomain: "workhub-pro-be742.firebaseapp.com",
    databaseURL: "https://workhub-pro-be742-default-rtdb.firebaseio.com/",
    projectId: "workhub-pro-be742"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let isAdmin = false;
  let allData = [];

  function init() {
    db.ref('companies').on('value', s => {
      const v = s.val() || {};
      const list = Object.values(v);
      document.getElementById('c-all').innerText = list.length;
      document.getElementById('c-on').innerText = list.filter(i => i.period.includes('~')).length;
      document.getElementById('comp-tbody').innerHTML = list.map(i => `<tr><td><b>${i.name}</b></td><td>${i.period}</td></tr>`).join('');
      
      const sel = document.getElementById('g-filter');
      sel.innerHTML = '<option value="">전체 기업</option>' + list.map(i => `<option value="${i.name}">${i.name}</option>`).join('');
    });

    db.ref('guides').on('value', s => {
      const v = s.val() || {};
      allData = Object.keys(v).map(k => ({ id: k, ...v[k] }));
      renderGuides(allData);
    });
  }

  function toggleAdmin() {
    const sw = document.getElementById('admin-switch');
    if (sw.checked) {
      if (prompt("비밀번호") === '6559') isAdmin = true;
      else { alert("오답"); sw.checked = false; isAdmin = false; }
    } else isAdmin = false;
    renderGuides(allData);
  }

  function renderGuides(data) {
    const container = document.getElementById('guide-list');
    if (data.length === 0) { container.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:50px;">데이터가 없습니다.</div>'; return; }
    container.innerHTML = data.slice().reverse().map(i => `
      <div class="share-item">
        <div class="admin-btns" style="display:${isAdmin?'flex':'none'}">
          <button class="btn-red" onclick="delG('${i.id}')">삭제</button>
        </div>
        <b style="color:var(--main-purple)">[${i.company}]</b> <b>${i.keyword}</b>
        <div style="margin-top:10px; color:#475569; white-space:pre-wrap;">${i.content}</div>
      </div>
    `).join('');
  }

  function filterGuides() {
    const q = document.getElementById('g-search').value.toLowerCase();
    const f = document.getElementById('g-filter').value;
    renderGuides(allData.filter(i => (i.content.toLowerCase().includes(q) || i.keyword.toLowerCase().includes(q)) && (!f || i.company === f)));
  }

  function addGuide() {
    const company = document.getElementById('reg-comp').value;
    const keyword = document.getElementById('reg-key').value;
    const content = document.getElementById('reg-content').value;
    if(!company || !content) return alert("내용 입력!");
    db.ref('guides').push({ company, keyword, content });
    document.getElementById('reg-key').value = '';
    document.getElementById('reg-content').value = '';
  }

  function addComp() {
    const name = document.getElementById('add-name').value;
    const period = document.getElementById('add-period').value;
    if(name) db.ref('companies').push({ name, period });
  }

  function delG(id) { if(confirm("삭제?")) db.ref('guides/'+id).remove(); }

  function tab(i) {
    document.querySelectorAll('.nav-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
    document.querySelectorAll('main').forEach((m, idx) => m.classList.toggle('active', idx === i));
  }

  function downSample() {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["대상기업", "키워드", "가이드내용"]]), "Sheet1");
    XLSX.writeFile(wb, "WorkHub_Sample.xlsx");
  }

  function upExcel() {
    const file = document.getElementById('xl-file').files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const rows = XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(e.target.result), {type:'array'}).Sheets.Sheet1);
      rows.forEach(r => db.ref('guides').push({ company: r['대상기업'], keyword: r['키워드'], content: r['가이드내용'] }));
      alert("완료");
    };
    reader.readAsArrayBuffer(file);
  }

  window.onload = init;
</script>
</body>
</html>
