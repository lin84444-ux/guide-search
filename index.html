<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro | 통합 관리 시스템</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    --bg-main: #f8fafc;
    --header-grad: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
    --card-bg: #ffffff;
    --primary: #6366f1; /* 선호하시는 블루 */
    --accent: #f43f5e; /* 포인트 색상 */
    --secondary: #94a3b8;
    --text-main: #1e293b;
    --text-sub: #475569;
    --border-color: #f1f5f9;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
  }

  body { 
    font-family: 'Pretendard', sans-serif; 
    margin: 0; background-color: var(--bg-main); color: var(--text-main);
    line-height: 1.6; word-break: keep-all;
  }

  header { 
    background: var(--header-grad); padding: 50px 20px 100px; text-align: center; 
    position: relative; z-index: 1; clip-path: ellipse(150% 100% at 50% 0%);
  }

  .nav-tabs { display: flex; justify-content: center; gap: 12px; margin-top: 25px; }
  .nav-btn {
    padding: 12px 35px; border-radius: 50px; border: none;
    background: white; color: var(--secondary); font-weight: 700; cursor: pointer;
    box-shadow: var(--shadow); transition: 0.3s;
  }
  .nav-btn.active { background: var(--primary); color: white; }

  .admin-toggle-btn { 
    position: absolute; top: 30px; right: 40px; 
    background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.05); 
    padding: 10px 22px; border-radius: 14px; color: #475569; cursor: pointer; 
    backdrop-filter: blur(10px); transition: 0.3s; font-size: 13px; font-weight: 700;
  }

  main { 
    max-width: 1400px; margin: -60px auto 80px; padding: 0 25px; position: relative; z-index: 10; 
  }

  .content-section { display: none; flex-direction: column; gap: 25px; }
  .content-section.active { display: flex; }

  .card { background: var(--card-bg); border-radius: 24px; padding: 30px; box-shadow: var(--shadow); border: 1px solid #ffffff; }
  .title-area { font-size: 20px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .title-area i { width: 6px; height: 20px; border-radius: 3px; background: var(--primary); }

  /* 대시보드 통계 카드 (블루톤 유지) */
  .stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .stat-card { padding: 25px; border-radius: 20px; text-align: center; color: white; }
  .stat-card.all { background: #6366f1; }
  .stat-card.on { background: #4f46e5; }
  .stat-card.off { background: #94a3b8; }
  .stat-val { font-size: 32px; font-weight: 900; }

  /* 입력창 및 테이블 */
  input, textarea, select { 
    padding: 14px; border: 1.5px solid var(--border-color); border-radius: 14px; 
    outline: none; background: #f8fafc; transition: 0.3s; font-size: 14px;
  }
  input:focus { border-color: var(--primary); background: white; }
  button { padding: 14px; border: none; border-radius: 14px; cursor: pointer; font-weight: 700; transition: 0.2s; }
  .btn-blue { background: var(--primary); color: white; }
  
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th { background: #f8fafc; color: var(--text-sub); padding: 15px; font-size: 13px; border-bottom: 2px solid var(--border-color); }
  td { padding: 15px; text-align: center; border-bottom: 1px solid var(--border-color); font-size: 14px; }

  .badge { padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 11px; }
  .badge-on { background: #eef2ff; color: #6366f1; }
  .badge-off { background: #f1f5f9; color: #94a3b8; }

  .hub-grid { display: grid; grid-template-columns: 1.8fr 1fr; gap: 30px; }
  @media (max-width: 1000px) { .hub-grid { grid-template-columns: 1fr; } .stats-container { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <button class="admin-toggle-btn" onclick="toggleAdmin()">⚙️ 관리자 모드</button>
  <h1>WorkHub Pro</h1>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab('corp-tab', this)">🏢 기업관리시스템</button>
    <button class="nav-btn" onclick="switchTab('hub-tab', this)">🚀 워크허브</button>
  </div>
</header>

<main>
  <section id="corp-tab" class="content-section active">
    <div class="card" style="background: #eef2ff; border: 2px dashed #c7d2fe;">
      <div style="display:flex; align-items:center; gap:15px;">
        <span style="font-weight:800; color:var(--primary);">📊 엑셀 파일 업로드</span>
        <input type="file" id="excel-file" style="flex:1;">
        <button class="btn-blue" onclick="alert('준비중인 기능입니다.')">업로드</button>
      </div>
    </div>

    <div class="stats-container">
      <div class="stat-card all"><div class="stat-val" id="st-all">0</div><div class="stat-label">전체 기업</div></div>
      <div class="stat-card on"><div class="stat-val" id="st-on">0</div><div class="stat-label">운영 중</div></div>
      <div class="stat-card off"><div class="stat-val" id="st-off">0</div><div class="stat-label">종료</div></div>
    </div>

    <div class="card">
      <div class="title-area"><i></i> 기업 검색 및 등록</div>
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        <input id="corp-q" style="flex:1" placeholder="기업명 검색 (공란 엔터 시 전체 노출)" onkeyup="if(event.key==='Enter') renderCorpTable()">
        <button class="btn-blue" onclick="renderCorpTable()" style="padding:0 30px;">검색</button>
      </div>
      
      <div style="display:grid; grid-template-columns: repeat(5, 1fr) auto; gap:8px;">
        <input id="in-name" placeholder="기업명">
        <input id="in-code" placeholder="기업코드">
        <input id="in-url" placeholder="URL">
        <select id="in-status"><option>운영중</option><option>종료</option></select>
        <input id="in-period" placeholder="운영기간">
        <button onclick="addCorp()" class="btn-blue">등록</button>
      </div>

      <table>
        <thead>
          <tr><th>기업명</th><th>코드</th><th>URL</th><th>상태</th><th>기간</th><th>관리</th></tr>
        </thead>
        <tbody id="corp-body"></tbody>
      </table>
    </div>
  </section>

  <section id="hub-tab" class="content-section">
    <div class="hub-grid">
      <div class="card">
        <div class="title-area"><i></i> 가이드 보관함</div>
        <input id="guide-q" style="width:100%; box-sizing:border-box; margin-bottom:15px;" placeholder="가이드 내용 검색..." onkeyup="renderGuides()">
        <div id="guide-result"></div>
      </div>
      <div class="card">
        <div class="title-area"><i></i> 가이드 등록</div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <input id="new-cat" placeholder="기업명">
          <textarea id="new-txt" placeholder="가이드 내용" rows="4"></textarea>
          <button onclick="addGuide()" class="btn-blue">가이드 저장</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
  let CORPS = JSON.parse(localStorage.getItem("pro_corps") || "[]");
  let GUIDES = JSON.parse(localStorage.getItem("pro_guides") || "[]");
  let isAdmin = false;

  function switchTab(id, btn) {
    document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }

  // --- 기업 관리 기능 ---
  function addCorp() {
    const name = document.getElementById("in-name").value;
    if(!name) return alert("기업명을 입력하세요.");
    
    CORPS.unshift({
      name, 
      code: document.getElementById("in-code").value,
      url: document.getElementById("in-url").value,
      status: document.getElementById("in-status").value,
      period: document.getElementById("in-period").value
    });
    
    localStorage.setItem("pro_corps", JSON.stringify(CORPS));
    document.querySelectorAll('#corp-tab input').forEach(i => i.value="");
    renderCorpTable();
  }

  function renderCorpTable() {
    const q = document.getElementById("corp-q").value.trim().toLowerCase();
    const tbody = document.getElementById("corp-body");
    const filtered = CORPS.filter(c => c.name.toLowerCase().includes(q));

    document.getElementById("st-all").innerText = CORPS.length;
