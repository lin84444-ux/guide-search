<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>WorkHub Pro - Clean Version</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --main-purple: #6366f1; --bg-light: #f8fafc; --white: #ffffff; --text-dark: #1e293b; --border-color: #e2e8f0; }
  body { font-family: 'Pretendard', sans-serif; margin: 0; background: var(--bg-light); color: var(--text-dark); }
  
  header { padding: 40px 20px; text-align: center; background: #fff; position: relative; }
  .logo { font-size: 32px; font-weight: 900; color: #1e293b; margin-bottom: 25px; }
  .admin-trigger { position: absolute; top: 20px; right: 25px; padding: 10px 15px; border-radius: 10px; border: 1px solid var(--border-color); background: #fff; cursor: pointer; color: #64748b; font-size: 13px; }
  
  .nav-tabs { display: inline-flex; background: #f1f5f9; padding: 6px; border-radius: 12px; margin-bottom: 30px; }
  .nav-btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; color: #64748b; background: transparent; }
  .nav-btn.active { background: var(--main-purple); color: #fff; }

  main { max-width: 1400px; margin: 0 auto; padding: 20px; display: none; grid-template-columns: 2fr 1fr; gap: 25px; }
  main.active { display: grid; }

  .card { background: var(--white); border-radius: 20px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
  .card-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
  .card-title span::before { content: ''; display: inline-block; width: 4px; height: 16px; background: var(--main-purple); margin-right: 10px; border-radius: 10px; }

  .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
  .status-box { background: #fff; padding: 25px; border-radius: 20px; text-align: center; border: 1px solid var(--border-color); }
  .status-box .num { font-size: 28px; font-weight: 900; margin-top: 10px; }

  input, textarea { width: 100%; padding: 15px; border-radius: 12px; border: 1.5px solid var(--border-color); margin-bottom: 12px; box-sizing: border-box; }
  .btn-primary { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--main-purple); color: #fff; font-weight: 700; cursor: pointer; }
  .btn-danger { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; display: none; }
  .admin-mode .btn-danger { display: inline-block; }

  .list-table { width: 100%; border-collapse: collapse; }
  .list-table th { text-align: left; padding: 12px; color: #64748b; border-bottom: 2px solid #f1f5f9; font-size: 13px; }
  .list-table td { padding: 16px 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }

  #network-warning { display: none; background: #fee2e2; color: #b91c1c; text-align: center; padding: 10px; font-weight: 700; }
</style>
</head>
<body id="app-body">

<div id="network-warning">⚠️ 사내망 보안 차단 감지: 데이터가 보이지 않거나 등록되지 않을 수 있습니다.</div>

<header>
  <button class="admin-trigger" onclick="checkAdmin()">⚙️ 관리자 인증</button>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab(0)">🏢 기업관리시스템</button>
    <button class="nav-btn" onclick="switchTab(1)">🚀 워크허브</button>
  </div>
</header>

<main id="tab-0" class="active">
  <div>
    <div class="status-grid">
      <div class="status-box"><div>전체</div><div class="num" id="count-all">0</div></div>
      <div class="status-box"><div>운영중</div><div class="num" id="count-on" style="color:var(--main-purple)">0</div></div>
      <div class="status-box"><div>종료</div><div class="num" id="count-off">0</div></div>
    </div>
    <div class="card">
      <div class="card-title">
        <span>기업 현황 리스트</span>
        <button class="btn-danger" onclick="nukeData()">⚠️ 전체 데이터 강제 삭제</button>
      </div>
      <input type="text" id="search-comp" placeholder="기업명 검색..." onkeyup="render()">
      <table class="list-table">
        <thead><tr><th>기업명</th><th>코드</th><th>운영기간</th><th>상태</th><th>연수원 URL</th><th class="del-col">삭제</th></tr></thead>
        <tbody id="list-body"></tbody>
      </table>
    </div>
  </div>
  <aside>
    <div class="card">
      <div class="card-title"><span>엑셀 파일 등록</span></div>
      <button class="btn-primary" style="background:#1e293b; margin-bottom:10px;" onclick="downloadSample()">📥 샘플 양식 받기</button>
      <input type="file" id="excel-file" accept=".xlsx">
      <button class="btn-primary" onclick="uploadExcel()">데이터 등록</button>
    </div>
  </aside>
</main>

<main id="tab-1">
  <div class="card" style="grid-column: span 1;">
    <div class="card-title"><span>가이드 보관함</span></div>
    <input type="text" placeholder="가이드 내용 검색...">
    <div style="text-align:center; padding:100px; color:#94a3b8;">검색 결과가 없습니다.</div>
  </div>
  <aside>
    <div class="card">
      <div class="card-title"><span>오늘의 공유사항</span></div>
      <textarea placeholder="공유할 내용을 입력하세요..." style="height:100px;"></textarea>
      <button class="btn-primary">소식 공유</button>
    </div>
    <div class="card" style="margin-top:20px;">
      <div class="card-title"><span>가이드 등록</span></div>
      <input placeholder="대상 기업명"><input placeholder="키워드"><textarea placeholder="상세 내용"></textarea>
      <button class="btn-primary" style="background:#eef2ff; color:var(--main-purple);">가이드 저장</button>
    </div>
  </aside>
</main>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAtn4kWV3_D18zivOHIEAkW09Lqt2ZjHqE",
    authDomain: "workhub-pro-be742.firebaseapp.com",
    databaseURL: "https://workhub-pro-be742-default-rtdb.firebaseio.com/",
    projectId: "workhub-pro-be742"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let COMPANIES = [];

  function init() {
    // 연결 체크
    db.ref(".info/connected").on("value", s => {
      document.getElementById('network-warning').style.display = s.val() ? 'none' : 'block';
    });

    // 데이터 로드
    db.ref('companies').on('value', ss => {
      const v = ss.val();
      COMPANIES = v ? Object.entries(v).map(([k, val]) => ({ ...val, key: k })) : [];
      render();
    });
  }

  function render() {
    const q = document.getElementById('search-comp').value.toLowerCase();
    const f = COMPANIES.filter(c => c.name.toLowerCase().includes(q));
    
    document.getElementById('count-all').innerText = COMPANIES.length;
    document.getElementById('count-on').innerText = COMPANIES.filter(c => c.status === '운영중').length;
    document.getElementById('count-off').innerText = COMPANIES.filter(c => c.status === '종료').length;

    document.getElementById('list-body').innerHTML = f.reverse().map(c => `
      <tr><td><b>${c.name}</b></td><td>${c.code}</td><td>${c.period}</td>
      <td style="color:${c.status==='운영중'?'#6366f1':'#94a3b8'}; font-weight:800;">${c.status}</td>
      <td>${c.url}</td>
      <td class="admin-mode-only" style="display:none;"><button class="btn-danger" style="display:inline;" onclick="delItem('${c.key}')">삭제</button></td></tr>`).join('');
    
    if(document.getElementById('app-body').classList.contains('admin-mode')) {
        document.querySelectorAll('.admin-mode-only').forEach(el => el.style.display = 'table-cell');
    }
  }

  async function uploadExcel() {
    const file = document.getElementById('excel-file').files[0];
    if(!file) return alert("파일 선택!");
    const reader = new FileReader();
    reader.onload = async (e) => {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      const updates = {};
      rows.forEach(r => {
        if(r['기업명']) {
          const key = db.ref().child('companies').push().key;
          updates[`/companies/${key}`] = {
            name: r['기업명'], code: r['기업코드']||'', period: r['운영기간']||'',
            url: r['연수원 URL']||'', status: r['상태']||'운영중'
          };
        }
      });
      await db.ref().update(updates);
      alert("등록 완료!");
    };
    reader.readAsArrayBuffer(file);
  }

  function checkAdmin() {
    if(prompt("비밀번호 입력") === "6559") {
      document.getElementById('app-body').classList.add('admin-mode');
      alert("관리자 인증 성공. 삭제 버튼이 활성화되었습니다.");
      render();
    }
  }

  function nukeData() {
    if(confirm("정말로 수천 건의 기존 데이터를 모두 삭제하시겠습니까? (복구 불가능)")) {
      db.ref('companies').remove().then(() => alert("전체 삭제 완료. 이제 깨끗한 상태에서 엑셀을 등록하세요."));
    }
  }

  function delItem(key) { if(confirm("삭제?")) db.ref('companies').child(key).remove(); }
  function switchTab(i) {
    document.querySelectorAll('.nav-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
    document.querySelectorAll('main').forEach((m, idx) => m.classList.toggle('active', idx === i));
  }
  function downloadSample() {
    const data = [["기업명", "기업코드", "운영기간", "상태", "연수원 URL"], ["기업A", "CODE01", "2026.01~", "운영중", "a.hunet.co.kr"]];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), "Sheet1");
    XLSX.writeFile(wb, "WorkHub_Sample.xlsx");
  }

  window.onload = init;
</script>
</body>
</html>
