<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --main-blue: #2563eb; --navy: #1e293b; --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0; --text: #334155; }
  body { font-family: 'Pretendard', sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  header { background: var(--white); padding: 25px; text-align: center; border-bottom: 1px solid var(--border); position: relative; }
  .logo { font-size: 28px; font-weight: 900; color: #0f172a; }
  .admin-btn { position: absolute; top: 20px; right: 20px; padding: 8px 15px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 13px; }
  .nav-tabs { margin-top: 20px; display: inline-flex; gap: 10px; background: #f1f5f9; padding: 5px; border-radius: 12px; }
  .nav-btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; background: transparent; color: #64748b; }
  .nav-btn.active { background: var(--main-blue); color: #fff; }
  main { max-width: 1300px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 1.8fr 1.1fr; gap: 30px; }
  .summary-bar { display: flex; gap: 15px; margin-bottom: 25px; }
  .summary-item { flex: 1; background: var(--white); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid var(--border); }
  .summary-val { font-size: 24px; font-weight: 800; color: var(--navy); }
  .card { background: var(--white); border-radius: 20px; padding: 30px; border: 1px solid var(--border); margin-bottom: 25px; }
  .card-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; color: var(--navy); border-left: 4px solid var(--main-blue); padding-left: 12px; }
  input, select { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px; box-sizing: border-box; background: #fcfdfe; }
  .btn-submit { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--main-blue); color: #fff; font-weight: 800; cursor: pointer; font-size: 16px; }
  .btn-file { background: var(--navy); margin-top: 10px; }
  .list-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .list-table th { text-align: left; padding: 12px; font-size: 13px; color: #94a3b8; border-bottom: 2px solid #f1f5f9; }
  .list-table td { padding: 15px 12px; border-bottom: 1px solid #f8fafc; font-size: 14px; }
  .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; background: #f1f5f9; }
  .badge.on { background: #dbeafe; color: var(--main-blue); }
  .del-btn { display: none; color: #ef4444; border: none; background: none; cursor: pointer; font-weight: bold; }
  .admin-mode .del-btn { display: inline-block; }
</style>
</head>
<body id="app-body">

<header>
  <button class="admin-btn" onclick="toggleAdmin()">⚙️ 관리자 모드</button>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active">🏢 기업관리시스템</button>
    <button class="nav-btn">🚀 워크허브</button>
  </div>
</header>

<main>
  <div>
    <div class="summary-bar">
      <div class="summary-item"><div>전체</div><div class="summary-val" id="cnt-all">0</div></div>
      <div class="summary-item"><div>운영중</div><div class="summary-val" id="cnt-on" style="color:var(--main-blue)">0</div></div>
    </div>
    <section class="card">
      <div class="card-title">기업 현황 리스트</div>
      <input type="text" id="search-input" placeholder="기업명 검색..." onkeyup="render()">
      <table class="list-table">
        <thead><tr><th>기업명</th><th>코드</th><th>상태</th><th>연수원 URL</th><th class="del-btn">관리</th></tr></thead>
        <tbody id="list-body"></tbody>
      </table>
    </section>
  </div>

  <div>
    <section class="card">
      <div class="card-title">기업 수기 등록</div>
      <input id="in-name" placeholder="기업명">
      <input id="in-code" placeholder="기업코드">
      <input id="in-url" placeholder="URL (000.hunet.co.kr)">
      <select id="in-status"><option value="운영중">운영중</option><option value="종료">종료</option></select>
      <button class="btn-submit" onclick="add()">데이터 등록</button>
    </section>
    <section class="card">
      <div class="card-title">파일 등록</div>
      <input type="file" id="file-input">
      <button class="btn-submit btn-file" onclick="alert('준비중입니다.')">엑셀 등록</button>
    </section>
  </div>
</main>

<script>
  // 캡처해주신 이미지(image_61952b.png)의 실제 설정값을 그대로 넣었습니다.
  const firebaseConfig = {
    apiKey: "AIzaSyAtn4kWV3_D18zivOHIEAkW09Lqt2ZjHqE",
    authDomain: "workhub-pro-be742.firebaseapp.com",
    databaseURL: "https://workhub-pro-be742-default-rtdb.firebaseio.com/",
    projectId: "workhub-pro-be742",
    storageBucket: "workhub-pro-be742.firebasestorage.app",
    messagingSenderId: "547958464107",
    appId: "1:547958464107:web:3c78c150e0b3c77969db2e"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let DATA = [], ADMIN = false;

  function load() {
    db.ref('/').on('value', (ss) => {
      const val = ss.val();
      DATA = val ? Object.entries(val).map(([k, v]) => ({ ...v, key: k })).filter(i => i.name) : [];
      document.getElementById('cnt-all').innerText = DATA.length;
      document.getElementById('cnt-on').innerText = DATA.filter(d => d.status === '운영중').length;
      render();
    });
  }

  function add() {
    const n = document.getElementById('in-name').value;
    if(!n) return alert("기업명을 입력하세요.");
    db.ref('/').push({
      name: n,
      code: document.getElementById('in-code').value,
      url: document.getElementById('in-url').value,
      status: document.getElementById('in-status').value
    }).then(() => {
      alert("등록 완료!");
      document.getElementById('in-name').value = "";
    });
  }

  function render() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const f = DATA.filter(d => d.name.toLowerCase().includes(q));
    document.getElementById('list-body').innerHTML = f.reverse().map(d => `
      <tr>
        <td style="font-weight:700;">${d.name}</td>
        <td>${d.code || '-'}</td>
        <td><span class="badge ${d.status==='운영중'?'on':''}">${d.status}</span></td>
        <td>${d.url || '-'}</td>
        <td><button class="del-btn" onclick="del('${d.key}')">삭제</button></td>
      </tr>`).join('');
  }

  function del(k) { if(confirm("삭제할까요?")) db.ref('/').child(k).remove(); }
  function toggleAdmin() {
    ADMIN = !ADMIN;
    document.getElementById('app-body').classList.toggle('admin-mode', ADMIN);
    render();
  }

  window.onload = load;
</script>
</body>
</html>
