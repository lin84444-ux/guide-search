<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro | 지식 아카이브</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    --bg-main: #f8fafc;
    --header-grad: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
    --card-bg: #ffffff;
    --primary: #6366f1;
    --secondary: #94a3b8;
    --accent: #f43f5e;
    --text-main: #1e293b;
    --text-sub: #475569;
    --border-color: #f1f5f9;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
  }

  body { 
    font-family: 'Pretendard', sans-serif; 
    margin: 0; background-color: var(--bg-main); color: var(--text-main);
    line-height: 1.6; word-break: keep-all;
  }

  header { 
    background: var(--header-grad); padding: 80px 20px 160px; text-align: center; 
    position: relative; z-index: 1; clip-path: ellipse(150% 100% at 50% 0%);
  }
  header h1 { margin: 0; font-size: 42px; font-weight: 900; letter-spacing: -2px; color: #334155; }
  header p { opacity: 0.8; font-weight: 500; margin-top: 12px; font-size: 18px; color: #64748b; }
  
  .admin-toggle-btn { 
    position: absolute; top: 30px; right: 40px; 
    background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.05); 
    padding: 10px 22px; border-radius: 14px; color: #475569; cursor: pointer; 
    backdrop-filter: blur(10px); transition: 0.3s; font-size: 13px; font-weight: 700;
  }

  main { 
    display: grid; grid-template-columns: 1.8fr 1fr; gap: 35px; max-width: 1400px; 
    margin: -100px auto 80px; padding: 0 25px; position: relative; z-index: 10; 
  }

  .card { 
    background: var(--card-bg); border-radius: 32px; padding: 35px; 
    box-shadow: var(--shadow); border: 1px solid #ffffff; transition: 0.3s;
  }

  .title-area { font-size: 22px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
  .title-area i { width: 8px; height: 24px; border-radius: 4px; }
  .guide-zone .title-area i { background: var(--primary); }
  .share-zone .title-area i { background: var(--accent); }
  .reg-zone .title-area i { background: var(--secondary); }

  .filter-bar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
  .filter-select { 
    padding: 10px 15px; border-radius: 12px; border: 1.5px solid var(--border-color);
    background: white; font-size: 13px; font-weight: 600; color: var(--text-sub); outline: none; cursor: pointer;
  }

  .input-group { display: flex; flex-direction: column; gap: 15px; }
  input, textarea { 
    padding: 16px; border: 1.5px solid var(--border-color); border-radius: 18px; 
    outline: none; font-size: 14px; background: #f8fafc; transition: 0.3s;
  }
  input:focus, textarea:focus { border-color: var(--primary); background: white; }

  button { padding: 16px; border: none; border-radius: 18px; cursor: pointer; font-weight: 800; transition: 0.2s; }
  .btn-blue { background: var(--primary); color: white; }
  .btn-orange { background: var(--accent); color: white; }
  .btn-navy { background: var(--secondary); color: white; }

  .list-item { background: #ffffff; padding: 25px; border-radius: 24px; margin-bottom: 20px; border: 1.5px solid #f8fafc; position: relative;}
  .badge { font-size: 12px; font-weight: 800; color: var(--primary); background: #eef2ff; padding: 6px 14px; border-radius: 12px; }

  .share-item { 
    background: #f8fafc; padding: 22px; border-radius: 22px; 
    margin: 5px 5px 15px 5px; border: 1.5px solid #f1f5f9; position: relative;
    box-sizing: border-box; 
  }
  .share-item.important {
    background: #fff1f2; border: 2.5px solid var(--accent);
    box-shadow: 0 4px 15px rgba(244, 63, 94, 0.1);
  }
  
  .important-badge { background: var(--accent); color: white; font-size: 10px; padding: 2px 8px; border-radius: 6px; margin-bottom: 8px; display: inline-block; }
  .share-time { font-size: 11px; color: #94a3b8; display: block; margin-top: 10px; }

  .admin-btns { margin-top: 15px; display: flex; gap: 8px; }
  .btn-sm { padding: 6px 14px; font-size: 11px; border-radius: 10px; background: #f1f5f9; color: var(--text-sub); border:none; cursor:pointer; font-weight: 700; }
  .btn-sm.del { color: var(--accent); }

  .excel-box {
    background: #f0f4ff; border: 2px dashed #c7d2fe; padding: 25px; border-radius: 24px; text-align: center; margin-bottom: 10px;
  }
  .sample-btn { 
    display: inline-block; margin-top: 12px; font-size: 12px; color: var(--primary); 
    background: white; border: 1px solid var(--primary); padding: 5px 15px; 
    border-radius: 10px; cursor: pointer; font-weight: 700;
  }
  .reset-link { font-size: 11px; color: #94a3b8; text-decoration: underline; cursor: pointer; margin-top: 15px; display: block; }

  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <button class="admin-toggle-btn" onclick="toggleAdmin()">⚙️ 관리자 모드</button>
  <h1>WorkHub Pro</h1>
  <p id="mode-text">팀의 지식을 체계적으로 관리하세요</p>
</header>

<main>
  <section class="card guide-zone">
    <div class="title-area"><i></i> 가이드 보관함</div>
    
    <div style="margin-bottom:25px;">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <input id="q" style="flex:1" placeholder="내용 또는 #키워드로 검색..." onkeyup="if(event.key==='Enter') renderGuides();">
            <button class="btn-blue" onclick="renderGuides()" style="padding:0 35px;">검색</button>
        </div>
        <div class="filter-bar">
            <select id="filter-cat" class="filter-select" onchange="renderGuides()">
                <option value="all">🏢 모든 기업명</option>
            </select>
            <select id="filter-type" class="filter-select" onchange="renderGuides()">
                <option value="all">📂 모든 키워드</option>
            </select>
            <select id="filter-sort" class="filter-select" onchange="renderGuides()">
                <option value="new">🕒 최근 등록순</option>
                <option value="old">⏳ 오래된순</option>
            </select>
        </div>
    </div>

    <div id="guide-result"></div>
  </section>

  <aside style="display: flex; flex-direction: column; gap: 30px;">
    <section class="card share-zone">
      <div class="title-area"><i></i> 오늘의 공유사항</div>
      <div id="share-result" style="max-height: 400px; overflow-y: auto; margin-bottom: 20px; padding: 5px;"></div>
      <div class="input-group">
          <textarea id="share-text" placeholder="새로운 소식을 공유해보세요..." rows="2"></textarea>
          <div style="display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--accent);">
            <input type="checkbox" id="is-important" style="width:17px; height:17px; cursor:pointer;">
            <label for="is-important" style="cursor:pointer;">‼️ 중요 공지 강조</label>
          </div>
          <button onclick="addShare()" class="btn-orange">공유하기</button>
      </div>
    </section>

    <section id="reg-card" class="card reg-zone">
      <div class="title-area"><i></i> 데이터 등록 센터</div>
      
      <div class="excel-box">
          <p style="font-size:14px; font-weight:800; color:var(--primary); margin:0;">📊 엑셀 파일 일괄 등록</p>
          <p style="font-size:11px; color:var(--text-sub); margin:8px 0 15px;">엑셀 작업 후 'CSV(쉼표로 분리)'로 저장해 주세요</p>
          <input type="file" id="excel-file" accept=".csv" style="font-size:12px; width:100%;" onchange="uploadExcel(this)">
          <div class="sample-btn" onclick="downloadSample()">Excel용 샘플 다운로드</div>
          <span class="reset-link" onclick="resetData()">전체 데이터 초기화(비우기)</span>
      </div>

      <div class="input-group">
          <p style="font-size:12px; font-weight:700; color:var(--secondary); margin-bottom:-5px;">직접 등록</p>
          <input id="new-category" placeholder="기업명">
          <input id="new-keywords" placeholder="키워드 (쉼표로 구분)">
          <textarea id="new-text" placeholder="내용을 입력하세요..." rows="3"></textarea>
          <button onclick="addGuide()" class="btn-navy">단일 저장</button>
      </div>
    </section>
  </aside>
</main>

<script>
  // 초기 데이터 설정 및 삭제 처리
  let GUIDE = JSON.parse(localStorage.getItem("guide") || "[]");
  let SHARES = JSON.parse(localStorage.getItem("shares") || "[]");
  let isAdmin = false;

  function resetData() {
    if(confirm("모든 가이드 데이터를 삭제하시겠습니까? (복구 불가)")) {
      GUIDE = [];
      localStorage.setItem("guide", JSON.stringify(GUIDE));
      location.reload();
    }
  }

  function initFilters() {
    const catSelect = document.getElementById("filter-cat");
    const typeSelect = document.getElementById("filter-type");
    const cats = [...new Set(GUIDE.map(i => i.category))].filter(Boolean);
    const types = [...new Set(GUIDE.flatMap(i => i.keywords || []))].filter(Boolean);
    catSelect.innerHTML = '<option value="all">🏢 모든 기업명</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
    typeSelect.innerHTML = '<option value="all">📂 모든 키워드</option>' + types.map(t => `<option value="${t}">${t}</option>`).join('');
  }

  function renderGuides() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const cat = document.getElementById("filter-cat").value;
    const type = document.getElementById("filter-type").value;
    const sort = document.getElementById("filter-sort").value;
    const container = document.getElementById("guide-result");

    let filtered = GUIDE.filter(item => {
        const matchQ = (item.text || "").toLowerCase().includes(q) || 
                       (item.category || "").toLowerCase().includes(q) ||
                       (item.keywords && item.keywords.some(k => k.toLowerCase().includes(q)));
        const matchCat = cat === "all" || item.category === cat;
        const matchType = type === "all" || (item.keywords && item.keywords.includes(type));
        return matchQ && matchCat && matchType;
    });

    if(sort === "old") filtered = [...filtered].reverse();

    container.innerHTML = filtered.map((item, idx) => `
        <div class="list-item">
            <span class="badge">${item.category}</span>
            <div style="margin:15px 0; font-weight:600; font-size:15px; color:#1e293b;">${item.text}</div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                ${item.keywords ? item.keywords.map(k => `<span style="font-size:11px; color:#6366f1; background:#f0f4ff; padding:2px 8px; border-radius:6px;">#${k}</span>`).join('') : ''}
            </div>
            ${isAdmin ? `
              <div class="admin-btns">
                <button class="btn-sm" onclick="editGuide(${idx})">수정</button>
                <button class="btn-sm del" onclick="deleteGuide(${idx})">삭제</button>
              </div>` : ''}
        </div>
    `).join('') || "<p style='text-align:center; color:#94a3b8; padding:50px 0;'>등록된 가이드가 없습니다.</p>";
  }

  // ★ 엑셀 전용 파싱 (엑셀의 따옴표 및 쉼표 처리 완벽 대응) ★
  function uploadExcel(input) {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const content = e.target.result;
        const lines = content.split(/\r?\n/).filter(l => l.trim() !== "");
        
        lines.slice(1).forEach(line => {
            // 엑셀 특유의 따옴표 내부 쉼표를 보호하는 정규식
            const regex = /(".*?"|[^",\t]+)(?=\s*,|\s*\t|\s*$)/g;
            let parts = line.match(regex) || [];
            let cleanParts = parts.map(p => p.trim().replace(/^"|"$/g, '').replace(/""/g, '"'));

            if (cleanParts.length >= 2) {
                const category = cleanParts[0];
                const keywords = cleanParts[1];
                const text = cleanParts.slice(2).join(', '); // 3번째 칸 이후는 모두 내용으로 병합

                if(category && text) {
                    GUIDE.unshift({
                        category: category,
                        keywords: keywords ? keywords.split(/[|/,]/).map(k => k.trim()).filter(Boolean) : [],
                        text: text
                    });
                }
            }
        });
        localStorage.setItem("guide", JSON.stringify(GUIDE));
        alert("엑셀 데이터가 성공적으로 반영되었습니다!");
        location.reload();
    };
    reader.readAsText(file, "UTF-8");
  }

  function downloadSample() {
    const csvContent = "\uFEFF기업명,키워드,내용\n삼성전자,출결|증빙,지각 시 사유서를 반드시 제출해야 합니다.\n현대모비스,복지|식권,식권 대장은 모바일 앱을 통해 사용 가능합니다.";
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "워크허브_샘플_양식.csv";
    link.click();
  }

  function addGuide() {
    const cat = document.getElementById("new-category").value;
    const txt = document.getElementById("new-text").value;
    const kw = document.getElementById("new-keywords").value;
    if(!cat || !txt) return alert("필수 정보를 입력하세요.");
    GUIDE.unshift({ category: cat, text: txt, keywords: kw.split(',').map(s=>s.trim()).filter(Boolean) });
    localStorage.setItem("guide", JSON.stringify(GUIDE));
    location.reload();
  }

  function renderShares() {
    const container = document.getElementById("share-result");
    container.innerHTML = SHARES.map((s, idx) => `
        <div class="share-item ${s.important ? 'important' : ''}">
            ${s.important ? '<span class="important-badge">URGENT</span>' : ''}
            <div style="font-size:15px; font-weight:600;">${s.text}</div>
            <span class="share-time">🕒 ${s.time}</span>
            ${isAdmin ? `<div class="admin-btns"><button class="btn-sm del" onclick="deleteShare(${idx})">삭제</button></div>` : ''}
        </div>
    `).join('') || "<p style='text-align:center; color:#94a3b8;'>소식이 없습니다.</p>";
  }

  function addShare() {
    const txt = document.getElementById("share-text").value;
    const imp = document.getElementById("is-important").checked;
    if(!txt) return;
    const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    SHARES.unshift({ text: txt, time: time, important: imp });
    localStorage.setItem("shares", JSON.stringify(SHARES));
    location.reload();
  }

  function toggleAdmin() {
    if (prompt("비밀번호 입력") === "6559") {
      isAdmin = !isAdmin;
      document.getElementById("mode-text").innerText = isAdmin ? "관리자 권한 활성화" : "팀의 지식을 체계적으로 관리하세요";
      renderGuides(); renderShares();
    }
  }

  function deleteGuide(idx) { if(confirm("삭제할까요?")) { GUIDE.splice(idx,1); localStorage.setItem("guide", JSON.stringify(GUIDE)); location.reload(); } }
  function deleteShare(idx) { if(confirm("삭제할까요?")) { SHARES.splice(idx,1); localStorage.setItem("shares", JSON.stringify(SHARES)); renderShares(); } }

  window.onload = () => { initFilters(); renderGuides(); renderShares(); };
</script>
</body>
</html>
