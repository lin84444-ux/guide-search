<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro | 정밀 검색 업데이트 v11</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --bg-color: #f4f7ff; --primary: #2563eb; --primary-light: #eff6ff; --text-dark: #1e293b; --text-light: #64748b; --white: #ffffff; --border: #e2e8f0; --accent: #ef4444; }
  body { font-family: 'Pretendard', sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-dark); }
  
  header { padding: 40px 20px 10px; text-align: center; position: relative; }
  .logo { font-size: 34px; font-weight: 900; color: #0f172a; margin-bottom: 25px; letter-spacing: -1px; }
  
  .admin-btn { position: absolute; top: 20px; right: 20px; padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--white); color: var(--text-light); font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.3s; z-index: 100; }
  .admin-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  .nav-tabs { display: inline-flex; background: var(--white); padding: 6px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
  .nav-btn { padding: 12px 25px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; background: transparent; color: var(--text-light); }
  .nav-btn.active { background: var(--primary); color: var(--white); }

  main { max-width: 1400px; margin: 0 auto 50px; padding: 0 20px; }
  .tab-content { display: none; grid-template-columns: 1.8fr 1.1fr; gap: 30px; }
  .tab-content.active { display: grid; }

  .card { background: var(--white); border-radius: 28px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.02); height: fit-content; margin-bottom: 25px; border: 1px solid rgba(0,0,0,0.03); }
  .card-title { font-size: 19px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .card-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 10px; }

  /* 상단 검색 영역 수정 */
  .search-container { display: flex; gap: 8px; margin-bottom: 20px; }
  .search-input { flex: 1; padding: 14px 20px; border-radius: 12px; border: 1.5px solid var(--border); background: #f8fafc; outline: none; font-size: 15px; margin-bottom: 0; }
  .search-input:focus { border-color: var(--primary); background: #fff; }
  .btn-search { padding: 0 25px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 800; cursor: pointer; transition: 0.2s; }
  .btn-search:hover { background: #1d4ed8; }

  /* 테이블 스타일 */
  .list-table { width: 100%; border-collapse: collapse; }
  .list-table th { text-align: left; padding: 12px; font-size: 12px; color: var(--text-light); border-bottom: 2px solid #f1f5f9; }
  .list-table td { padding: 16px 12px; border-bottom: 1px solid #f8fafc; font-size: 14px; }
  
  /* URL 텍스트 링크 강조 */
  .url-text-link { color: var(--primary); text-decoration: underline; font-weight: 700; font-size: 13px; cursor: pointer; }
  .url-text-link:hover { color: #1d4ed8; }

  input, textarea, select { width: 100%; box-sizing: border-box; padding: 14px; border-radius: 12px; border: 1.5px solid #f1f5f9; background: #f8fafc; margin-bottom: 12px; font-family: inherit; }
  .btn-primary { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 800; cursor: pointer; }
  
  .del-btn { display: none; border: none; cursor: pointer; background: #fff1f1; color: var(--accent); padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; }
  .admin-active .del-btn { display: inline-block; }

  .badge { padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; }
  .badge.on { background: var(--primary-light); color: var(--primary); }
  .badge.off { background: #f1f5f9; color: var(--text-light); }

  #loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:9999; justify-content:center; align-items:center; font-weight:800; color:var(--primary); }
</style>
</head>
<body id="main-body">

<div id="loading-overlay">⏳ 처리 중...</div>

<header>
  <button class="admin-btn" id="admin-toggle-btn" onclick="toggleAdmin()">⚙️ 관리자 모드</button>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab('corp-tab', this)">🏢 기업관리시스템</button>
    <button class="nav-btn" onclick="switchTab('guide-tab', this)">🚀 워크허브</button>
  </div>
</header>

<main>
  <div id="corp-tab" class="tab-content active">
    <div>
      <section class="card">
        <div class="card-title">기업 현황 리스트</div>
        <div class="search-container">
          <input type="text" id="unified-search" class="search-input" placeholder="기업명 또는 코드를 입력하세요" onkeyup="renderCorps()">
          <button class="btn-search" onclick="renderCorps()">검색</button>
        </div>
        <table class="list-table">
          <thead><tr><th>기업명</th><th>코드</th><th>운영기간</th><th>상태</th><th>연수원 URL</th><th class="del-btn">관리</th></tr></thead>
          <tbody id="corp-list-body"></tbody>
        </table>
      </section>
    </div>
    
    <div class="side-col">
      <section class="card">
        <div class="card-title">기업 수기 등록</div>
        <input id="in-c-name" placeholder="기업명">
        <input id="in-c-code" placeholder="기업코드">
        <input id="in-c-url" placeholder="URL (예: 000.hunet.co.kr)">
        <select id="in-c-status"><option value="운영중">운영중</option><option value="종료">종료</option></select>
        <input id="in-c-period" placeholder="운영기간 (~)">
        <button class="btn-primary" onclick="addCorp()">수기 등록</button>
      </section>
      <section class="card">
        <div class="card-title">파일 일괄 등록</div>
        <input type="file" id="csv-file" style="font-size:11px;">
        <button class="btn-primary" style="background:#1e293b;" onclick="uploadFile()">파일 등록하기</button>
      </section>
    </div>
  </div>

  <div id="guide-tab" class="tab-content">
    <div>
      <section class="card">
        <div class="card-title">워크허브 가이드</div>
        <input type="text" id="g-search" placeholder="가이드 내용 검색..." onkeyup="renderGuides()">
        <div id="guide-list-area"></div>
      </section>
    </div>
    <div class="side-col">
      <section class="card">
        <div class="card-title">신규 가이드 등록</div>
        <textarea id="in-g-text" placeholder="내용을 입력하세요..." rows="4"></textarea>
        <button class="btn-primary" onclick="addGuide()">가이드 저장</button>
      </section>
    </div>
  </div>
</main>

<script>
  let DB_CORPS = JSON.parse(localStorage.getItem("wh_v11_c") || "[]");
  let DB_GUIDES = JSON.parse(localStorage.getItem("wh_v11_g") || "[]");
  let IS_ADMIN = false;

  function toggleAdmin() {
    if(!IS_ADMIN) {
      if(prompt("비밀번호(6559)") === "6559") {
        IS_ADMIN = true;
        document.getElementById("main-body").classList.add("admin-active");
        document.getElementById("admin-toggle-btn").innerText = "🔓 관리자 ON";
      }
    } else {
      IS_ADMIN = false;
      document.getElementById("main-body").classList.remove("admin-active");
      document.getElementById("admin-toggle-btn").innerText = "⚙️ 관리자 모드";
    }
    renderCorps(); renderGuides();
  }

  function switchTab(id, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }

  function addCorp() {
    const name = document.getElementById("in-c-name").value.trim();
    if(!name) return alert("기업명을 입력하세요.");
    DB_CORPS.unshift({
      name, code: document.getElementById("in-c-code").value.trim(),
      url: document.getElementById("in-c-url").value.trim(),
      status: document.getElementById("in-c-status").value,
      period: document.getElementById("in-c-period").value || "~"
    });
    saveDB(); alert("등록 완료");
  }

  function uploadFile() {
    const file = document.getElementById("csv-file").files[0];
    if(!file) return alert("파일을 선택하세요.");
    document.getElementById("loading-overlay").style.display = "flex";
    const reader = new FileReader();
    reader.onload = (e) => {
      const lines = e.target.result.split(/\r?\n/);
      let hIdx = lines.findIndex(l => l.includes("기업명"));
      lines.slice(hIdx + 1).forEach(row => {
        if(!row.trim()) return;
        const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || row.split(',');
        const p = cols.map(v => v.replace(/^"|"$/g, '').trim());
        const period = p[2] || "~";
        const status = (period === "~" || period.includes("202")) ? "운영중" : "종료";
        DB_CORPS.push({ name: p[0], code: p[1], period: period, status: status, url: p[3] || '' });
      });
      saveDB(); document.getElementById("loading-overlay").style.display = "none"; alert("등록 완료");
    };
    reader.readAsText(file, "UTF-8");
  }

  function renderCorps() {
    const query = document.getElementById("unified-search").value.toLowerCase().trim();
    
    // 기업명 포함 또는 기업코드 100% 일치 필터링
    const filtered = DB_CORPS.filter(c => {
      const nameMatch = c.name.toLowerCase().includes(query);
      const codeMatch = String(c.code) === query;
      return nameMatch || codeMatch;
    });

    const tbody = document.getElementById("corp-list-body");
    tbody.innerHTML = filtered.map((c, i) => {
      // URL 링크화 로직
      const rawUrl = c.url || '';
      const displayUrl = rawUrl.replace(/^https?:\/\//, '');
      const fullUrl = rawUrl ? (rawUrl.startsWith('http') ? rawUrl : 'http://' + rawUrl) : '';

      return `
        <tr>
          <td style="font-weight:800;">${c.name}</td>
          <td>${c.code}</td>
          <td style="font-size:12px; color:var(--text-light);">${c.period}</td>
          <td><span class="badge ${c.status === '운영중' ? 'on' : 'off'}">${c.status}</span></td>
          <td>
            ${rawUrl ? `<a href="${fullUrl}" target="_blank" class="url-text-link">${displayUrl}</a>` : '-'}
          </td>
          <td><button class="del-btn" onclick="deleteItem('corp', ${i})">삭제</button></td>
        </tr>`;
    }).join('');
  }

  function addGuide() {
    const text = document.getElementById("in-g-text").value.trim();
    if(!text) return alert("내용 입력 필수");
    DB_GUIDES.unshift({ text }); saveDB(); 
    document.getElementById("in-g-text").value = "";
  }

  function renderGuides() {
    const q = document.getElementById("g-search").value.toLowerCase();
    const filtered = DB_GUIDES.filter(g => g.text.toLowerCase().includes(q));
    document.getElementById("guide-list-area").innerHTML = filtered.map((g, i) => `
      <div class="card" style="padding:20px; margin-bottom:15px;">
        <div style="white-space:pre-wrap; font-weight:700;">${g.text}</div>
        <div style="margin-top:10px;"><button class="del-btn" onclick="deleteItem('guide', ${i})">삭제</button></div>
      </div>`).join('');
  }

  function deleteItem(type, i) {
    if(!confirm("삭제하시겠습니까?")) return;
    if(type==='corp') DB_CORPS.splice(i,1); else DB_GUIDES.splice(i,1);
    saveDB();
  }

  function saveDB() {
    localStorage.setItem("wh_v11_c", JSON.stringify(DB_CORPS));
    localStorage.setItem("wh_v11_g", JSON.stringify(DB_GUIDES));
    renderCorps(); renderGuides();
  }

  window.onload = () => { renderCorps(); renderGuides(); };
</script>
</body>
</html>
