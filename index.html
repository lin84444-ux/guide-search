<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro | 통합 지식 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    --bg-main: #f8fafc;
    --header-grad: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
    --card-bg: #ffffff;
    --primary: #6366f1;
    --secondary: #94a3b8;
    --accent: #f43f5e;
    --success: #10b981;
    --text-main: #1e293b;
    --text-sub: #475569;
    --border-color: #f1f5f9;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
  }

  body { 
    font-family: 'Pretendard', sans-serif; 
    margin: 0; background-color: var(--bg-main); color: var(--text-main);
    line-height: 1.6; word-break: keep-all;
  }

  header { 
    background: var(--header-grad); padding: 60px 20px 120px; text-align: center; 
    position: relative; z-index: 1; clip-path: ellipse(150% 100% at 50% 0%);
  }
  header h1 { margin: 0; font-size: 42px; font-weight: 900; letter-spacing: -2px; color: #334155; }
  header p { opacity: 0.8; font-weight: 500; margin-top: 12px; font-size: 18px; color: #64748b; }
  
  .admin-toggle-btn { 
    position: absolute; top: 30px; right: 40px; 
    background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.05); 
    padding: 10px 22px; border-radius: 14px; color: #475569; cursor: pointer; 
    backdrop-filter: blur(10px); transition: 0.3s; font-size: 13px; font-weight: 700;
  }

  /* 메인 레이아웃 구성 */
  main { 
    display: grid; grid-template-columns: 2.2fr 1fr; gap: 30px; max-width: 1450px; 
    margin: -60px auto 80px; padding: 0 25px; position: relative; z-index: 10; 
  }

  .card { 
    background: var(--card-bg); border-radius: 28px; padding: 30px; 
    box-shadow: var(--shadow); border: 1px solid #ffffff; margin-bottom: 25px;
  }

  /* 탭 메뉴 스타일 */
  .tab-container { display: flex; gap: 15px; margin-bottom: 25px; }
  .tab-btn { 
    padding: 12px 24px; border-radius: 15px; border: none; cursor: pointer; 
    font-weight: 800; background: #e2e8f0; color: #64748b; transition: 0.3s;
  }
  .tab-btn.active { background: var(--primary); color: white; }

  .title-area { font-size: 20px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
  .title-area i { width: 6px; height: 20px; border-radius: 3px; }
  .guide-zone .title-area i { background: var(--primary); }
  .company-zone .title-area i { background: var(--success); }
  .share-zone .title-area i { background: var(--accent); }

  /* 테이블 & 리스트 공통 스타일 */
  .table-wrapper { overflow-x: auto; border-radius: 15px; border: 1px solid var(--border-color); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: #f8fafc; padding: 15px; text-align: left; color: var(--text-sub); border-bottom: 2px solid var(--border-color); }
  td { padding: 15px; border-bottom: 1px solid var(--border-color); }
  
  .input-group { display: flex; flex-direction: column; gap: 12px; }
  input, textarea, select { 
    padding: 14px; border: 1.5px solid var(--border-color); border-radius: 14px; 
    outline: none; font-size: 14px; background: #f8fafc; transition: 0.3s;
  }
  input:focus { border-color: var(--primary); background: white; }

  button { padding: 14px; border: none; border-radius: 14px; cursor: pointer; font-weight: 700; transition: 0.2s; }
  .btn-blue { background: var(--primary); color: white; }
  .btn-green { background: var(--success); color: white; }
  .btn-orange { background: var(--accent); color: white; }

  /* 팀원 코드의 통계 카드 스타일링 */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
  .stat-mini { background: #f1f5f9; padding: 15px; border-radius: 20px; text-align: center; }
  .stat-mini h4 { margin: 0; font-size: 22px; color: var(--primary); }
  .stat-mini p { margin: 5px 0 0; font-size: 12px; font-weight: 600; color: var(--text-sub); }

  .hidden { display: none; }

  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <button class="admin-toggle-btn" onclick="toggleAdmin()">⚙️ 관리자 모드</button>
  <h1>WorkHub Pro</h1>
  <p id="mode-text">통합 지식 및 인프라 관리 시스템</p>
</header>

<main>
  <div class="content-area">
    <div class="tab-container">
      <button class="tab-btn active" onclick="switchTab('guide')">📖 가이드 보관함</button>
      <button class="tab-btn" onclick="switchTab('company')">🏢 기업 인프라 관리</button>
    </div>

    <section id="guide-section" class="card guide-zone">
      <div class="title-area"><i></i> 가이드 보관함</div>
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        <input id="q" style="flex:1" placeholder="가이드 검색..." onkeyup="if(event.key==='Enter') renderGuides();">
        <button class="btn-blue" onclick="renderGuides()" style="padding:0 30px;">검색</button>
      </div>
      <div id="guide-result"></div>
    </section>

    <section id="company-section" class="card company-zone hidden">
      <div class="title-area"><i></i> 기업 인프라 현황</div>
      
      <div class="stats-row">
        <div class="stat-mini"><h4 id="totalCount">0</h4><p>전체 기업</p></div>
        <div class="stat-mini"><h4 id="activeCount" style="color:var(--success)">0</h4><p>운영 중</p></div>
        <div class="stat-mini"><h4 id="inactiveCount" style="color:var(--accent)">0</h4><p>종료</p></div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>기업명</th>
              <th>코드</th>
              <th>운영여부</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="companyTable"></tbody>
        </table>
      </div>
    </section>
  </div>

  <aside>
    <section class="card share-zone">
      <div class="title-area"><i></i> 오늘의 공유사항</div>
      <div id="share-result" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;"></div>
      <div class="input-group">
        <textarea id="share-text" placeholder="공유사항 입력..." rows="2"></textarea>
        <button onclick="addShare()" class="btn-orange">공유하기</button>
      </div>
    </section>

    <section class="card reg-zone">
      <div class="title-area"><i></i> 데이터 등록 센터</div>
      
      <div id="reg-guide-form" class="input-group">
        <p style="font-size:12px; font-weight:bold; color:var(--primary);">[가이드 등록]</p>
        <input id="new-category" placeholder="기업명">
        <textarea id="new-text" placeholder="가이드 내용..." rows="2"></textarea>
        <button onclick="addGuide()" class="btn-blue">가이드 저장</button>
      </div>

      <div id="reg-company-form" class="input-group hidden">
        <p style="font-size:12px; font-weight:bold; color:var(--success);">[기업 등록]</p>
        <input id="comp-name" placeholder="기업명">
        <input id="comp-code" placeholder="기업코드">
        <select id="comp-status">
          <option value="운영중">운영중</option>
          <option value="종료">종료</option>
        </select>
        <button onclick="addCompany()" class="btn-green">기업 정보 등록</button>
      </div>
      
      <div style="margin-top:20px; padding-top:20px; border-top:1px solid #eee;">
        <p style="font-size:11px; color:#94a3b8; margin-bottom:10px;">엑셀/CSV 일괄 업로드</p>
        <input type="file" id="bulk-file" style="font-size:11px; width:100%;">
      </div>
    </section>
  </aside>
</main>

<script>
  // 데이터 로드
  let GUIDE = JSON.parse(localStorage.getItem("guide") || "[]");
  let COMPANIES = JSON.parse(localStorage.getItem("companies") || "[]");
  let SHARES = JSON.parse(localStorage.getItem("shares") || "[]");
  let isAdmin = false;

  // 탭 전환 로직
  function switchTab(type) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    if(type === 'guide') {
      document.getElementById('guide-section').classList.remove('hidden');
      document.getElementById('reg-guide-form').classList.remove('hidden');
      document.getElementById('company-section').classList.add('hidden');
      document.getElementById('reg-company-form').classList.add('hidden');
    } else {
      document.getElementById('guide-section').classList.add('hidden');
      document.getElementById('reg-guide-form').classList.add('hidden');
      document.getElementById('company-section').classList.remove('hidden');
      document.getElementById('reg-company-form').classList.remove('hidden');
      renderCompanies();
    }
  }

  // [기존 1번 기능] 가이드 렌더링
  function renderGuides() {
    const q = document.getElementById("q").value.toLowerCase();
    const container = document.getElementById("guide-result");
    const filtered = GUIDE.filter(i => i.text.toLowerCase().includes(q) || i.category.toLowerCase().includes(q));

    container.innerHTML = filtered.map((item, idx) => `
      <div style="background:#f8fafc; padding:15px; border-radius:15px; margin-bottom:10px;">
        <span style="font-size:11px; font-weight:800; color:var(--primary); background:#eef2ff; padding:4px 8px; border-radius:8px;">${item.category}</span>
        <div style="margin-top:8px; font-weight:600; font-size:14px;">${item.text}</div>
        ${isAdmin ? `<button onclick="deleteGuide(${idx})" style="color:var(--accent); font-size:11px; background:none; padding:5px 0;">삭제</button>` : ''}
      </div>
    `).join('') || "<p style='text-align:center; color:#94a3b8; font-size:13px;'>데이터가 없습니다.</p>";
  }

  // [기존 2번 기능] 기업 관리 렌더링 및 통계
  function renderCompanies() {
    const tbody = document.getElementById("companyTable");
    tbody.innerHTML = COMPANIES.map((c, idx) => `
      <tr>
        <td><strong>${c.name}</strong></td>
        <td>${c.code}</td>
        <td style="color:${c.status === '운영중' ? 'var(--success)' : 'var(--accent)'}; font-weight:bold;">${c.status}</td>
        <td><button onclick="deleteCompany(${idx})" style="color:var(--accent); border:none; background:none; cursor:pointer;">❌</button></td>
      </tr>
    `).join('');
    updateStats();
  }

  function updateStats() {
    document.getElementById("totalCount").innerText = COMPANIES.length;
    document.getElementById("activeCount").innerText = COMPANIES.filter(c => c.status === '운영중').length;
    document.getElementById("inactiveCount").innerText = COMPANIES.filter(c => c.status === '종료').length;
  }

  // 데이터 추가 함수들
  function addGuide() {
    const cat = document.getElementById("new-category").value;
    const txt = document.getElementById("new-text").value;
    if(!cat || !txt) return alert("내용을 입력하세요.");
    GUIDE.unshift({ category: cat, text: txt });
    localStorage.setItem("guide", JSON.stringify(GUIDE));
    renderGuides();
    document.getElementById("new-text").value = "";
  }

  function addCompany() {
    const name = document.getElementById("comp-name").value;
    const code = document.getElementById("comp-code").value;
    const status = document.getElementById("comp-status").value;
    if(!name || !code) return alert("기업 정보를 입력하세요.");
    COMPANIES.unshift({ name, code, status });
    localStorage.setItem("companies", JSON.stringify(COMPANIES));
    renderCompanies();
    document.getElementById("comp-name").value = "";
    document.getElementById("comp-code").value = "";
  }

  // 삭제 및 기타 공통 기능
  function deleteGuide(idx) { GUIDE.splice(idx,1); localStorage.setItem("guide", JSON.stringify(GUIDE)); renderGuides(); }
  function deleteCompany(idx) { COMPANIES.splice(idx,1); localStorage.setItem("companies", JSON.stringify(COMPANIES)); renderCompanies(); }

  function addShare() {
    const txt = document.getElementById("share-text").value;
    if(!txt) return;
    SHARES.unshift({ text: txt, time: new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}) });
    localStorage.setItem("shares", JSON.stringify(SHARES));
    renderShares();
    document.getElementById("share-text").value = "";
  }

  function renderShares() {
    document.getElementById("share-result").innerHTML = SHARES.map(s => `
      <div style="padding:12px; background:#fff1f2; border-radius:12px; margin-bottom:8px; border-left:4px solid var(--accent);">
        <div style="font-size:13px; font-weight:600;">${s.text}</div>
        <div style="font-size:10px; color:#94a3b8; margin-top:5px;">🕒 ${s.time}</div>
      </div>
    `).join('');
  }

  function toggleAdmin() {
    if (prompt("관리자 암호 입력") === "6559") {
      isAdmin = !isAdmin;
      document.getElementById("mode-text").innerText = isAdmin ? "관리자 권한 활성화됨" : "통합 지식 및 인프라 관리 시스템";
      renderGuides(); renderCompanies();
    }
  }

  window.onload = () => { renderGuides(); renderShares(); renderCompanies(); };
</script>
</body>
</html>
