<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro | 통합 관리 시스템</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    --bg-main: #f8fafc;
    --header-grad: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
    --card-bg: #ffffff;
    --primary: #6366f1; /* 메인 블루 */
    --primary-light: #eef2ff;
    --secondary: #94a3b8;
    --accent: #3b82f6; /* 강조 블루 */
    --text-main: #1e293b;
    --text-sub: #475569;
    --border-color: #f1f5f9;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
  }

  body { 
    font-family: 'Pretendard', sans-serif; 
    margin: 0; background-color: var(--bg-main); color: var(--text-main);
    line-height: 1.6; word-break: keep-all;
  }

  header { 
    background: var(--header-grad); padding: 60px 20px 120px; text-align: center; 
    position: relative; z-index: 1; clip-path: ellipse(150% 100% at 50% 0%);
  }
  header h1 { margin: 0; font-size: 42px; font-weight: 900; letter-spacing: -2px; color: #334155; }
  
  /* 탭 메뉴 스타일 */
  .nav-tabs {
    display: flex; justify-content: center; gap: 15px; margin-top: 30px;
  }
  .nav-btn {
    padding: 12px 30px; border-radius: 50px; border: 2px solid transparent;
    background: white; color: var(--text-sub); font-weight: 700; cursor: pointer;
    transition: 0.3s; box-shadow: var(--shadow);
  }
  .nav-btn.active {
    background: var(--primary); color: white; border-color: var(--primary);
  }

  .admin-toggle-btn { 
    position: absolute; top: 30px; right: 40px; 
    background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.05); 
    padding: 10px 22px; border-radius: 14px; color: #475569; cursor: pointer; 
    backdrop-filter: blur(10px); transition: 0.3s; font-size: 13px; font-weight: 700;
  }

  main { 
    max-width: 1400px; margin: -60px auto 80px; padding: 0 25px; position: relative; z-index: 10; 
  }

  .content-section { display: none; grid-template-columns: 1.8fr 1fr; gap: 35px; }
  .content-section.active { display: grid; }

  .card { 
    background: var(--card-bg); border-radius: 32px; padding: 35px; 
    box-shadow: var(--shadow); border: 1px solid #ffffff; transition: 0.3s;
  }

  .title-area { font-size: 22px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
  .title-area i { width: 8px; height: 24px; border-radius: 4px; background: var(--primary); }

  /* 입력 및 필터 스타일 */
  .input-group { display: flex; flex-direction: column; gap: 12px; }
  input, textarea, select { 
    padding: 16px; border: 1.5px solid var(--border-color); border-radius: 18px; 
    outline: none; font-size: 14px; background: #f8fafc; transition: 0.3s;
  }
  input:focus, textarea:focus { border-color: var(--primary); background: white; }

  button { padding: 16px; border: none; border-radius: 18px; cursor: pointer; font-weight: 800; transition: 0.2s; }
  .btn-blue { background: var(--primary); color: white; }
  .btn-light { background: var(--primary-light); color: var(--primary); }

  /* 리스트 아이템 */
  .list-item { background: #ffffff; padding: 25px; border-radius: 24px; margin-bottom: 20px; border: 1.5px solid #f8fafc; position: relative;}
  .badge { font-size: 12px; font-weight: 800; color: var(--primary); background: var(--primary-light); padding: 6px 14px; border-radius: 12px; }
  
  .excel-box {
    background: #f0f4ff; border: 2px dashed #c7d2fe; padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 15px;
  }

  #trash-notif { 
    display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
    background: #1e293b; color: white; padding: 12px 25px; border-radius: 15px; 
    z-index: 9999; align-items: center; gap: 15px;
  }

  @media (max-width: 1000px) { .content-section { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <button class="admin-toggle-btn" onclick="toggleAdmin()">⚙️ 관리자 모드</button>
  <h1>WorkHub Pro</h1>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab('corp-tab', this)">🏢 기업관리시스템</button>
    <button class="nav-btn" onclick="switchTab('hub-tab', this)">🚀 워크허브</button>
  </div>
</header>

<main>
  <section id="corp-tab" class="content-section active">
    <div class="card">
      <div class="title-area"><i></i> 기업 현황 관리</div>
      <div class="input-group" style="margin-bottom: 25px;">
        <input id="corp-search" placeholder="기업명으로 검색..." onkeyup="renderCorps()">
      </div>
      <div id="corp-list"></div>
    </div>

    <aside class="card">
      <div class="title-area"><i></i> 신규 기업 등록</div>
      <div class="excel-box">
        <p style="font-size:13px; font-weight:700; color:var(--primary);">엑셀/CSV 일괄 등록</p>
        <input type="file" id="excel-file" accept=".csv,.txt" style="font-size:11px; width:100%;" onchange="uploadExcel(this)">
      </div>
      <div class="input-group">
        <input id="new-corp-name" placeholder="기업명 입력">
        <input id="new-corp-info" placeholder="주요 업종/특이사항">
        <button onclick="addCorp()" class="btn-blue">기업 추가하기</button>
      </div>
    </aside>
  </section>

  <section id="hub-tab" class="content-section">
    <div class="card">
      <div class="title-area"><i></i> 가이드 보관함</div>
      <div style="display:flex; gap:10px; margin-bottom:20px;">
        <input id="q" style="flex:1" placeholder="가이드 내용 검색..." onkeyup="renderGuides()">
        <select id="filter-cat" onchange="renderGuides()" style="width:150px;"></select>
      </div>
      <div id="guide-result"></div>
    </div>

    <aside>
        <div class="card share-zone" style="margin-bottom:30px;">
          <div class="title-area"><i></i> 오늘의 공유사항</div>
          <div id="share-result" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;"></div>
          <div class="input-group">
            <textarea id="share-text" placeholder="공유할 내용을 입력하세요..." rows="2"></textarea>
            <button onclick="addShare()" class="btn-blue">소식 공유</button>
          </div>
        </div>
        
        <div class="card reg-zone">
          <div class="title-area"><i></i> 가이드 등록</div>
          <div class="input-group">
            <input id="new-category" placeholder="대상 기업명">
            <input id="new-keywords" placeholder="키워드 (쉼표 구분)">
            <textarea id="new-text" placeholder="상세 가이드 내용" rows="3"></textarea>
            <button onclick="addGuide()" class="btn-light">가이드 저장</button>
          </div>
        </div>
    </aside>
  </section>
</main>

<div id="trash-notif">
  <span>🗑️ 데이터가 처리되었습니다.</span>
</div>

<script>
  let GUIDE = JSON.parse(localStorage.getItem("guide") || "[]");
  let SHARES = JSON.parse(localStorage.getItem("shares") || "[]");
  let CORPS = JSON.parse(localStorage.getItem("corps") || "[]");
  let isAdmin = false;

  // 탭 전환 함수
  function switchTab(tabId, btn) {
    document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
    if(tabId === 'hub-tab') { initFilters(); renderGuides(); }
    if(tabId === 'corp-tab') { renderCorps(); }
  }

  // 기업 관리 로직
  function renderCorps() {
    const q = document.getElementById("corp-search").value.toLowerCase();
    const container = document.getElementById("corp-list");
    const filtered = CORPS.filter(c => c.name.toLowerCase().includes(q));
    
    container.innerHTML = filtered.map((c, idx) => `
      <div class="list-item">
        <div style="font-weight:800; font-size:18px;">${c.name}</div>
        <div style="color:var(--text-sub); font-size:14px;">${c.info}</div>
        ${isAdmin ? `<button class="btn-sm" style="margin-top:10px; color:red;" onclick="deleteCorp(${idx})">삭제</button>` : ''}
      </div>
    `).join('') || "<p style='text-align:center; padding:40px; color:#94a3b8;'>등록된 기업이 없습니다.</p>";
  }

  function addCorp() {
    const name = document.getElementById("new-corp-name").value;
    const info = document.getElementById("new-corp-info").value;
    if(!name) return alert("기업명을 입력하세요.");
    CORPS.unshift({ name, info });
    localStorage.setItem("corps", JSON.stringify(CORPS));
    document.getElementById("new-corp-name").value = "";
    document.getElementById("new-corp-info").value = "";
    renderCorps();
  }

  // 기존 워크허브 로직 (유지)
  function initFilters() {
    const catSelect = document.getElementById("filter-cat");
    const cats = [...new Set(GUIDE.map(i => i.category))].filter(Boolean);
    catSelect.innerHTML = '<option value="all">전체 기업</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  function renderGuides() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const cat = document.getElementById("filter-cat").value;
    const container = document.getElementById("guide-result");

    let filtered = GUIDE.filter(item => {
        const matchQ = (item.text||"").toLowerCase().includes(q);
        const matchCat = cat === "all" || item.category === cat;
        return matchQ && matchCat;
    });

    container.innerHTML = filtered.map((item, idx) => `
        <div class="list-item">
            <span class="badge">${item.category}</span>
            <div style="margin:15px 0; font-weight:600;">${item.text}</div>
            <div style="display:flex; gap:6px;">
                ${item.keywords ? item.keywords.map(k => `<span style="font-size:11px; color:var(--primary); background:#f0f4ff; padding:2px 8px; border-radius:6px;">#${k}</span>`).join('') : ''}
            </div>
        </div>
    `).join('') || "<p style='text-align:center; color:#94a3b8; padding:50px 0;'>검색 결과가 없습니다.</p>";
  }

  function addGuide() {
    const cat = document.getElementById("new-category").value;
    const txt = document.getElementById("new-text").value;
    const kw = document.getElementById("new-keywords").value;
    if(!cat || !txt) return alert("필수 정보를 입력하세요.");
    GUIDE.unshift({ category: cat, text: txt, keywords: kw.split(',').map(s=>s.trim()) });
    localStorage.setItem("guide", JSON.stringify(GUIDE));
    renderGuides();
    initFilters();
  }

  function renderShares() {
    const container = document.getElementById("share-result");
    container.innerHTML = SHARES.map(s => `
        <div style="background:#f8fafc; padding:15px; border-radius:15px; margin-bottom:10px; border-left:4px solid var(--primary);">
            <div style="font-size:14px; font-weight:600;">${s.text}</div>
            <span style="font-size:11px; color:#94a3b8;">🕒 ${s.time}</span>
        </div>
    `).join('');
  }

  function addShare() {
    const txt = document.getElementById("share-text").value;
    if(!txt) return;
    const time = new Date().toLocaleTimeString();
    SHARES.unshift({ text: txt, time: time });
    localStorage.setItem("shares", JSON.stringify(SHARES));
    document.getElementById("share-text").value = "";
    renderShares();
  }

  function toggleAdmin() {
    if (prompt("비밀번호를 입력하세요") === "6559") {
      isAdmin = !isAdmin;
      alert(isAdmin ? "관리자 모드 활성화" : "관리자 모드 해제");
      renderCorps(); renderGuides();
    }
  }

  window.onload = () => { 
    renderCorps();
    renderShares(); 
  };
</script>
</body>
</html>
