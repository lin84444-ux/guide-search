<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro | 최종 통합 관리</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --bg-color: #f4f7ff; --primary: #2563eb; --primary-hover: #1d4ed8; --primary-light: #eff6ff; --text-dark: #1e293b; --text-light: #64748b; --white: #ffffff; --border: #e2e8f0; --accent: #ef4444; }
  body { font-family: 'Pretendard', sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-dark); }
  header { padding: 30px 20px 10px; text-align: center; position: relative; }
  .logo { font-size: 32px; font-weight: 900; color: #0f172a; margin-bottom: 20px; letter-spacing: -1px; }
  .admin-btn { position: absolute; top: 20px; right: 20px; padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--white); color: var(--text-light); font-weight: 800; cursor: pointer; }
  .nav-tabs { display: inline-flex; background: var(--white); padding: 6px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
  .nav-btn { padding: 12px 25px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; background: transparent; color: var(--text-light); }
  .nav-btn.active { background: var(--primary); color: var(--white); }
  main { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
  .tab-content { display: none; grid-template-columns: 1.8fr 1.1fr; gap: 30px; }
  .tab-content.active { display: grid; }
  .summary-bar { display: flex; gap: 15px; margin-bottom: 25px; }
  .summary-item { flex: 1; background: var(--white); padding: 20px; border-radius: 22px; text-align: center; border: 1px solid rgba(0,0,0,0.03); }
  .summary-label { font-size: 13px; color: var(--text-light); font-weight: 700; margin-bottom: 8px; }
  .summary-value { font-size: 24px; font-weight: 900; }
  .summary-value.on { color: var(--primary); }
  .card { background: var(--white); border-radius: 28px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.02); margin-bottom: 25px; border: 1px solid rgba(0,0,0,0.03); }
  .card-title { font-size: 19px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .card-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 10px; }
  .search-area { display: flex; gap: 10px; margin-bottom: 25px; }
  .search-input { flex: 1; padding: 16px 20px; border-radius: 14px; border: 1.5px solid var(--border); font-size: 15px; outline: none; }
  .list-table { width: 100%; border-collapse: collapse; }
  .list-table th { text-align: left; padding: 12px; font-size: 12px; color: var(--text-light); border-bottom: 2px solid #f1f5f9; }
  .list-table td { padding: 16px 12px; border-bottom: 1px solid #f8fafc; font-size: 14px; }
  .badge { padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; }
  .badge.on { background: var(--primary-light); color: var(--primary); }
  .badge.off { background: #f1f5f9; color: var(--text-light); }
  input, textarea, select { width: 100%; box-sizing: border-box; padding: 14px; border-radius: 12px; border: 1.5px solid #f1f5f9; background: #f8fafc; margin-bottom: 12px; }
  .btn-primary { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--primary); color: white; font-weight: 800; cursor: pointer; font-size: 15px; }
  .del-btn { display: none; border: none; cursor: pointer; background: #fff1f1; color: var(--accent); padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; }
  .admin-active .del-btn { display: inline-block; }
</style>
</head>
<body id="main-body">

<header>
  <button class="admin-btn" onclick="toggleAdmin()">⚙️ 관리 모드</button>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab('corp-tab', this)">🏢 기업관리</button>
  </div>
</header>

<main>
  <div id="corp-tab" class="tab-content active">
    <div>
      <div class="summary-bar">
        <div class="summary-item"><div class="summary-label">전체</div><div class="summary-value" id="count-all">0</div></div>
        <div class="summary-item"><div class="summary-label">운영중</div><div class="summary-value on" id="count-on">0</div></div>
      </div>
      <section class="card">
        <div class="card-title">기업 현황 리스트</div>
        <div class="search-area">
          <input type="text" id="u-search" class="search-input" placeholder="검색어를 입력하세요" onkeyup="renderCorps()">
        </div>
        <table class="list-table">
          <thead><tr><th>기업명</th><th>코드</th><th>운영기간</th><th>상태</th><th>연수원 URL</th><th class="del-btn">관리</th></tr></thead>
          <tbody id="corp-list"></tbody>
        </table>
      </section>
    </div>
    <div class="side-col">
      <section class="card">
        <div class="card-title">단일 기업 등록</div>
        <input id="in-name" placeholder="기업명">
        <input id="in-code" placeholder="기업코드">
        <input id="in-url" placeholder="URL">
        <select id="in-status"><option value="운영중">운영중</option><option value="종료">종료</option></select>
        <button class="btn-primary" onclick="addCorp()">등록 완료</button>
      </section>
    </div>
  </div>
</main>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB7pI15lC-L2U_Y_uE888pZpZpZpZpZpZ",
    authDomain: "workhub-pro.firebaseapp.com",
    databaseURL: "https://workhub-pro-default-rtdb.firebaseio.com",
    projectId: "workhub-pro",
    storageBucket: "workhub-pro.appspot.com",
    messagingSenderId: "338870335028",
    appId: "1:338870335028:web:785f7560879f874f67609a"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let DB_CORPS = [], IS_ADMIN = false;

  // [수정 핵심] '/' 경로를 직접 바라보게 하여 삐져나온 데이터를 모두 가져옵니다.
  function loadData() {
    db.ref('/').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        // 기업명(name)이 있는 데이터만 필터링해서 가져옵니다.
        DB_CORPS = Object.entries(data)
          .map(([key, value]) => ({ ...value, key }))
          .filter(item => item.name); 
      } else {
        DB_CORPS = [];
      }
      updateSummary();
      renderCorps();
    });
  }

  function addCorp() {
    const name = document.getElementById("in-name").value.trim();
    if(!name) return alert("기업명을 입력하세요.");
    
    // 저장도 최상위 경로('/')에 직접 합니다.
    db.ref('/').push({
      name: name,
      code: document.getElementById("in-code").value,
      url: document.getElementById("in-url").value,
      status: document.getElementById("in-status").value,
      period: "~"
    }).then(() => {
      alert("등록 완료!");
      document.getElementById("in-name").value = "";
    });
  }

  function renderCorps() {
    const query = document.getElementById("u-search").value.toLowerCase();
    const filtered = DB_CORPS.filter(c => c.name.toLowerCase().includes(query));
    document.getElementById("corp-list").innerHTML = filtered.reverse().map(c => `
      <tr>
        <td style="font-weight:800;">${c.name}</td>
        <td>${c.code}</td>
        <td>${c.period || '~'}</td>
        <td><span class="badge ${c.status==='운영중'?'on':'off'}">${c.status}</span></td>
        <td>${c.url ? `<a href="https://${c.url}" target="_blank" style="color:var(--primary)">${c.url}</a>` : '-'}</td>
        <td><button class="del-btn" onclick="deleteItem('${c.key}')">삭제</button></td>
      </tr>`).join('');
  }

  function deleteItem(key) { if(confirm("삭제하시겠습니까?")) db.ref('/').child(key).remove(); }
  function updateSummary() {
    document.getElementById("count-all").innerText = DB_CORPS.length;
    document.getElementById("count-on").innerText = DB_CORPS.filter(c => c.status === "운영중").length;
  }
  function toggleAdmin() {
    IS_ADMIN = !IS_ADMIN;
    document.getElementById("main-body").classList.toggle("admin-active", IS_ADMIN);
    renderCorps();
  }
  
  window.onload = loadData;
</script>
</body>
</html>
