<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro | 통합 관리 시스템</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    --bg-color: #f4f7ff;
    --primary: #6366f1;
    --text-dark: #1e293b;
    --text-light: #64748b;
    --white: #ffffff;
    --border: #e2e8f0;
    --accent: #f43f5e;
  }

  body { font-family: 'Pretendard', sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-dark); }
  header { padding: 60px 20px 30px; text-align: center; position: relative; }
  .logo { font-size: 34px; font-weight: 900; color: #0f172a; margin-bottom: 25px; letter-spacing: -1px; }

  /* 상단 관리자 버튼 */
  .admin-btn {
    position: absolute; top: 20px; right: 20px;
    padding: 10px 18px; border-radius: 14px; border: 1.5px solid var(--border);
    background: var(--white); color: var(--text-light); font-weight: 800; font-size: 13px;
    cursor: pointer; transition: 0.3s;
  }
  .admin-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  /* 탭 메뉴 */
  .nav-tabs { display: inline-flex; background: var(--white); padding: 6px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 40px; }
  .nav-btn {
    padding: 12px 25px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s;
    background: transparent; color: var(--text-light); font-size: 14px;
  }
  .nav-btn.active { background: var(--primary); color: var(--white); }

  main { max-width: 1200px; margin: 0 auto 50px; padding: 0 20px; }
  .tab-content { display: none; grid-template-columns: 1.8fr 1.1fr; gap: 30px; }
  .tab-content.active { display: grid; }

  .card { background: var(--white); border-radius: 28px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.02); height: fit-content; }
  .card-title { font-size: 19px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .card-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 10px; }

  /* 통계 */
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-box { background: #f8faff; border: 1px solid #eef2ff; padding: 15px; border-radius: 18px; text-align: center; }
  .stat-val { font-size: 22px; font-weight: 900; color: var(--primary); }

  /* 입력 필드 */
  input, textarea, select {
    width: 100%; box-sizing: border-box; padding: 14px; border-radius: 12px;
    border: 1.5px solid #f1f5f9; background: #f8fafc; outline: none; font-size: 14px; margin-bottom: 12px;
  }
  input:focus { border-color: var(--primary); background: var(--white); }

  .btn-primary { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 800; cursor: pointer; }

  /* 엑셀 업로드 박스 */
  .excel-box { border: 2px dashed #cbd5e1; border-radius: 18px; padding: 20px; text-align: center; margin-bottom: 20px; background: #fcfdff; }
  .sample-link { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--primary); text-decoration: underline; cursor: pointer; font-weight: 700; }

  /* 리스트 스타일 */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 12px; font-size: 12px; color: var(--text-light); border-bottom: 2px solid #f1f5f9; }
  td { padding: 15px 12px; font-size: 14px; border-bottom: 1px solid #f8fafc; }
  
  .del-btn { display: none; border: none; color: var(--accent); cursor: pointer; background: none; font-size: 12px; font-weight: bold; }
  .admin-active .del-btn { display: inline-block; }

  .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; background: #eef2ff; color: var(--primary); }

  @media (max-width: 1000px) { .tab-content { grid-template-columns: 1fr; } }
</style>
</head>
<body id="main-body">

<header>
  <button class="admin-btn" id="admin-toggle-btn" onclick="toggleAdminMode()">⚙️ 관리자 모드</button>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab('corp-tab', this)">🏢 기업관리시스템</button>
    <button class="nav-btn" onclick="switchTab('guide-tab', this)">🚀 워크허브</button>
  </div>
</header>

<main>
  <div id="corp-tab" class="tab-content active">
    <section class="card">
      <div class="card-title">기업 현황 관리</div>
      <div class="stats-grid">
        <div class="stat-box">전체 <b class="stat-val" id="ca">0</b></div>
        <div class="stat-box">운영중 <b class="stat-val" id="co">0</b></div>
        <div class="stat-box">종료 <b class="stat-val" id="cf">0</b></div>
      </div>
      <input type="text" id="cs" placeholder="기업명 검색 (Enter)" onkeyup="if(event.key==='Enter') renderCorps()">
      <table>
        <thead><tr><th>기업명</th><th>상태</th><th>기간</th><th class="del-btn">관리</th></tr></thead>
        <tbody id="corp-list-body"></tbody>
      </table>
    </section>

    <section class="card">
      <div class="card-title">신규 기업 등록</div>
      <div class="excel-box">
        <span style="font-size:13px; font-weight:800; color:var(--primary);">기업 일괄 등록 (CSV)</span>
        <input type="file" onchange="uploadCSV(this, 'corp')" style="font-size:11px; margin-top:10px; width:100%;">
      </div>
      <input id="in-cn" placeholder="기업명">
      <input id="in-cc" placeholder="기업코드">
      <input id="in-cu" placeholder="기업 URL">
      <input id="in-cp" placeholder="운영기간">
      <select id="in-cs"><option>운영중</option><option>종료</option></select>
      <button class="btn-primary" onclick="addNewCorp()">추가하기</button>
    </section>
  </div>

  <div id="guide-tab" class="tab-content">
    <section class="card">
      <div class="card-title">가이드 보관함</div>
      <input type="text" id="gs" placeholder="검색어 입력 후 Enter" onkeyup="if(event.key==='Enter') renderGuides()">
      <div id="guide-list-area" style="margin-top:20px;"></div>
    </section>

    <section class="card">
      <div class="card-title">지식 등록 센터</div>
      <div class="excel-box">
        <span style="font-size:13px; font-weight:800; color:var(--primary);">가이드 일괄 등록</span>
        <input type="file" onchange="uploadCSV(this, 'guide')" style="font-size:11px; margin-top:10px; width:100%;">
        <span class="sample-link" onclick="downloadSample()">[샘플 양식 다운로드]</span>
      </div>
      <input id="in-gn" placeholder="기업명">
      <input id="in-gk" placeholder="키워드 (쉼표 구분)">
      <textarea id="in-gt" placeholder="가이드 상세 내용" rows="4"></textarea>
      <button class="btn-primary" style="background:#1e293b;" onclick="addNewGuide()">지식 저장</button>
    </section>
  </div>
</main>

<script>
  let DB_CORPS = JSON.parse(localStorage.getItem("db_corps") || "[]");
  let DB_GUIDES = JSON.parse(localStorage.getItem("db_guides") || "[]");
  let IS_ADMIN = false;

  function toggleAdminMode() {
    if(!IS_ADMIN) {
      if(prompt("비밀번호를 입력하세요.") === "6559") {
        IS_ADMIN = true;
        document.getElementById("main-body").classList.add("admin-active");
        document.getElementById("admin-toggle-btn").classList.add("active");
        document.getElementById("admin-toggle-btn").innerText = "🔓 관리자 On";
      }
    } else {
      IS_ADMIN = false;
      document.getElementById("main-body").classList.remove("admin-active");
      document.getElementById("admin-toggle-btn").classList.remove("active");
      document.getElementById("admin-toggle-btn").innerText = "⚙️ 관리자 모드";
    }
    renderCorps(); renderGuides();
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  // --- 기업 현황 ---
  function addNewCorp() {
    const name = document.getElementById("in-cn").value.trim();
    if(!name) return alert("기업명을 입력하세요.");
    DB_CORPS.unshift({
      name, code: document.getElementById("in-cc").value,
      url: document.getElementById("in-cu").value,
      period: document.getElementById("in-cp").value,
      status: document.getElementById("in-cs").value
    });
    saveDB();
    ["in-cn","in-cc","in-cu","in-cp"].forEach(id => document.getElementById(id).value = "");
  }

  function renderCorps() {
    const q = document.getElementById("cs").value.trim().toLowerCase();
    const filtered = DB_CORPS.filter(c => c.name.toLowerCase().includes(q));
    
    document.getElementById("ca").innerText = DB_CORPS.length;
    document.getElementById("co").innerText = DB_CORPS.filter(c => c.status === '운영중').length;
    document.getElementById("cf").innerText = DB_CORPS.filter(c => c.status === '종료').length;

    document.getElementById("corp-list-body").innerHTML = filtered.map((c, i) => `
      <tr>
        <td style="font-weight:800;">${c.name}</td>
        <td style="color:${c.status==='운영중'?'#6366f1':''}">${c.status}</td>
        <td>${c.period || '-'}</td>
        <td><button class="del-btn" onclick="deleteData('corp', ${i})">삭제</button></td>
      </tr>`).join('');
  }

  // --- 워크허브 ---
  function downloadSample() {
    const csvContent = "\uFEFF기업명,키워드,내용\n삼성전자,가이드|신입,가이드 본문 내용입니다.\nLG전자,매뉴얼|필독,여기에 내용을 작성하세요.";
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.setAttribute("download", "workhub_sample.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function addNewGuide() {
    const name = document.getElementById("in-gn").value.trim();
    const txt = document.getElementById("in-gt").value.trim();
    if(!name || !txt) return alert("기업명과 내용을 입력하세요.");
    DB_GUIDES.unshift({
      category: name,
      keywords: document.getElementById("in-gk").value.split(','),
      text: txt
    });
    saveDB();
    ["in-gn","in-gk","in-gt"].forEach(id => document.getElementById(id).value = "");
  }

  function renderGuides() {
    const q = document.getElementById("gs").value.trim().toLowerCase();
    const filtered = DB_GUIDES.filter(g => !q || g.text.toLowerCase().includes(q) || g.category.toLowerCase().includes(q));

    document.getElementById("guide-list-area").innerHTML = filtered.map((g, i) => `
      <div style="border:1px solid #f1f5f9; padding:20px; border-radius:20px; margin-bottom:15px; background:#fff;">
        <span class="badge">${g.category}</span>
        <div style="margin:12px 0; font-weight:700; line-height:1.5;">${g.text}</div>
        <button class="del-btn" onclick="deleteData('guide', ${i})">삭제</button>
      </div>`).join('');
  }

  function deleteData(type, i) {
    if(confirm("정말 삭제하시겠습니까?")) {
      if(type === 'corp') DB_CORPS.splice(i, 1);
      else DB_GUIDES.splice(i, 1);
      saveDB();
    }
  }

  function saveDB() {
    localStorage.setItem("db_corps", JSON.stringify(DB_CORPS));
    localStorage.setItem("db_guides", JSON.stringify(DB_GUIDES));
    renderCorps(); renderGuides();
  }

  function uploadCSV(input, type) {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const lines = e.target.result.split(/\r?\n/).slice(1).filter(l => l.trim());
      lines.forEach(l => {
        const p = l.split(',');
        if(p.length >= 2) {
          if(type === 'corp') DB_CORPS.unshift({ name: p[0], code: p[1]||'', status: p[2]||'운영중', period: p[3]||'', url: p[4]||'' });
          else DB_GUIDES.unshift({ category: p[0], keywords: p[1]?p[1].split('|'):[], text: p[2]||'' });
        }
      });
      saveDB();
      alert("일괄 등록 완료!");
    };
    reader.readAsText(file, "UTF-8");
  }

  window.onload = () => { renderCorps(); renderGuides(); };
</script>
</body>
</html>
