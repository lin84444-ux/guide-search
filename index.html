<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub | Smart Blue & Gold</title>
<script src="data.js"></script>
<style>
  :root {
    --header-grad: linear-gradient(135deg, #a2d2ff, #92a8d1);
    --main-blue: #4a90e2;
    --sub-blue: #84b6f4;
    --bg-left: #F5F9FF;
    --bg-share: #FFF6E5;
    --bg-reg: #F8FAFC;
    --navy-blue: #34495e;
    --white: #ffffff;
    --red: #ff6b6b;
    --border-gray: #E5E7EB;
    --point-orange: #FFB74D;
  }

  body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; background-color: #f4f7f9; color: #2c3e50; }

  header { background: var(--header-grad); padding: 40px 20px; text-align: center; color: var(--white); position: relative; }
  header h1 { margin: 0; font-size: 32px; letter-spacing: -1px; }
  header .admin-toggle-btn { position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.2); border: 1px solid white; padding: 6px 12px; border-radius: 20px; color: white; cursor: pointer; font-size: 12px; transition: 0.3s; }
  header .admin-toggle-btn:hover { background: white; color: var(--main-blue); }

  main { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; max-width: 1300px; margin: 20px auto; padding: 0 20px; }

  .card { background: var(--white); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); height: fit-content; }
  .title-area { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .title-area i { width: 4px; height: 18px; background: var(--main-blue); border-radius: 10px; }

  .guide-zone { grid-row: span 2; border-top: 6px solid var(--main-blue); background: var(--bg-left); }
  
  .share-zone { background-color: var(--bg-share); border-top: 6px solid var(--point-orange); margin-bottom: 20px; }
  .share-zone .title-area i { background: var(--point-orange); }
  .share-item { background: white; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--point-orange); position: relative; }
  .share-time { display: block; font-size: 11px; color: #999; margin-top: 5px; }

  .reg-zone { border-top: 6px solid var(--navy-blue); background: var(--bg-reg); }

  .input-group { display: flex; flex-direction: column; gap: 12px; }
  input, textarea { padding: 13px; border: 1px solid var(--border-gray); border-radius: 12px; outline: none; font-size: 14px; width: 100%; box-sizing: border-box; background: white; }
  
  button { padding: 13px; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; transition: 0.2s; }
  .btn-blue { background: var(--main-blue); color: white; }
  .btn-navy { background: var(--navy-blue); color: white; }
  .btn-red { background: var(--red); color: white; }
  .btn-orange { background: var(--point-orange); color: white; }
  .btn-gray { background: #adb5bd; color: white; }

  .list-item { background: white; padding: 18px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #edf2f7; position: relative; }
  .list-item.editing { border: 2px solid var(--main-blue); box-shadow: 0 5px 15px rgba(74, 144, 226, 0.15); }
  
  .badge { font-size: 11px; font-weight: 700; color: var(--main-blue); background: #e8f2ff; padding: 4px 10px; border-radius: 8px; }
  .file-link { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--main-blue); text-decoration: none; font-weight: 600; }
  .admin-btns { margin-top: 15px; display: flex; gap: 8px; }
  .btn-sm { padding: 6px 12px; font-size: 11px; border-radius: 8px; }

  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <button class="admin-toggle-btn" onclick="toggleAdmin()">관리자 전환</button>
  <h1>WorkHub</h1>
  <p id="mode-text">사용자 모드입니다</p>
</header>

<main>
  <section class="card guide-zone">
    <div class="title-area"><i></i> 가이드 검색 및 데이터</div>
    <div style="display:flex; gap:10px; margin-bottom:25px;">
        <input id="q" placeholder="검색어 입력 후 Enter..." onkeyup="if(event.key==='Enter') renderGuides();">
        <button class="btn-blue" onclick="renderGuides()" style="padding:0 25px;">검색</button>
    </div>
    <div id="guide-result"></div>
  </section>

  <section class="card share-zone">
    <div class="title-area"><i></i> 오늘의 공유사항</div>
    <div id="share-result" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px;"></div>
    <div class="input-group">
        <textarea id="share-text" placeholder="공유할 메시지 입력" rows="2"></textarea>
        <button onclick="addShare(null)" class="btn-orange">Post Update</button>
    </div>
  </section>

  <section id="reg-card" class="card reg-zone">
    <div class="title-area"><i style="background:var(--navy-blue)"></i> <span>신규 가이드 등록</span></div>
    <div class="input-group">
        <input id="new-category" placeholder="카테고리 (파일 올리면 자동 입력)">
        <input id="new-keywords" placeholder="키워드 (쉼표 구분)">
        <textarea id="new-text" placeholder="상세 내용을 작성하세요" rows="3"></textarea>
        
        <div style="font-size: 13px; color:#64748b; background: white; padding: 10px; border-radius: 10px; border: 1px solid var(--border-gray);">
            📎 <b>파일 즉시 등록:</b> 
            <input type="file" id="new-file" onchange="handleFileSelect(this)" style="border:none; background:transparent; font-size:12px; margin-top:5px;">
        </div>

        <div style="font-size: 13px; display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="sync-share" style="width:auto; cursor:pointer;">
            <label for="sync-share">등록 시 공유사항에도 게시</label>
        </div>
        
        <button onclick="addGuide()" class="btn-navy">Save to Database</button>
    </div>
  </section>
</main>

<script>
  let GUIDE = (typeof INITIAL_GUIDE !== 'undefined') ? INITIAL_GUIDE : JSON.parse(localStorage.getItem("guide") || "[]");
  let SHARES = (typeof INITIAL_SHARES !== 'undefined') ? INITIAL_SHARES : JSON.parse(localStorage.getItem("shares") || "[]");
  
  if (!localStorage.getItem("guide") && typeof INITIAL_GUIDE !== 'undefined') {
      localStorage.setItem("guide", JSON.stringify(INITIAL_GUIDE));
  }

  let isAdmin = false;
  let editingId = null; 

  // 파일 선택 시 카테고리 자동 입력
  function handleFileSelect(input) {
      if (input.files.length > 0) {
          const fileName = input.files[0].name;
          const catField = document.getElementById("new-category");
          if (!catField.value) catField.value = fileName.split('.')[0];
      }
  }

  function renderGuides() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const container = document.getElementById("guide-result");
    const filtered = q === "" ? GUIDE : GUIDE.filter(item => 
        item.text.toLowerCase().includes(q) || item.category.toLowerCase().includes(q) ||
        (item.keywords && item.keywords.some(k => k.toLowerCase().includes(q)))
    );

    if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#999; padding:40px 0;">결과가 없습니다.</p>`;
        return;
    }

    container.innerHTML = filtered.map((item, idx) => {
        if (editingId === idx) {
            return `
                <div class="list-item editing">
                    <div class="input-group">
                        <input id="edit-cat-${idx}" value="${item.category}" style="margin-bottom:5px;">
                        <textarea id="edit-txt-${idx}" rows="4">${item.text}</textarea>
                        <input id="edit-kw-${idx}" value="${item.keywords.join(', ')}">
                        <div class="admin-btns">
                            <button class="btn-sm btn-blue" onclick="saveEdit(${idx})">저장</button>
                            <button class="btn-sm btn-gray" onclick="cancelEdit()">취소</button>
                        </div>
                    </div>
                </div>
            `;
        }
        return `
            <div class="list-item">
                <span class="badge">${item.category}</span>
                <div style="margin:12px 0; font-size:15px; line-height:1.6; white-space:pre-wrap;">${item.text}</div>
                ${item.fileName ? `<a href="${item.fileData}" download="${item.fileName}" class="file-link">📁 ${item.fileName}</a>` : ''}
                <div style="margin-top:10px; font-size:12px; color:#adb5bd;">${item.keywords ? item.keywords.map(k => '#' + k).join(' ') : ''}</div>
                ${isAdmin ? `
                  <div class="admin-btns">
                    <button class="btn-sm btn-navy" onclick="startInlineEdit(${idx})">수정</button>
                    <button class="btn-sm btn-red" onclick="deleteGuide(${idx})">삭제</button>
                  </div>
                ` : ''}
            </div>
        `;
    }).join('');
  }

  // 화면 이동 없이 즉시 수정 시작
  function startInlineEdit(idx) {
      editingId = idx;
      renderGuides(); // 스크롤 이동 코드 없음
  }

  function cancelEdit() {
      editingId = null;
      renderGuides();
  }

  function saveEdit(idx) {
      GUIDE[idx].category = document.getElementById(`edit-cat-${idx}`).value;
      GUIDE[idx].text = document.getElementById(`edit-txt-${idx}`).value;
      GUIDE[idx].keywords = document.getElementById(`edit-kw-${idx}`).value.split(',').map(k => k.trim());
      localStorage.setItem("guide", JSON.stringify(GUIDE));
      editingId = null;
      renderGuides();
  }

  // 1번 수정: 파일만 있어도 등록되게 변경
  async function addGuide() {
    const cat = document.getElementById("new-category").value;
    const txt = document.getElementById("new-text").value;
    const kwInput = document.getElementById("new-keywords").value;
    const fileInput = document.getElementById("new-file");
    const isSync = document.getElementById("sync-share").checked;

    // 파일이 있으면 텍스트 입력 없이도 통과
    const hasFile = fileInput.files.length > 0;
    if(!cat && !hasFile) return alert("카테고리 또는 파일을 등록해주세요.");

    let fileData = null;
    let fileName = null;

    if(hasFile) {
        const file = fileInput.files[0];
        fileName = file.name;
        fileData = await toBase64(file);
    }

    const kw = kwInput ? kwInput.split(",").map(k => k.trim()) : [];
    const finalCat = cat || (fileName ? fileName.split('.')[0] : "미분류");
    const finalTxt = txt || (fileName ? `${fileName} 파일이 등록되었습니다.` : "내용 없음");

    GUIDE.unshift({ category: finalCat, text: finalTxt, keywords: kw, fileName, fileData });
    if(isSync) addShare(finalTxt);

    localStorage.setItem("guide", JSON.stringify(GUIDE));
    clearInputs();
    renderGuides();
  }

  function clearInputs() {
    document.getElementById("new-category").value = "";
    document.getElementById("new-text").value = "";
    document.getElementById("new-keywords").value = "";
    document.getElementById("new-file").value = "";
  }

  function addShare(directText = null) {
    const txt = directText || document.getElementById("share-text").value;
    if(!txt) return;
    const timeStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    SHARES.unshift({ text: txt, time: timeStr });
    localStorage.setItem("shares", JSON.stringify(SHARES));
    if(!directText) document.getElementById("share-text").value = "";
    renderShares();
  }

  function renderShares() {
    const container = document.getElementById("share-result");
    container.innerHTML = SHARES.map((s, idx) => `
        <div class="share-item">
            <div>${s.text}</div>
            <span class="share-time">${s.time}</span>
            ${isAdmin ? `<span onclick="deleteShare(${idx})" style="cursor:pointer; color:var(--red); font-size:11px; position:absolute; top:10px; right:10px;">삭제</span>` : ''}
        </div>
    `).join('') || "<p style='color:#999; font-size:12px; text-align:center;'>공유사항이 없습니다.</p>";
  }

  function toggleAdmin() {
    if (!isAdmin) {
      if (prompt("관리자 비밀번호를 입력하세요.") === "6559") {
        isAdmin = true;
      } else {
        alert("비밀번호가 틀렸습니다.");
        return;
      }
    } else {
      isAdmin = false;
      editingId = null;
    }
    document.getElementById("mode-text").innerText = isAdmin ? "관리자 모드입니다" : "사용자 모드입니다";
    renderGuides();
    renderShares();
  }

  const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });

  function deleteGuide(idx) { if(confirm("삭제하시겠습니까?")) { GUIDE.splice(idx,1); localStorage.setItem("guide", JSON.stringify(GUIDE)); renderGuides(); } }
  function deleteShare(idx) { if(confirm("삭제하시겠습니까?")) { SHARES.splice(idx,1); localStorage.setItem("shares", JSON.stringify(SHARES)); renderShares(); } }

  window.onload = () => { renderGuides(); renderShares(); };
</script>
</body>
</html>
