<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub | 업무 가이드 & 공유</title>
<style>
  :root {
    --bg-color: #f8f9fa;
    --primary-color: #a2d2ff; /* 파스텔 블루 */
    --secondary-color: #ffafcc; /* 파스텔 핑크 */
    --accent-color: #bde0fe;
    --text-main: #495057;
    --text-dark: #212529;
    --white: #ffffff;
    --shadow: 0 4px 15px rgba(0,0,0,0.05);
  }

  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    margin: 0; padding: 0;
    background-color: var(--bg-color);
    color: var(--text-main);
    line-height: 1.6;
  }

  /* --- 헤더 --- */
  header {
    background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
    padding: 30px 20px;
    text-align: center;
    color: var(--white);
    box-shadow: var(--shadow);
  }
  header h1 { margin: 0; font-size: 28px; letter-spacing: -1px; }
  header p { margin: 5px 0 0; opacity: 0.9; font-size: 14px; }

  main { max-width: 900px; margin: -30px auto 50px; padding: 0 20px; }

  /* --- 공통 카드 스타일 --- */
  .card {
    background: var(--white);
    padding: 25px;
    border-radius: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 25px;
    border: none;
  }
  h2 { font-size: 18px; color: var(--text-dark); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: '•'; color: var(--secondary-color); font-size: 24px; }

  /* --- 입력창 & 버튼 --- */
  .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
  input, textarea {
    flex: 1; padding: 12px 15px; border: 1px solid #eee;
    border-radius: 10px; outline: none; transition: 0.3s;
    background: #fcfcfc;
  }
  input:focus, textarea:focus { border-color: var(--primary-color); background: #fff; }
  
  button {
    padding: 12px 24px; border: none; border-radius: 10px;
    cursor: pointer; font-weight: 600; transition: 0.2s;
    background: var(--primary-color); color: white;
  }
  button:hover { opacity: 0.8; transform: translateY(-1px); }
  .btn-secondary { background: var(--secondary-color); }
  .btn-outline { background: #eee; color: #777; font-size: 12px; padding: 5px 10px; }

  /* --- 검색 결과 & 리스트 --- */
  .list-item { 
    padding: 15px; background: #fff; border-bottom: 1px solid #f1f1f1;
    display: flex; flex-direction: column; gap: 8px;
  }
  .list-item:last-child { border-bottom: none; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: bold; background: var(--accent-color); color: #4a90e2;
    width: fit-content;
  }
  .content-text { font-size: 15px; color: var(--text-dark); }

  /* --- 관리자 모드 --- */
  #admin-controls { 
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; 
    background: #fdf2f5; padding: 20px; border-radius: 12px;
  }
  .full-width { grid-column: span 2; }

  /* --- 휴지통 --- */
  #trash-list { font-size: 14px; color: #888; }

  /* 애니메이션 */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.4s ease-out; }
</style>
</head>
<body>

<header>
  <h1>WorkHub</h1>
  <p>업무 가이드 및 오늘의 실시간 공유</p>
</header>

<main>
  <div id="login-section" class="card fade-in">
    <h2>Admin Access</h2>
    <div class="input-group">
      <input id="admin-pass" type="password" placeholder="비밀번호를 입력하세요">
      <button onclick="loginAdmin()">접속</button>
    </div>
    <p id="login-msg" style="color:#ff8787; font-size:13px;"></p>
  </div>

  <div id="guide-section" style="display:none;">
    
    <div class="card fade-in">
      <h2>가이드 검색</h2>
      <div class="input-group">
        <input id="q" placeholder="키워드나 업무 내용을 입력하세요..." onkeyup="searchGuide()">
        <button onclick="searchGuide()">검색</button>
      </div>
      <div id="result" class="list-container"></div>
    </div>

    <div class="card fade-in">
      <h2>오늘의 공유사항</h2>
      <div id="today-share" style="margin-bottom: 20px;"></div>
      <div class="input-group">
        <textarea id="share-text" placeholder="공유할 내용을 입력하세요..."></textarea>
        <button onclick="addShare()" class="btn-secondary">등록</button>
      </div>
    </div>

    <div class="card fade-in">
      <h2>새 가이드 등록</h2>
      <div id="admin-controls">
        <input id="new-category" placeholder="카테고리 (예: 오류)">
        <input id="new-keywords" placeholder="키워드 (쉼표 구분)">
        <textarea id="new-text" class="full-width" placeholder="가이드 상세 내용"></textarea>
        <button onclick="addGuide()" class="full-width">데이터베이스 저장</button>
      </div>
    </div>

    <div class="card fade-in">
      <h2>휴지통</h2>
      <div id="trash-list"></div>
    </div>
  </div>
</main>

<script>
/* --- 데이터 및 로직 --- */
let GUIDE = JSON.parse(localStorage.getItem("guide")) || [
  {category:"재응시", text:"GS건설 온보딩 과정 재응시는 담당자에게 개별 문의 바랍니다.", keywords:["재응시","GS","과락"]},
  {category:"오류", text:"에러코드 224002 발생 시 브라우저 캐시를 삭제해 주세요.", keywords:["에러","캐시"]},
  {category:"가입", text:"지해로 개인가입 서비스는 2월 말 오픈 예정입니다.", keywords:["지해로","가입"]}
];

let shares = JSON.parse(localStorage.getItem("shares")||"[]");
let trash = JSON.parse(localStorage.getItem("trash")||"[]");

function loginAdmin(){
  const pass = document.getElementById("admin-pass").value;
  if(pass === "6559"){
    document.getElementById("login-section").style.display="none";
    document.getElementById("guide-section").style.display="block";
    renderShares();
    renderTrash();
  } else {
    document.getElementById("login-msg").innerText="비밀번호가 올바르지 않습니다.";
  }
}

function searchGuide(){
  const q = document.getElementById("q").value.toLowerCase();
  const result = document.getElementById("result");
  if(!q) { result.innerHTML=""; return; }

  const found = GUIDE.filter(item => 
    item.text.toLowerCase().includes(q) ||
    item.keywords.some(k=>k.toLowerCase().includes(q)) ||
    item.category.includes(q)
  );

  result.innerHTML = found.map(i=>`
    <div class="list-item">
      <span class="badge">${i.category}</span>
      <div class="content-text">${i.text}</div>
    </div>
  `).join("") || "<div style='padding:20px; color:#999;'>검색 결과가 없습니다.</div>";
}

function addGuide(){
  const cat = document.getElementById("new-category").value;
  const txt = document.getElementById("new-text").value;
  const kw = document.getElementById("new-keywords").value.split(",").map(k=>k.trim());
  
  if(cat && txt){
    GUIDE.push({category:cat, text:txt, keywords:kw});
    localStorage.setItem("guide", JSON.stringify(GUIDE));
    alert("새 가이드가 등록되었습니다.");
    document.getElementById("new-category").value = "";
    document.getElementById("new-text").value = "";
    document.getElementById("new-keywords").value = "";
  }
}

function addShare(){
  const txt = document.getElementById("share-text").value;
  if(!txt) return;
  shares.push({text:txt, created:Date.now(), status:"active"});
  localStorage.setItem("shares", JSON.stringify(shares));
  renderShares();
  document.getElementById("share-text").value="";
}

function renderShares(){
  const container = document.getElementById("today-share");
  container.innerHTML = shares.map(s=>`
    <div class="list-item" style="border-left: 4px solid var(--secondary-color);">
      <div class="content-text">${s.text}</div>
      <div style="font-size:11px; color:#bbb;">${new Date(s.created).toLocaleString()}</div>
    </div>
  `).join("") || "<div style='color:#ccc;'>공유된 내용이 없습니다.</div>";
}

function renderTrash(){
  const container = document.getElementById("trash-list");
  container.innerHTML = trash.map((t,i)=>`
    <div class="list-item" style="opacity:0.7">
      <span>${t.text}</span>
      <div>
        <button class="btn-outline" onclick="restoreTrash(${i})">복원</button>
        <button class="btn-outline" onclick="deleteTrash(${i})">삭제</button>
      </div>
    </div>
  `).join("") || "휴지통이 비어있습니다.";
}

// 복원/삭제 로직은 기존과 동일하게 유지...
function restoreTrash(i){
  shares.push(trash.splice(i,1)[0]);
  saveAndRender();
}
function deleteTrash(i){
  trash.splice(i,1);
  saveAndRender();
}
function saveAndRender(){
  localStorage.setItem("shares", JSON.stringify(shares));
  localStorage.setItem("trash", JSON.stringify(trash));
  renderShares();
  renderTrash();
}
</script>
</body>
</html>
