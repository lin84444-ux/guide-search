<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>업무처리 가이드 검색</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, Arial;
  max-width: 760px;
  margin: 60px auto;
  padding: 0 20px;
}
h1 { font-size: 28px; }
.search-box { display:flex; gap:10px; margin-top:20px; }
input { flex:1; padding:14px; font-size:16px; border:1px solid #ddd; border-radius:8px; }
button { padding:14px 20px; font-size:16px; border:none; background:black; color:white; border-radius:8px; cursor:pointer; }
#result { margin-top:30px; line-height:1.6; white-space:pre-wrap; }
</style>
</head>

<body>

<h1>업무처리 가이드 검색</h1>

<div class="search-box">
<input id="q" placeholder="궁금한 업무를 입력하세요">
<button onclick="ask()">검색</button>
</div>

<div id="result"></div>

<script>
const GUIDE = `
지방공기업평가원 자율가입 및 자율신청, 전 과정 무료. 모바일 회원가입 불가(PC만 가능). 소속기관 미검색 시 기관등록 신청서 제출 안내.
미수료 과정 취소 후 재신청은 학습자 직접 진행.
안전보건교육은 학습기간 내 수료 필수.
시험 점수 미달 시 자동 재응시 제공.
기관 변경은 운영자 처리 가능.
수료증 날짜 변경 불가.
GS건설 일괄입과 과정은 수강신청일 동일 표기 정상.
GS리테일 재응시 문의는 담당자 승인 없이 처리 가능.
`;

function ask(){
  const q = document.getElementById("q").value;
  const result = document.getElementById("result");

  if(!q) return;

  const text = GUIDE.toLowerCase();
  const keyword = q.toLowerCase();

  if(text.includes(keyword)){
    result.innerText = "관련 내용 발견:\n\n" + GUIDE.split("\n").filter(v=>v.toLowerCase().includes(keyword)).join("\n");
  }else{
    result.innerText = "관련 내용 없음";
  }
}
</script>

</body>

</html>
