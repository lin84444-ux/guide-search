<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub | Smart Blue Office</title>
<style>
  :root {
    --header-grad: linear-gradient(135deg, #a2d2ff, #92a8d1);
    --main-blue: #4a90e2;
    --light-blue: #f0f7ff;
    --navy-blue: #34495e;
    --reg-bg: #f8fafc;
    --white: #ffffff;
    --text-dark: #2c3e50;
  }

  body {
    font-family: 'Pretendard', sans-serif;
    margin: 0; padding: 0; background-color: #f4f7f9; color: var(--text-dark);
  }

  /* 헤더 스타일 */
  header {
    background: var(--header-grad);
    padding: 60px 20px; /* 패딩을 넉넉히 주어 안정감 확보 */
    text-align: center;
    color: var(--white);
    position: relative;
  }
  header h1 { margin: 0; font-size: 36px; font-weight: 800; }
  header #mode-text { margin-top: 10px; font-size: 15px; opacity: 0.9; }
  header .admin-toggle-btn {
    position: absolute; top: 20px; right: 20px;
    background: rgba(255,255,255,0.25); border: 1px solid white;
    padding: 6px 16px; border-radius: 20px; color: white; cursor: pointer; font-size: 13px;
  }

  /* 메인 레이아웃 - 잘림 방지 수정 */
  main {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 25px;
    max-width: 1300px;
    margin: 30px auto 50px; /* 위쪽 여백을 양수(+)로 변경 */
    padding: 0 20px;
    position: relative;
  }

  .card {
    background: var(--white);
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  }

  .title-area { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .title-area i { width: 4px; height: 18px; background: var(--main-blue); border-radius: 10px; }

  .guide-zone { grid-row: span 2; border-top: 6px solid var(--main-blue); }
  .share-zone { background-color: var(--light-blue); border-top: 6px solid #84b6f4; }
  .reg-zone { background-color: var(--reg-bg); border-top: 6px solid var(--navy-blue); }

  .input-group { display: flex; flex-direction: column; gap: 12px; }
  input, textarea { padding: 13px; border: 1px solid #d1d9e0; border-radius: 12px; outline: none; font-size: 14px; }
  button { padding: 13px; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; }
  .btn-blue { background: var(--main-blue); color: white; }
  .btn-navy { background: var(--navy-blue); color: white; }

  .list-item { background: white; padding: 18px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #edf2f7; }
  .badge { font-size: 11px; font-weight: 700; color: var(--main-blue); background: #e8f2ff; padding: 4px 10px; border-radius: 8px; }

  .admin-btns { margin-top: 12px; display: flex; gap: 6px; justify-content: flex-end; }
  .btn-sm { padding: 5px 12px; font-size: 11px; border-radius: 6px; background: #f1f5f9; color: #64748b; }

  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } .guide-zone { grid-row: auto; } }
</style>
</head>
<body>

<header>
  <button class="admin-toggle-btn" onclick="toggleAdmin()">관리자 전환</button>
  <h1>WorkHub</h1>
  <p id="mode-text">사용자 모드입니다</p>
</header>

<main>
  <section class="card guide-zone">
    <div class="title-area"><i></i> 가이드 검색 및 데이터</div>
    <div style="display:flex; gap:10px; margin-bottom:25px;">
        <input id="q" style="flex:1" placeholder="검색어를 입력하고 Enter (전체보기는 빈칸에서 Enter)" onkeyup="if(event.key==='Enter') renderGuides();">
        <button class="btn-blue" onclick="renderGuides()" style="padding:0 25px;">검색</button>
    </div>
    <div id="guide-result"><p style="text-align:center; color:#adb5bd;">검색을 시작하세요.</p></div>
  </section>

  <section class="card share-zone">
    <div class="title-area"><i style="background:#84b6f4"></i> 오늘의 공유사항</div>
    <div id="share-result"></div>
    <div class="input-group">
        <textarea id="share-text" placeholder="내용 입력..." rows="2"></textarea>
        <button onclick="addShare()" class="btn-blue" style="background:#84b6f4">공유 등록</button>
    </div>
  </section>

  <section class="card reg-zone">
    <div class="title-area"><i style="background:var(--navy-blue)"></i> 가이드 신규 등록</div>
    <div class="input-group">
        <input id="new-category" placeholder="카테고리">
        <input id="new-keywords" placeholder="키워드">
        <textarea id="new-text" placeholder="상세 내용..." rows="3"></textarea>
        <input type="file" id="new-file">
        <div style="font-size: 13px;"><input type="checkbox" id="sync-share"> 공유사항 동시 게시</div>
        <div id="reg-btn-area"><button onclick="addGuide()" class="btn-navy" style="width:100%;">저장하기</button></div>
    </div>
  </section>
</main>

<script>
// (기존 스크립트 내용은 동일하게 유지됩니다)
let GUIDE = JSON.parse(localStorage.getItem("guide") || "[]");
let SHARES = JSON.parse(localStorage.getItem("shares") || "[]");
let isAdmin = false;

function renderGuides() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const container = document.getElementById("guide-result");
    const filtered = q === "" ? GUIDE : GUIDE.filter(item => 
        item.text.toLowerCase().includes(q) || item.category.toLowerCase().includes(q)
    );
    container.innerHTML = filtered.map((item, idx) => `
        <div class="list-item">
            <span class="badge">${item.category}</span>
            <div style="margin:10px 0;">${item.text}</div>
            ${isAdmin ? `<div class="admin-btns"><button class="btn-sm" onclick="deleteGuide(${idx})">삭제</button></div>` : ''}
        </div>
    `).join('') || "<p style='text-align:center; color:#ccc;'>결과 없음</p>";
}

function addShare() {
    const txt = document.getElementById("share-text").value;
    if(!txt) return;
    SHARES.unshift({ text: txt, date: new Date().toLocaleTimeString() });
    localStorage.setItem("shares", JSON.stringify(SHARES));
    renderShares();
    document.getElementById("share-text").value = "";
}

function renderShares() {
    const container = document.getElementById("share-result");
    container.innerHTML = SHARES.map(s => `<div style="padding:10px; background:white; border-radius:10px; margin-bottom:8px; border-left:4px solid #84b6f4;">${s.text}</div>`).join('');
}

function toggleAdmin() {
    isAdmin = !isAdmin;
    document.getElementById("mode-text").innerText = isAdmin ? "관리자 모드입니다" : "사용자 모드입니다";
    renderGuides();
}

window.onload = renderShares;
</script>
</body>
</html>
