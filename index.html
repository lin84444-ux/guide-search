<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>WorkHub Pro - Full Functional</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --main-blue: #6366f1; --bg: #f4f7ff; --white: #ffffff; --border: #e2e8f0; }
  body { font-family: 'Pretendard', sans-serif; margin: 0; background: var(--bg); color: #1e293b; font-size: 19px; }
  header { padding: 40px 20px; text-align: center; background: #fff; border-bottom: 2px solid var(--border); }
  .logo { font-size: 34px; font-weight: 900; color: var(--main-blue); }
  .nav-tabs { display: inline-flex; background: #f1f5f9; padding: 8px; border-radius: 20px; margin-top: 20px; }
  .nav-btn { padding: 16px 40px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; color: #64748b; background: transparent; font-size: 19px; }
  .nav-btn.active { background: var(--white); color: var(--main-blue); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
  
  main { max-width: 1550px; margin: 0 auto; padding: 30px; display: none; grid-template-columns: 2fr 1fr; gap: 30px; }
  main.active { display: grid; }
  
  .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
  .status-box { background: var(--white); padding: 45px 20px; border-radius: 25px; text-align: center; border: 1px solid var(--border); }
  .status-value { font-size: 46px; font-weight: 900; margin-top: 10px; }

  .card { background: var(--white); border-radius: 30px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid var(--border); margin-bottom: 30px; }
  .card-title { font-size: 28px; font-weight: 800; margin-bottom: 30px; position: relative; padding-left: 20px; }
  .card-title::before { content: ''; position: absolute; left: 0; width: 6px; height: 28px; background: var(--main-blue); border-radius: 10px; }
  
  input, textarea { width: 100%; padding: 22px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 12px; box-sizing: border-box; background: #fcfdfe; font-size: 19px; font-family: inherit; }
  .btn-blue { width: 100%; padding: 24px; border-radius: 15px; border: none; background: var(--main-blue); color: #fff; font-weight: 900; cursor: pointer; font-size: 20px; }
  .list-table { width: 100%; border-collapse: collapse; font-size: 19px; }
  .list-table th { background: #f8fafc; padding: 22px; text-align: left; color: #64748b; border-bottom: 2px solid var(--border); }
  .list-table td { padding: 22px; border-bottom: 1px solid #f1f5f9; }
  
  .share-item { padding: 25px; border-bottom: 1px solid #eee; background: #fcfdfe; border-radius: 20px; margin-bottom: 15px; }
  .btn-sample { width: 100%; padding: 18px; border-radius: 12px; border: none; background: #1e293b; color: #fff; font-weight: 700; cursor: pointer; margin-bottom: 15px; font-size: 17px; }
</style>
</head>
<body id="app-body">

<header>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="tab(0)">🏢 기업관리시스템</button>
    <button class="nav-btn" onclick="tab(1)">🚀 워크허브</button>
  </div>
</header>

<main id="tab-0" class="active">
  <section>
    <div class="status-grid">
      <div class="status-box"><div>전체</div><div class="status-value" id="c-all">0</div></div>
      <div class="status-box"><div>운영중</div><div class="status-value" id="c-on" style="color:var(--main-blue)">0</div></div>
      <div class="status-box"><div>종료</div><div class="status-value" id="c-off">0</div></div>
    </div>
    <div class="card">
      <div class="card-title">기업 현황 리스트</div>
      <table class="list-table">
        <thead><tr><th>기업명</th><th>코드</th><th>운영기간</th><th>상태</th><th>연수원 URL</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
  <aside>
    <div class="card">
      <div class="card-title">기업 수기 등록</div>
      <input type="text" id="add-name" placeholder="기업명">
      <input type="text" id="add-code" placeholder="기업코드">
      <input type="text" id="add-period" placeholder="운영기간 (예: 2026.01~)">
      <input type="text" id="add-url" placeholder="연수원 URL">
      <button class="btn-blue" onclick="addOneComp()">기업 등록</button>
      <hr style="margin:30px 0; border:0; border-top:1px solid #eee;">
      <button class="btn-sample" onclick="downCompSample()">📥 기업 양식 다운로드</button>
      <input type="file" id="xl-input" accept=".xlsx">
      <button class="btn-blue" onclick="upComp()" style="background:#475569;">엑셀 대량 등록</button>
    </div>
  </aside>
</main>

<main id="tab-1" style="grid-template-columns: 1.5fr 1fr;">
  <section>
    <div class="card">
      <div class="card-title">오늘의 가이드 검색</div>
      <input type="text" id="guide-search" placeholder="검색어 입력 후 엔터 (공란 시 전체 데이터 보임)" onkeypress="if(event.keyCode==13) filterGuides()" style="border:2px solid var(--main-blue); padding:25px; font-size:22px;">
      <div id="guide-display" style="margin-top:25px;"></div>
    </div>
  </section>
  <aside>
    <div class="card">
      <div class="card-title">가이드 수기 등록</div>
      <input type="text" id="g-comp" placeholder="대상기업">
      <input type="text" id="g-key" placeholder="키워드">
      <textarea id="g-content" placeholder="가이드내용" style="height:120px;"></textarea>
      <button class="btn-blue" onclick="addOneGuide()">가이드 등록</button>
      <hr style="margin:30px 0; border:0; border-top:1px solid #eee;">
      <button class="btn-sample" onclick="downGuideSample()">📥 가이드 양식 다운로드</button>
      <input type="file" id="guide-input" accept=".xlsx">
      <button class="btn-blue" onclick="upGuide()" style="background:#475569;">엑셀 가이드 등록</button>
    </div>
  </aside>
</main>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAtn4kWV3_D18zivOHIEAkW09Lqt2ZjHqE",
    authDomain: "workhub-pro-be742.firebaseapp.com",
    databaseURL: "https://workhub-pro-be742-default-rtdb.firebaseio.com/",
    projectId: "workhub-pro-be742"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let allGuides = [];

  function init() {
    db.ref('companies').on('value', s => {
      const v = s.val();
      const list = v ? Object.values(v) : [];
      document.getElementById('c-all').innerText = list.length;
      document.getElementById('c-on').innerText = list.filter(i => i.status === '운영중').length;
      document.getElementById('c-off').innerText = list.filter(i => i.status === '종료').length;
      document.getElementById('tbody').innerHTML = list.reverse().map(i => `
        <tr><td><b>${i.name}</b></td><td>${i.code||'-'}</td><td>${i.period}</td>
        <td style="color:${i.status==='운영중'?'#6366f1':'#94a3b8'};font-weight:900;">${i.status}</td><td>${i.url||'-'}</td></tr>
      `).join('');
    });
    db.ref('guides').on('value', s => {
      const v = s.val();
      allGuides = v ? Object.values(v) : [];
      renderGuides(allGuides);
    });
  }

  function renderGuides(data) {
    document.getElementById('guide-display').innerHTML = data.reverse().map(i => `
      <div class="share-item"><b style="font-size:22px; color:var(--main-blue);">[${i.company}]</b> <b style="font-size:20px;">${i.keyword}</b><p style="margin-top:12px; color:#475569; line-height:1.6;">${i.content}</p></div>
    `).join('');
  }

  function filterGuides() {
    const q = document.getElementById('guide-search').value.toLowerCase().trim();
    if(!q) renderGuides(allGuides);
    else renderGuides(allGuides.filter(i => i.company.toLowerCase().includes(q) || i.keyword.toLowerCase().includes(q) || i.content.toLowerCase().includes(q)));
  }

  function addOneComp() {
    const name = document.getElementById('add-name').value;
    const period = document.getElementById('add-period').value;
    if(!name || !period) return alert("기업명과 기간은 필수입니다.");
    db.ref('companies').push({ name, code: document.getElementById('add-code').value, period, url: document.getElementById('add-url').value, status: period.endsWith('~') ? '운영중' : '종료' });
    ["add-name", "add-code", "add-period", "add-url"].forEach(id => document.getElementById(id).value = '');
  }

  function addOneGuide() {
    const company = document.getElementById('g-comp').value;
    const keyword = document.getElementById('g-key').value;
    const content = document.getElementById('g-content').value;
    if(!company || !keyword || !content) return alert("내용을 모두 입력하세요.");
    db.ref('guides').push({ company, keyword, content });
    ["g-comp", "g-key", "g-content"].forEach(id => document.getElementById(id).value = '');
  }

  async function upComp() {
    const file = document.getElementById('xl-input').files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      const rows = XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(e.target.result), { type: 'array' }).Sheets.Sheet1);
      const up = {};
      rows.forEach(r => {
        const p = String(r['운영기간'] || '');
        const k = db.ref().child('companies').push().key;
        up[`/companies/${k}`] = { name: r['기업명'], code: r['기업코드']||'', period: p, url: r['연수원 URL']||'', status: p.endsWith('~') ? '운영중' : '종료' };
      });
      await db.ref().update(up);
      alert("기업 데이터 등록 완료");
    };
    reader.readAsArrayBuffer(file);
  }

  async function upGuide() {
    const file = document.getElementById('guide-input').files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      const rows = XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(e.target.result), { type: 'array' }).Sheets.Sheet1);
      const up = {};
      rows.forEach(r => {
        const k = db.ref().child('guides').push().key;
        up[`/guides/${k}`] = { company: r['대상기업'], keyword: r['키워드'], content: r['가이드내용'] };
      });
      await db.ref().update(up);
      alert("가이드 등록 완료");
    };
    reader.readAsArrayBuffer(file);
  }

  function downCompSample() {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["기업명", "기업코드", "운영기간", "연수원 URL"]]), "Sheet1");
    XLSX.writeFile(wb, "Company_Sample.xlsx");
  }

  function downGuideSample() {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["대상기업", "키워드", "가이드내용"]]), "Sheet1");
    XLSX.writeFile(wb, "WorkHub_Guide_Sample.xlsx");
  }

  function tab(i) {
    document.querySelectorAll('.nav-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
    document.querySelectorAll('main').forEach((m, idx) => m.classList.toggle('active', idx === i));
  }
  window.onload = init;
</script>
</body>
</html>
