<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub | Smart Blue Office</title>
<style>
  :root {
    --header-grad: linear-gradient(135deg, #a2d2ff, #92a8d1);
    --main-blue: #4a90e2;
    --sky-blue: #f0f7ff;
    --navy-blue: #34495e;
    --white: #ffffff;
    --border-color: #e2e8f0;
  }

  body {
    font-family: 'Pretendard', sans-serif;
    margin: 0; padding: 0; background-color: #f4f7f9; color: #2c3e50;
  }

  header {
    background: var(--header-grad);
    padding: 50px 20px;
    text-align: center;
    color: var(--white);
    position: relative;
  }
  header h1 { margin: 0; font-size: 32px; font-weight: 800; }
  header .admin-toggle-btn {
    position: absolute; top: 20px; right: 20px;
    background: rgba(255,255,255,0.25); border: 1px solid white;
    padding: 6px 16px; border-radius: 20px; color: white; cursor: pointer; font-size: 13px;
  }

  main {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 25px;
    max-width: 1300px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .card {
    background: var(--white);
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    margin-bottom: 25px;
  }

  .title-area { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .title-area i { width: 4px; height: 18px; background: var(--main-blue); border-radius: 10px; }

  .guide-zone { grid-row: span 3; border-top: 6px solid var(--main-blue); }
  .share-zone { background-color: var(--sky-blue); border-top: 6px solid #84b6f4; }
  .reg-zone { background-color: #f8fafc; border-top: 6px solid var(--navy-blue); }
  
  /* 일괄 등록 섹션 전용 스타일 */
  .bulk-zone { border: 2px dashed #cbd5e1; background-color: #ffffff; }

  input, textarea { padding: 12px; border: 1px solid #d1d9e0; border-radius: 10px; font-size: 14px; outline: none; }
  button { padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; transition: 0.2s; }
  .btn-blue { background: var(--main-blue); color: white; }
  .btn-navy { background: var(--navy-blue); color: white; }
  .btn-outline { background: white; border: 1px solid var(--main-blue); color: var(--main-blue); font-size: 12px; }

  .list-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #edf2f7; }
  .badge { font-size: 11px; font-weight: 700; color: var(--main-blue); background: #e8f2ff; padding: 4px 10px; border-radius: 6px; }

  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <button class="admin-toggle-btn" onclick="toggleAdmin()">관리자 전환</button>
  <h1>WorkHub</h1>
  <p id="mode-text">사용자 모드입니다</p>
</header>

<main>
  <section class="card guide-zone">
    <div class="title-area"><i></i> 가이드 지식창고</div>
    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <input id="q" style="flex:1" placeholder="키워드를 입력하세요..." onkeyup="if(event.key==='Enter') renderGuides();">
        <button class="btn-blue" onclick="renderGuides()" style="padding:0 20px;">검색</button>
    </div>
    <div id="guide-result"></div>
  </section>

  <section class="card share-zone">
    <div class="title-area"><i style="background:#84b6f4"></i> 오늘의 공유사항</div>
    <div id="share-result" style="max-height: 150px; overflow-y: auto; margin-bottom: 15px;"></div>
    <div style="display:flex; flex-direction:column; gap:8px;">
        <textarea id="share-text" placeholder="공유 내용..." rows="2"></textarea>
        <button onclick="addShare()" class="btn-blue" style="background:#84b6f4">공유 등록</button>
    </div>
  </section>

  <section id="bulk-section" class="card bulk-zone" style="display:none;">
    <div class="title-area"><i></i> 엑셀/CSV 일괄 등록</div>
    <p style="font-size: 12px; color: #64748b; margin-bottom: 15px;">
        양식: <b>카테고리, 내용, 키워드</b> (쉼표 구분)<br>
        <button class="btn-outline" onclick="downloadSample()" style="margin-top:5px;">양식 샘플보기</button>
    </p>
    <div style="display:flex; flex-direction:column; gap:10px;">
        <input type="file" id="bulk-file" accept=".csv, .txt">
        <button onclick="importFile()" class="btn-blue">파일 데이터 업로드</button>
    </div>
  </section>

  <section class="card reg-zone">
    <div class="title-area"><i style="background:var(--navy-blue)"></i> 가이드 개별 등록</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
        <input id="new-category" placeholder="카테고리 (예: 업무)">
        <input id="new-keywords" placeholder="키워드 (쉼표 구분)">
        <textarea id="new-text" placeholder="내용을 입력하세요..." rows="3"></textarea>
        <button onclick="addGuide()" class="btn-navy">DB 저장</button>
    </div>
  </section>
</main>

<script>
let GUIDE = JSON.parse(localStorage.getItem("guide") || "[]");
let SHARES = JSON.parse(localStorage.getItem("shares") || "[]");
let isAdmin = false;

// 1. 가이드 렌더링
function renderGuides() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const container = document.getElementById("guide-result");
    const filtered = q === "" ? GUIDE : GUIDE.filter(item => 
        item.text.toLowerCase().includes(q) || item.category.toLowerCase().includes(q)
    );

    container.innerHTML = filtered.map((item, idx) => `
        <div class="list-item">
            <span class="badge">${item.category}</span>
            <div style="margin:10px 0; font-size:14px;">${item.text}</div>
            <div style="font-size:11px; color:#94a3b8;">${item.keywords.map(k=>'#'+k).join(' ')}</div>
            ${isAdmin ? `<div style="text-align:right;"><button onclick="deleteGuide(${idx})" style="color:#ff6b6b; background:none; font-size:11px;">삭제</button></div>` : ''}
        </div>
    `).join('') || "<p style='text-align:center; color:#ccc;'>데이터가 없습니다.</p>";
}

// 2. 파일 일괄 임포트 기능
function importFile() {
    const fileInput = document.getElementById("bulk-file");
    if (!fileInput.files.length) return alert("파일을 선택해주세요.");

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
        const content = e.target.result;
        const lines = content.split("\n");
        let count = 0;

        lines.forEach(line => {
            const parts = line.split(",");
            if (parts.length >= 2) {
                const category = parts[0].trim();
                const text = parts[1].trim();
                const keywords = parts[2] ? parts[2].split("|").map(k => k.trim()) : [];
                
                if (category && text) {
                    GUIDE.unshift({ category, text, keywords });
                    count++;
                }
            }
        });

        if (count > 0) {
            localStorage.setItem("guide", JSON.stringify(GUIDE));
            alert(`${count}건의 데이터가 성공적으로 등록되었습니다.`);
            renderGuides();
        } else {
            alert("유효한 데이터 형식이 없습니다.");
        }
    };
    reader.readAsText(file, "EUC-KR"); // 한글 깨짐 방지
}

// 3. 샘플 양식 알림
function downloadSample() {
    alert("메모장이나 엑셀에서 아래 형식으로 작성 후 CSV로 저장하세요:\n\n카테고리, 가이드내용, 키워드1|키워드2\n예: IT지원, 비번 초기화 방법, 비번|보안|초기화");
}

// 4. 개별 등록
function addGuide() {
    const cat = document.getElementById("new-category").value;
    const txt = document.getElementById("new-text").value;
    const kw = document.getElementById("new-keywords").value.split(",").map(k=>k.trim());
    if(!cat || !txt) return alert("내용을 입력하세요.");
    
    GUIDE.unshift({ category: cat, text: txt, keywords: kw });
    localStorage.setItem("guide", JSON.stringify(GUIDE));
    location.reload();
}

function addShare() {
    const txt = document.getElementById("share-text").value;
    if(!txt) return;
    SHARES.unshift({ text: txt, date: new Date().toLocaleTimeString() });
    localStorage.setItem("shares", JSON.stringify(SHARES));
    renderShares();
    document.getElementById("share-text").value = "";
}

function renderShares() {
    const container = document.getElementById("share-result");
    container.innerHTML = SHARES.map(s => `<div style="padding:8px; background:white; border-radius:8px; margin-bottom:8px; border-left:3px solid #84b6f4; font-size:13px;">${s.text}</div>`).join('');
}

function toggleAdmin() {
    if(!isAdmin && prompt("비번: 6559") === "6559") {
        isAdmin = true;
        document.getElementById("mode-text").innerText = "관리자 모드 (파일 업로드 활성)";
        document.getElementById("bulk-section").style.display = "block";
    } else {
        isAdmin = false;
        document.getElementById("mode-text").innerText = "사용자 모드";
        document.getElementById("bulk-section").style.display = "none";
    }
    renderGuides();
}

function deleteGuide(idx) { GUIDE.splice(idx,1); localStorage.setItem("guide", JSON.stringify(GUIDE)); renderGuides(); }

window.onload = () => { renderGuides(); renderShares(); };
</script>
</body>
</html>
