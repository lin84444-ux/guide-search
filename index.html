<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro | 지식 아카이브</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    --bg-main: #f8fafc;
    --header-grad: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
    --card-bg: #ffffff;
    --primary: #6366f1;
    --secondary: #94a3b8;
    --accent: #f43f5e;
    --text-main: #1e293b;
    --text-sub: #475569;
    --border-color: #f1f5f9;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
  }

  body { font-family: 'Pretendard', sans-serif; margin: 0; background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; }
  header { background: var(--header-grad); padding: 80px 20px 160px; text-align: center; position: relative; clip-path: ellipse(150% 100% at 50% 0%); }
  header h1 { margin: 0; font-size: 42px; font-weight: 900; color: #334155; }
  
  .admin-toggle-btn { position: absolute; top: 30px; right: 40px; background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.05); padding: 10px 22px; border-radius: 14px; cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s; font-size: 13px; font-weight: 700; }

  main { display: grid; grid-template-columns: 1.8fr 1fr; gap: 35px; max-width: 1400px; margin: -100px auto 80px; padding: 0 25px; position: relative; z-index: 10; }
  .card { background: var(--card-bg); border-radius: 32px; padding: 35px; box-shadow: var(--shadow); border: 1px solid #ffffff; }

  .title-area { font-size: 22px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
  .title-area i { width: 8px; height: 24px; border-radius: 4px; background: var(--primary); }

  .filter-bar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
  .filter-select { padding: 10px 15px; border-radius: 12px; border: 1.5px solid var(--border-color); font-size: 13px; font-weight: 600; color: var(--text-sub); outline: none; }

  .list-item { background: #ffffff; padding: 25px; border-radius: 24px; margin-bottom: 20px; border: 1.5px solid #f8fafc; position: relative;}
  .badge { font-size: 12px; font-weight: 800; color: var(--primary); background: #eef2ff; padding: 6px 14px; border-radius: 12px; }

  .excel-box { background: #f0f4ff; border: 2px dashed #c7d2fe; padding: 25px; border-radius: 24px; text-align: center; margin-bottom: 10px; }
  .sample-btn { display: inline-block; margin-top: 12px; font-size: 12px; color: var(--primary); background: white; border: 1px solid var(--primary); padding: 5px 15px; border-radius: 10px; cursor: pointer; font-weight: 700; }

  .input-group { display: flex; flex-direction: column; gap: 15px; }
  input, textarea { padding: 16px; border: 1.5px solid var(--border-color); border-radius: 18px; outline: none; font-size: 14px; background: #f8fafc; }
  button { padding: 16px; border: none; border-radius: 18px; cursor: pointer; font-weight: 800; transition: 0.2s; }
  .btn-blue { background: var(--primary); color: white; }
  .btn-navy { background: var(--secondary); color: white; }

  /* 관리자 전용 메뉴 */
  #admin-only-tools { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
  .reset-btn { color: var(--accent); font-size: 12px; text-decoration: underline; cursor: pointer; border: none; background: none; font-weight: 700; }
  
  /* 휴지통 알림 */
  #trash-bin { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 15px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 999; align-items: center; gap: 20px; }
  .restore-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: 700; cursor: pointer; }

  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <button class="admin-toggle-btn" onclick="toggleAdmin()">⚙️ 관리자 모드</button>
  <h1>WorkHub Pro</h1>
  <p id="mode-text">팀의 지식을 체계적으로 관리하세요</p>
</header>

<main>
  <section class="card guide-zone">
    <div class="title-area"><i></i> 가이드 보관함</div>
    <div class="filter-bar">
        <input id="q" style="flex:1; padding:10px 15px; border-radius:12px; border:1.5px solid var(--border-color);" placeholder="검색어 입력..." onkeyup="if(event.key==='Enter') renderGuides();">
        <select id="filter-cat" class="filter-select" onchange="renderGuides()"><option value="all">모든 기업</option></select>
        <button class="btn-blue" onclick="renderGuides()" style="padding:10px 25px; border-radius:12px;">검색</button>
    </div>
    <div id="guide-result"></div>
  </section>

  <aside>
    <section class="card reg-zone">
      <div class="title-area"><i></i> 데이터 센터</div>
      
      <div class="excel-box">
          <p style="font-size:14px; font-weight:800; color:var(--primary);">📊 엑셀 파일(.xlsx) 업로드</p>
          <p style="font-size:11px; color:var(--text-sub); margin-bottom:15px;">수정한 엑셀 파일을 그대로 올리세요</p>
          <input type="file" id="excel-file" accept=".xlsx, .xls" style="font-size:12px; width:100%;" onchange="readExcel(this)">
          <div class="sample-btn" onclick="downloadExcelSample()">엑셀 샘플 다운로드</div>
          
          <div id="admin-only-tools">
            <button class="reset-btn" onclick="resetData()">전체 데이터 초기화(비우기)</button>
          </div>
      </div>

      <div class="input-group">
          <input id="new-category" placeholder="기업명">
          <input id="new-keywords" placeholder="키워드 (쉼표 구분)">
          <textarea id="new-text" placeholder="내용 입력..." rows="3"></textarea>
          <button onclick="addGuide()" class="btn-navy">단일 추가</button>
      </div>
    </section>
  </aside>
</main>

<div id="trash-bin">
    <span>🗑️ 데이터를 초기화했습니다.</span>
    <button class="restore-btn" onclick="restoreData()">실행 취소 (복구하기)</button>
</div>

<script>
  let GUIDE = JSON.parse(localStorage.getItem("guide") || "[]");
  let TRASH = []; // 복구용 임시 보관소
  let isAdmin = false;

  // 1. 엑셀 파일 읽기 (xlsx 라이브러리 활용)
  function readExcel(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      
      // 엑셀을 JSON으로 변환
      const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
      
      if (jsonData.length > 1) {
        jsonData.slice(1).forEach(row => {
          if (row[0] && row[2]) { // 기업명과 내용이 있을 때만
            GUIDE.unshift({
              category: String(row[0]).trim(),
              keywords: row[1] ? String(row[1]).split(/[|/,]/).map(k => k.trim()) : [],
              text: String(row[2]).trim()
            });
          }
        });
        saveAndReload();
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // 2. 관리자 전용 초기화 (비밀번호 한 번 더!)
  function resetData() {
    const pw = prompt("보안을 위해 관리자 비밀번호를 다시 입력하세요.");
    if (pw === "6559") {
      TRASH = [...GUIDE]; // 현재 데이터를 휴지통에 복사
      GUIDE = [];
      localStorage.setItem("guide", JSON.stringify(GUIDE));
      renderGuides();
      showTrashBin();
    } else {
      alert("비밀번호가 틀렸습니다.");
    }
  }

  function showTrashBin() {
    const bin = document.getElementById("trash-bin");
    bin.style.display = "flex";
    setTimeout(() => { bin.style.display = "none"; }, 10000); // 10초 후 사라짐
  }

  function restoreData() {
    GUIDE = [...TRASH];
    saveAndReload();
  }

  // 3. 엑셀 샘플 다운로드 (XLSX 파일 생성)
  function downloadExcelSample() {
    const data = [
      ["기업명", "키워드", "내용"],
      ["삼성전자", "반도체|채용", "반도체 부문 채용은 하반기에 진행됩니다."],
      ["현대자동차", "복지|포인트", "복지 포인트는 매달 1일에 지급됩니다."]
    ];
    const ws = XLSX.utils.aoa_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "가이드양식");
    XLSX.writeFile(wb, "워크허브_가이드_양식.xlsx");
  }

  function saveAndReload() {
    localStorage.setItem("guide", JSON.stringify(GUIDE));
    location.reload();
  }

  function initFilters() {
    const catSelect = document.getElementById("filter-cat");
    const cats = [...new Set(GUIDE.map(i => i.category))].filter(Boolean);
    catSelect.innerHTML = '<option value="all">모든 기업</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  function renderGuides() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const cat = document.getElementById("filter-cat").value;
    const container = document.getElementById("guide-result");

    let filtered = GUIDE.filter(item => {
        const matchQ = (item.text || "").toLowerCase().includes(q) || (item.category || "").toLowerCase().includes(q);
        const matchCat = cat === "all" || item.category === cat;
        return matchQ && matchCat;
    });

    container.innerHTML = filtered.map((item, idx) => `
        <div class="list-item">
            <span class="badge">${item.category}</span>
            <div style="margin:15px 0; font-weight:600;">${item.text}</div>
            <div style="display:flex; gap:6px;">
                ${item.keywords ? item.keywords.map(k => `<span style="font-size:11px; color:#6366f1;">#${k}</span>`).join('') : ''}
            </div>
            ${isAdmin ? `<button onclick="deleteSingle(${idx})" style="color:red; font-size:11px; border:none; background:none; cursor:pointer; margin-top:10px;">삭제</button>` : ''}
        </div>
    `).join('') || "<p style='text-align:center; color:#94a3b8;'>데이터가 없습니다.</p>";
  }

  function addGuide() {
    const cat = document.getElementById("new-category").value;
    const txt = document.getElementById("new-text").value;
    const kw = document.getElementById("new-keywords").value;
    if(!cat || !txt) return alert("필수 정보를 입력하세요.");
    GUIDE.unshift({ category: cat, text: txt, keywords: kw.split(',').map(s=>s.trim()).filter(Boolean) });
    saveAndReload();
  }

  function deleteSingle(idx) {
    if(confirm("이 항목을 삭제할까요?")) {
      TRASH = [GUIDE[idx]]; // 한 개 삭제 시에도 복구 가능하게 저장
      GUIDE.splice(idx, 1);
      localStorage.setItem("guide", JSON.stringify(GUIDE));
      renderGuides();
      showTrashBin();
    }
  }

  function toggleAdmin() {
    const pw = prompt("관리자 비밀번호를 입력하세요.");
    if (pw === "6559") {
      isAdmin = !isAdmin;
      document.getElementById("mode-text").innerText = isAdmin ? "관리자 모드 활성화" : "팀의 지식을 체계적으로 관리하세요";
      document.getElementById("admin-only-tools").style.display = isAdmin ? "block" : "none";
      renderGuides();
    }
  }

  window.onload = () => { initFilters(); renderGuides(); };
</script>
</body>
</html>
