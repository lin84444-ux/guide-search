<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub | Smart Blue</title>

<style>
:root {
  --header-grad: linear-gradient(135deg, #a2d2ff, #92a8d1);

  --main-blue: #4a90e2;
  --sub-blue: #84b6f4;

  --bg-left: #F5F9FF;
  --bg-share: #FFF6E5;
  --bg-reg: #F8FAFC;

  --navy-blue: #34495e;
  --white: #ffffff;
  --red: #ff6b6b;

  --border-gray: #E5E7EB;
}

/* 기본 */
body {
  font-family: 'Pretendard', sans-serif;
  margin: 0;
  background-color: #f4f7f9;
  color: #2c3e50;
}

/* 헤더 */
header {
  background: var(--header-grad);
  padding: 40px 20px;
  text-align: center;
  color: var(--white);
  position: relative;
}
header h1 { margin: 0; font-size: 32px; }

.admin-toggle-btn {
  position: absolute;
  top: 15px;
  right: 20px;
  background: rgba(255,255,255,0.2);
  border: 1px solid white;
  padding: 6px 12px;
  border-radius: 20px;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}
.admin-toggle-btn:hover {
  background: white;
  color: var(--main-blue);
}

/* 레이아웃 */
main {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 20px;
  max-width: 1300px;
  margin: 20px auto;
  padding: 0 20px;
}

/* 카드 */
.card {
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  transition: 0.25s;
}

/* hover 효과 */
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.08);
}

/* 타이틀 */
.title-area {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.title-area i {
  width: 4px;
  height: 18px;
  background: var(--main-blue);
  border-radius: 10px;
}

/* 영역별 */
.guide-zone {
  grid-row: span 2;
  border-top: 6px solid var(--main-blue);
  background: var(--bg-left);
}

.share-zone {
  background-color: var(--bg-share);
  border-top: 6px solid #FFB74D;
  margin-bottom: 20px;
}

.share-zone .title-area i {
  background: #FFB74D;
}

.reg-zone {
  border-top: 6px solid var(--navy-blue);
  background: var(--bg-reg);
}

.reg-zone.edit-mode {
  border-top-color: var(--red);
  background-color: #FFF4E6;
}

/* 입력 */
.input-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

input, textarea {
  padding: 13px;
  border: 1px solid var(--border-gray);
  border-radius: 12px;
  outline: none;
  font-size: 14px;
  transition: 0.2s;
}

/* 포커스 효과 */
input:focus, textarea:focus {
  border-color: var(--main-blue);
  box-shadow: 0 0 0 3px rgba(74,144,226,0.15);
}

/* 버튼 */
button {
  padding: 13px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  transition: 0.2s;
}

.btn-blue {
  background: var(--main-blue);
  color: white;
}
.btn-blue:hover {
  background: #357ABD;
}

.btn-navy {
  background: var(--navy-blue);
  color: white;
}
.btn-navy:hover {
  background: #2c3e50;
}

.btn-red {
  background: var(--red);
  color: white;
}
.btn-red:hover {
  background: #e55050;
}

.btn-gray {
  background: #adb5bd;
  color: white;
}

/* 리스트 */
.list-item {
  background: white;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 15px;
  border: 1px solid #edf2f7;
}

/* 배지 */
.badge {
  font-size: 11px;
  font-weight: 700;
  color: var(--main-blue);
  background: #e8f2ff;
  padding: 4px 10px;
  border-radius: 8px;
}

/* 공유 */
.share-item {
  background: white;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
  border-left: 4px solid #FFB74D;
}

.share-time {
  display: block;
  font-size: 11px;
  color: #999;
}

/* 반응형 */
@media (max-width: 1000px) {
  main { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <button class="admin-toggle-btn" onclick="toggleAdmin()">관리자 전환</button>
  <h1>WorkHub</h1>
  <p id="mode-text">사용자 모드입니다</p>
</header>

<main>
  <section class="card guide-zone">
    <div class="title-area"><i></i> 가이드 검색 및 데이터</div>
    <div style="display:flex; gap:10px; margin-bottom:25px;">
        <input id="q" placeholder="검색어 입력 후 Enter..." onkeyup="if(event.key==='Enter') renderGuides();">
        <button class="btn-blue" onclick="renderGuides()" style="padding:0 25px;">검색</button>
    </div>
    <div id="guide-result"></div>
  </section>

  <section class="card share-zone">
    <div class="title-area"><i></i> 오늘의 공유사항</div>
    <div id="share-result" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px;"></div>
    <div class="input-group">
        <textarea id="share-text" placeholder="공유할 짧은 메시지" rows="2"></textarea>
        <button onclick="addShare(null)" class="btn-blue">Post Update</button>
    </div>
  </section>

  <section id="reg-card" class="card reg-zone">
    <div class="title-area"><i id="reg-icon"></i> <span id="reg-title">가이드 신규 등록</span></div>
    <div class="input-group">
        <input id="new-category" placeholder="카테고리">
        <input id="new-keywords" placeholder="검색용 키워드 (쉼표 구분)">
        <textarea id="new-text" placeholder="상세 내용을 작성하세요" rows="3"></textarea>

        <div style="font-size: 13px; background: #f1f5f9; padding: 10px; border-radius: 10px;">
            📎 <input type="file" id="new-file">
        </div>

        <div style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="sync-share">
            <label for="sync-share">등록 시 공유사항에도 게시</label>
        </div>

        <button onclick="addGuide()" class="btn-navy">Save to Database</button>
    </div>
  </section>
</main>

<script>
let GUIDE = JSON.parse(localStorage.getItem("guide") || "[]");
let SHARES = JSON.parse(localStorage.getItem("shares") || "[]");

function renderGuides() {
  const container = document.getElementById("guide-result");
  container.innerHTML = GUIDE.map(item => `
    <div class="list-item">
      <span class="badge">${item.category}</span>
      <div style="margin-top:10px;">${item.text}</div>
    </div>
  `).join('');
}

function addGuide() {
  const cat = document.getElementById("new-category").value;
  const txt = document.getElementById("new-text").value;
  if(!cat || !txt) return alert("입력하세요");
  GUIDE.unshift({category:cat, text:txt});
  localStorage.setItem("guide", JSON.stringify(GUIDE));
  renderGuides();
}

function addShare() {
  const txt = document.getElementById("share-text").value;
  if(!txt) return;
  SHARES.unshift({text:txt});
  localStorage.setItem("shares", JSON.stringify(SHARES));
  renderShares();
}

function renderShares() {
  const container = document.getElementById("share-result");
  container.innerHTML = SHARES.map(s => `
    <div class="share-item">${s.text}</div>
  `).join('');
}

function toggleAdmin(){ alert("데모"); }

window.onload = () => {
  renderGuides();
  renderShares();
};
</script>

</body>
</html>
