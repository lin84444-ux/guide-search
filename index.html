<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub | Smart Blue Office</title>
<style>
  :root {
    --primary-blue: #a2d2ff;
    --deep-blue: #4a90e2;
    --navy-blue: #2c3e50;
    --soft-blue: #eef6ff;
    --bg-gray: #f8f9fa;
    --white: #ffffff;
    --shadow: 0 4px 15px rgba(0,0,0,0.05);
  }

  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    margin: 0; padding: 0; background-color: var(--bg-gray); color: var(--navy-blue);
  }

  /* 1. 요청하신 이전 스타일 헤더 복구 */
  header {
    background: linear-gradient(135deg, var(--primary-blue), #92a8d1);
    padding: 40px 20px 60px;
    text-align: center;
    color: var(--white);
    position: relative;
  }
  header h1 { margin: 0; font-size: 32px; letter-spacing: -1px; font-weight: 800; }
  header #mode-text { margin-top: 10px; font-size: 14px; opacity: 0.9; }
  header .admin-toggle-btn {
    position: absolute; top: 20px; right: 20px;
    background: rgba(255,255,255,0.2); border: 1px solid white;
    padding: 5px 12px; border-radius: 20px; color: white; cursor: pointer; font-size: 12px;
  }

  /* 메인 레이아웃 */
  main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 25px;
    max-width: 1200px;
    margin: -40px auto 50px; /* 헤더 위로 살짝 올라오게 */
    padding: 0 20px;
    position: relative;
  }

  .card {
    background: var(--white);
    padding: 25px;
    border-radius: 16px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(0,0,0,0.02);
  }

  h2 { font-size: 18px; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ''; display: inline-block; width: 4px; height: 18px; background: var(--deep-blue); border-radius: 2px; }

  /* 영역별 블루 포인트 컬러 */
  .guide-zone { grid-row: span 2; }
  .share-zone { background-color: var(--soft-blue); border: 1px solid #d0e4ff; }
  .reg-zone { background-color: #f1f4f9; border: 1px solid #e2e8f0; }

  /* 입력 요소 */
  .input-group { display: flex; flex-direction: column; gap: 10px; }
  input, textarea {
    padding: 12px; border: 1px solid #ddd; border-radius: 10px; outline: none; transition: 0.2s;
  }
  input:focus { border-color: var(--deep-blue); box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1); }
  
  button {
    padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; transition: 0.2s;
  }
  .btn-blue { background: var(--deep-blue); color: white; }
  .btn-navy { background: var(--navy-blue); color: white; }
  button:hover { opacity: 0.9; transform: translateY(-1px); }

  /* 리스트 아이템 */
  .list-item {
    padding: 15px; border-bottom: 1px solid #f1f1f1; background: #fff; margin-bottom: 10px; border-radius: 10px;
  }
  .badge { font-size: 11px; color: var(--deep-blue); background: var(--soft-blue); padding: 3px 8px; border-radius: 5px; font-weight: bold; }
  
  .admin-controls { margin-top: 10px; text-align: right; display: flex; gap: 5px; justify-content: flex-end; }
  .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; font-weight: 400; }
  .btn-edit { background: #e2e8f0; color: #475569; }
  .btn-del { background: #f1f5f9; color: #94a3b8; }

  @media (max-width: 900px) { main { grid-template-columns: 1fr; margin-top: 20px; } .guide-zone { grid-row: auto; } }
</style>
</head>
<body>

<header>
  <button class="admin-toggle-btn" onclick="toggleAdmin()">관리자 전환</button>
  <h1>WorkHub</h1>
  <p id="mode-text">사용자 모드입니다</p>
</header>

<main>
  <section class="card guide-zone">
    <h2>가이드 검색 및 결과</h2>
    <div style="display:flex; gap:8px; margin-bottom:20px;">
        <input id="q" style="flex:1" placeholder="검색어 입력 후 엔터 (미입력 시 전체 노출)" 
               onkeyup="if(event.key==='Enter') renderGuides();">
        <button class="btn-blue" onclick="renderGuides()" style="padding:0 20px;">검색</button>
    </div>
    <div id="guide-result">
        <p style="text-align:center; color:#bbb; padding-top:30px;">검색어를 입력하고 엔터를 눌러주세요.</p>
    </div>
  </section>

  <section class="card share-zone">
    <h2 style="color:var(--deep-blue);">오늘의 공유사항</h2>
    <div id="share-result" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>
    <div class="input-group">
        <textarea id="share-text" placeholder="공유할 내용을 입력하세요..." rows="2"></textarea>
        <button onclick="addShare()" class="btn-blue">공유사항 등록</button>
    </div>
  </section>

  <section class="card reg-zone">
    <h2 style="color:var(--navy-blue);">새 가이드 등록</h2>
    <div class="input-group">
        <input id="new-category" placeholder="카테고리">
        <input id="new-keywords" placeholder="키워드 (쉼표 구분)">
        <textarea id="new-text" placeholder="상세 내용을 입력하세요..." rows="3"></textarea>
        
        <div style="font-size: 12px;">
            <label>📎 파일 첨부: </label>
            <input type="file" id="new-file" style="border:none; padding:0; font-size:11px;">
        </div>

        <div style="font-size: 13px; display:flex; align-items:center; gap:5px;">
            <input type="checkbox" id="sync-share" style="width:auto;">
            <label for="sync-share">등록 시 오늘의 공유사항에 게시</label>
        </div>

        <div id="reg-btn-area">
            <button onclick="addGuide()" class="btn-navy" style="width:100%;">DB 저장하기</button>
        </div>
    </div>
  </section>
</main>

<script>
let GUIDE = JSON.parse(localStorage.getItem("guide") || "[]");
let SHARES = JSON.parse(localStorage.getItem("shares") || "[]");
let isAdmin = false;
let editIdx = null;

function renderGuides() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const container = document.getElementById("guide-result");
    
    const filtered = q === "" ? GUIDE : GUIDE.filter(item => 
        item.text.toLowerCase().includes(q) || 
        item.category.toLowerCase().includes(q) ||
        (item.keywords && item.keywords.some(k => k.toLowerCase().includes(q)))
    );

    container.innerHTML = filtered.map((item, idx) => `
        <div class="list-item">
            <span class="badge">${item.category}</span>
            <div style="margin:10px 0; font-size:15px; color:var(--navy-blue); line-height:1.6;">${item.text}</div>
            ${item.fileName ? `<a href="${item.fileData}" download="${item.fileName}" style="display:inline-block; font-size:12px; color:var(--deep-blue); text-decoration:none; margin-bottom:5px;">📁 ${item.fileName}</a>` : ''}
            <div style="font-size:11px; color:#94a3b8;">${item.keywords.map(k=>'#'+k).join(' ')}</div>
            ${isAdmin ? `
                <div class="admin-controls">
                    <button class="btn-sm btn-edit" onclick="prepareEdit(${idx})">수정</button>
                    <button class="btn-sm btn-del" onclick="deleteGuide(${idx})">삭제</button>
                </div>
            ` : ''}
        </div>
    `).join('') || "<p style='text-align:center; padding:20px; color:#ccc;'>데이터가 없습니다.</p>";
}

function prepareEdit(idx) {
    const item = GUIDE[idx];
    document.getElementById("new-category").value = item.category;
    document.getElementById("new-keywords").value = item.keywords.join(", ");
    document.getElementById("new-text").value = item.text;
    editIdx = idx;
    
    const btnArea = document.getElementById("reg-btn-area");
    btnArea.innerHTML = `
        <div style="display:flex; gap:5px;">
            <button onclick="addGuide()" class="btn-blue" style="flex:1">수정 저장</button>
            <button onclick="cancelEdit()" style="background:#ddd; flex:0.3">취소</button>
        </div>
    `;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function cancelEdit() {
    location.reload();
}

async function addGuide() {
    const cat = document.getElementById("new-category").value;
    const txt = document.getElementById("new-text").value;
    const kw = document.getElementById("new-keywords").value.split(",").map(k=>k.trim());
    const fileInput = document.getElementById("new-file");
    const isSync = document.getElementById("sync-share").checked;

    if(!cat || !txt) return alert("필수 항목을 입력하세요.");

    let fileData = (editIdx !== null) ? GUIDE[editIdx].fileData : null;
    let fileName = (editIdx !== null) ? GUIDE[editIdx].fileName : null;

    if(fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileName = file.name;
        fileData = await toBase64(file);
    }

    const newEntry = { category: cat, text: txt, keywords: kw, fileName, fileData };
    
    if(editIdx !== null) {
        GUIDE[editIdx] = newEntry;
        editIdx = null;
    } else {
        GUIDE.unshift(newEntry);
        if(isSync) addShare(txt);
    }

    localStorage.setItem("guide", JSON.stringify(GUIDE));
    alert("완료되었습니다.");
    location.reload();
}

function addShare(directText = null) {
    const txt = directText || document.getElementById("share-text").value;
    if(!txt) return;
    SHARES.unshift({ text: txt, date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
    localStorage.setItem("shares", JSON.stringify(SHARES));
    renderShares();
    if(!directText) document.getElementById("share-text").value = "";
}

function renderShares() {
    const container = document.getElementById("share-result");
    container.innerHTML = SHARES.map((s, idx) => `
        <div style="padding:10px; background:white; border-radius:10px; margin-bottom:8px; border-left:4px solid var(--deep-blue);">
            <div style="font-size:13px;">${s.text}</div>
            <div style="display:flex; justify-content:space-between; margin-top:5px;">
                <span style="font-size:10px; color:#999;">${s.date}</span>
                ${isAdmin ? `<span onclick="deleteShare(${idx})" style="cursor:pointer; color:#999; font-size:11px;">삭제</span>` : ''}
            </div>
        </div>
    `).join('') || "<p style='color:#bbb; font-size:12px; text-align:center;'>공유사항이 없습니다.</p>";
}

const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
});

function toggleAdmin() {
    if(!isAdmin) {
        if(prompt("관리자 암호(6559):") === "6559") {
            isAdmin = true;
            document.getElementById("mode-text").innerText = "관리자 모드";
            document.querySelectorAll(".admin-toggle-btn").forEach(el => el.style.background = "white");
            document.querySelectorAll(".admin-toggle-btn").forEach(el => el.style.color = "var(--deep-blue)");
        }
    } else {
        isAdmin = false;
        document.getElementById("mode-text").innerText = "사용자 모드";
        document.querySelectorAll(".admin-toggle-btn").forEach(el => el.style.background = "rgba(255,255,255,0.2)");
        document.querySelectorAll(".admin-toggle-btn").forEach(el => el.style.color = "white");
    }
    renderGuides();
    renderShares();
}

function deleteGuide(idx) { if(confirm("정말 삭제하시겠습니까?")) { GUIDE.splice(idx,1); localStorage.setItem("guide", JSON.stringify(GUIDE)); renderGuides(); } }
function deleteShare(idx) { SHARES.splice(idx,1); localStorage.setItem("shares", JSON.stringify(SHARES)); renderShares(); }

window.onload = () => { renderShares(); };
</script>
</body>
</html>
