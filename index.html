<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>WorkHub Pro - 최종 수정본</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --main-purple: #6366f1; --bg-light: #f8fafc; --white: #ffffff; --text-dark: #1e293b; --border-color: #e2e8f0; }
  body { font-family: 'Pretendard', sans-serif; margin: 0; background: var(--bg-light); color: var(--text-dark); }
  
  /* 헤더 및 관리자 버튼 */
  header { padding: 40px 20px; text-align: center; background: #fff; position: relative; border-bottom: 1px solid var(--border-color); }
  .logo { font-size: 32px; font-weight: 900; color: #1e293b; margin-bottom: 25px; }
  
  /* 관리자 버튼 - 무조건 보이도록 수정 */
  .admin-btn-fixed { position: absolute; top: 20px; right: 25px; padding: 10px 18px; border-radius: 12px; border: 2px solid var(--main-purple); background: #fff; cursor: pointer; color: var(--main-purple); font-size: 14px; font-weight: 800; z-index: 999; }
  .admin-btn-fixed:hover { background: var(--main-purple); color: #fff; }

  .nav-tabs { display: inline-flex; background: #f1f5f9; padding: 6px; border-radius: 12px; margin-bottom: 30px; }
  .nav-btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; color: #64748b; background: transparent; }
  .nav-btn.active { background: var(--main-purple); color: #fff; }

  main { max-width: 1400px; margin: 0 auto; padding: 20px; display: none; grid-template-columns: 2fr 1fr; gap: 25px; }
  main.active { display: grid; }

  .card { background: var(--white); border-radius: 20px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
  .card-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
  .card-title span::before { content: ''; display: inline-block; width: 4px; height: 18px; background: var(--main-purple); margin-right: 10px; border-radius: 10px; }

  .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
  .status-box { background: #fff; padding: 25px; border-radius: 20px; text-align: center; border: 1px solid var(--border-color); }
  .status-box .num { font-size: 28px; font-weight: 900; margin-top: 10px; }

  input { width: 100%; padding: 15px; border-radius: 12px; border: 1.5px solid var(--border-color); margin-bottom: 15px; box-sizing: border-box; background: #fcfdfe; }
  .btn-submit { width: 100%; padding: 18px; border-radius: 12px; border: none; background: var(--main-purple); color: #fff; font-weight: 800; cursor: pointer; font-size: 16px; }
  
  /* 삭제 버튼 전용 */
  .btn-nuke { background: #ef4444; color: white; border: none; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-weight: 800; display: none; }
  .admin-mode .btn-nuke { display: block; }

  .list-table { width: 100%; border-collapse: collapse; }
  .list-table th { text-align: left; padding: 12px; color: #64748b; border-bottom: 2px solid #f1f5f9; font-size: 14px; }
  .list-table td { padding: 18px 12px; border-bottom: 1px solid #f1f5f9; font-size: 15px; }
  
  .del-col { display: none; }
  .admin-mode .del-col { display: table-cell; }

  #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; align-items: center; justify-content: center; z-index: 10000; font-weight: 800; color: var(--main-purple); }
</style>
</head>
<body id="app-body">

<div id="loading">데이터 처리 중...</div>

<header>
  <button id="admin-auth-btn" class="admin-btn-fixed" onclick="loginAdmin()">⚙️ 관리자 인증</button>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab(0)">🏢 기업관리시스템</button>
    <button class="nav-btn" onclick="switchTab(1)">🚀 워크허브</button>
  </div>
</header>

<main id="tab-0" class="active">
  <div>
    <div class="status-grid">
      <div class="status-box"><div>전체</div><div class="num" id="all-count">0</div></div>
      <div class="status-box"><div>운영중</div><div class="num" id="on-count" style="color:var(--main-purple)">0</div></div>
      <div class="status-box"><div>종료</div><div class="num" id="off-count">0</div></div>
    </div>
    <div class="card">
      <div class="card-title">
        <span>기업 현황 리스트</span>
        <button class="btn-nuke" onclick="nukeEverything()">⚠️ 전체 데이터 강제 삭제</button>
      </div>
      <input type="text" id="search-input" placeholder="기업명 검색..." onkeyup="render()">
      <table class="list-table">
        <thead><tr><th>기업명</th><th>코드</th><th>운영기간</th><th>상태</th><th>연수원 URL</th><th class="del-col">삭제</th></tr></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
  <aside>
    <div class="card">
      <div class="card-title"><span>엑셀 데이터 등록</span></div>
      <input type="file" id="excel-file" accept=".xlsx">
      <button class="btn-submit" onclick="uploadData()">파일 등록하기</button>
    </div>
  </aside>
</main>

<main id="tab-1">
  <div class="card" style="grid-column: span 2; text-align: center; padding: 100px;">
    <h2 style="color: #94a3b8;">🚀 워크허브 서비스 준비 중</h2>
    <p>이 페이지는 가이드 관리 및 확인을 위한 공간입니다.</p>
  </div>
</main>

<script>
  // Firebase 초기화
  const firebaseConfig = {
    apiKey: "AIzaSyAtn4kWV3_D18zivOHIEAkW09Lqt2ZjHqE",
    authDomain: "workhub-pro-be742.firebaseapp.com",
    databaseURL: "https://workhub-pro-be742-default-rtdb.firebaseio.com/",
    projectId: "workhub-pro-be742"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let DATA = [];

  function init() {
    db.ref('companies').on('value', snap => {
      const val = snap.val();
      DATA = val ? Object.entries(val).map(([k, v]) => ({ ...v, key: k })) : [];
      render();
    });
  }

  function render() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const filtered = DATA.filter(d => d.name.toLowerCase().includes(q));
    
    document.getElementById('all-count').innerText = DATA.length;
    document.getElementById('on-count').innerText = DATA.filter(d => d.status === '운영중').length;
    document.getElementById('off-count').innerText = DATA.filter(d => d.status === '종료').length;

    document.getElementById('table-body').innerHTML = filtered.reverse().map(d => `
      <tr>
        <td><b>${d.name}</b></td><td>${d.code}</td><td>${d.period}</td>
        <td style="color:${d.status==='운영중'?'#6366f1':'#94a3b8'}; font-weight:800;">${d.status}</td>
        <td><a href="${d.url.startsWith('http')?d.url:'http://'+d.url}" target="_blank">${d.url}</a></td>
        <td class="del-col"><button onclick="deleteSingle('${d.key}')" style="color:red; cursor:pointer; border:none; background:none; font-weight:800;">삭제</button></td>
      </tr>`).join('');
  }

  function loginAdmin() {
    if(prompt("관리자 비밀번호를 입력하세요.") === "6559") {
      document.getElementById('app-body').classList.add('admin-mode');
      document.getElementById('admin-auth-btn').innerText = "🔴 관리자 모드 ON";
      alert("관리자 인증 완료! 전체 삭제 버튼이 활성화되었습니다.");
      render();
    } else {
      alert("비밀번호가 틀렸습니다.");
    }
  }

  async function nukeEverything() {
    if(confirm("정말로 기존의 3,500여 개 데이터를 모두 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) {
      document.getElementById('loading').style.display = 'flex';
      await db.ref('companies').remove();
      document.getElementById('loading').style.display = 'none';
      alert("데이터가 깨끗하게 비워졌습니다. 이제 파일을 등록하세요.");
    }
  }

  async function uploadData() {
    const file = document.getElementById('excel-file').files[0];
    if(!file) return alert("파일을 선택하세요.");
    document.getElementById('loading').style.display = 'flex';
    const reader = new FileReader();
    reader.onload = async (e) => {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      const updates = {};
      rows.forEach(r => {
        if(r['기업명']) {
          const k = db.ref().child('companies').push().key;
          updates[`/companies/${k}`] = {
            name: r['기업명'], code: r['기업코드']||'', period: r['운영기간']||'',
            url: r['연수원 URL']||'', status: r['상태']||'운영중'
          };
        }
      });
      await db.ref().update(updates);
      document.getElementById('loading').style.display = 'none';
      alert("등록 완료!");
    };
    reader.readAsArrayBuffer(file);
  }

  function deleteSingle(k) { if(confirm("삭제?")) db.ref('companies').child(k).remove(); }
  function switchTab(i) {
    document.querySelectorAll('.nav-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
    document.querySelectorAll('main').forEach((m, idx) => m.classList.toggle('active', idx === i));
  }

  window.onload = init;
</script>
</body>
</html>
