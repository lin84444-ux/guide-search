<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --main-blue: #2e6ff2; --bg: #f4f7ff; --white: #ffffff; --border: #eef2f8; --text: #1e293b; --danger: #ef4444; }
  body { font-family: 'Pretendard', sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
  
  /* 로딩 오버레이 */
  #loading-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(5px);
    display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10000;
  }
  .spinner { width: 50px; height: 50px; border: 5px solid var(--border); border-top: 5px solid var(--main-blue); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  header { padding: 40px 20px 10px; text-align: center; position: relative; }
  .logo { font-size: 32px; font-weight: 900; color: #0f172a; margin-bottom: 25px; }
  .admin-btn { position: absolute; top: 20px; right: 25px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: #64748b; font-size: 13px; font-weight: 600; transition: 0.2s; }
  .admin-btn:hover { background: #f8fafc; }

  /* 탭 복구 */
  .nav-tabs { display: inline-flex; background: var(--white); padding: 6px; border-radius: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 40px; }
  .nav-btn { padding: 12px 28px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; background: transparent; color: #94a3b8; font-size: 14px; transition: 0.3s; }
  .nav-btn.active { background: var(--main-blue); color: #fff; }

  main { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: none; grid-template-columns: 1.8fr 1.1fr; gap: 30px; }
  main.active { display: grid; }
  .card { background: var(--white); border-radius: 35px; padding: 35px; margin-bottom: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.03); }
  .card-title { font-size: 20px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between; }
  .card-title span::before { content: 'ㅣ'; color: var(--main-blue); font-weight: 900; margin-right: 8px; }

  input { width: 100%; padding: 18px 20px; border-radius: 16px; border: 1.5px solid #f1f5f9; margin-bottom: 15px; box-sizing: border-box; background: #f8fafc; font-size: 15px; outline: none; }
  .btn-submit { width: 100%; padding: 20px; border-radius: 18px; border: none; background: var(--main-blue); color: #fff; font-weight: 800; cursor: pointer; font-size: 16px; transition: 0.3s; }
  .btn-submit:disabled { background: #cbd5e1; cursor: not-allowed; }
  .btn-danger { background: var(--danger); font-size: 13px; padding: 10px 15px; border-radius: 12px; display: none; cursor: pointer; color: #fff; border: none; }
  .admin-mode .btn-danger { display: inline-block; }

  .list-table { width: 100%; border-collapse: collapse; }
  .list-table th { text-align: left; padding: 15px; font-size: 12.5px; color: #94a3b8; border-bottom: 2px solid #f8fafc; }
  .list-table td { padding: 22px 15px; border-bottom: 1px solid #fbfcfe; font-size: 14.5px; }
  .del-btn { display: none; color: var(--danger); border: none; background: none; cursor: pointer; font-weight: bold; }
  .admin-mode .del-btn { display: inline-block; }
</style>
</head>
<body id="app-body">

<div id="loading-overlay"><div class="spinner"></div><div style="margin-top:15px; font-weight:700; color:var(--main-blue);">데이터 처리 중...</div></div>

<header>
  <button class="admin-btn" onclick="toggleAdmin()">⚙️ 관리자 모드</button>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab(0)">🏢 기업관리시스템</button>
    <button class="nav-btn" onclick="switchTab(1)">🚀 워크허브</button>
  </div>
</header>

<main id="tab-0" class="active">
  <div>
    <section class="card">
      <div class="card-title">
        <span>기업 현황 리스트</span>
        <button class="btn-danger" onclick="deleteAllData()">전체 데이터 삭제</button>
      </div>
      <input type="text" id="search-input" placeholder="기업명 검색" onkeyup="render()">
      <table class="list-table">
        <thead><tr><th>기업명</th><th>코드</th><th>운영기간</th><th>상태</th><th>URL</th><th class="del-btn">관리</th></tr></thead>
        <tbody id="list-body"></tbody>
      </table>
    </section>
  </div>
  <div>
    <section class="card">
      <div class="card-title"><span>기업 등록</span></div>
      <input id="in-name" placeholder="기업명">
      <input id="in-code" placeholder="기업코드">
      <input id="in-url" placeholder="URL">
      <input id="in-period" placeholder="운영기간 (예: 2026.01~)">
      <button id="btn-add-one" class="btn-submit" onclick="addOne()">데이터 등록</button>
    </section>
    <section class="card">
      <div class="card-title"><span>파일 등록</span></div>
      <button class="btn-submit" style="background:#1e293b; margin-bottom:15px;" onclick="downloadSample()">📥 샘플 양식 받기</button>
      <input type="file" id="excel-input" accept=".xlsx, .xls">
      <button id="btn-upload" class="btn-submit" onclick="uploadExcel()">파일 등록</button>
    </section>
  </div>
</main>

<main id="tab-1">
  <section class="card" style="grid-column: span 2; text-align: center; padding: 100px;">
    <h2>🚀 워크허브 서비스 준비 중</h2>
    <p style="color: #64748b;">이 페이지는 워크허브 관리 및 가이드 확인을 위한 공간입니다.</p>
  </section>
</main>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAtn4kWV3_D18zivOHIEAkW09Lqt2ZjHqE",
    authDomain: "workhub-pro-be742.firebaseapp.com",
    databaseURL: "https://workhub-pro-be742-default-rtdb.firebaseio.com/",
    projectId: "workhub-pro-be742",
    storageBucket: "workhub-pro-be742.firebasestorage.app",
    messagingSenderId: "547958464107",
    appId: "1:547958464107:web:3c78c150e0b3c77969db2e"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let DATA = [], ADMIN = false, LOCK = false;

  function showLoading(v) { document.getElementById('loading-overlay').style.display = v ? 'flex' : 'none'; LOCK = v; }

  // 탭 전환 함수
  function switchTab(idx) {
    document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
    document.querySelectorAll('main').forEach((m, i) => m.classList.toggle('active', i === idx));
  }

  // 상태 자동 판별 (종료일 유무 체크)
  function parseStatus(period) {
    const p = String(period || '').replace(/\s/g, '');
    const parts = p.split('~');
    // ~ 뒤에 날짜 정보(4자 이상)가 있으면 무조건 종료
    if (parts.length > 1 && parts[1].length >= 4) return "종료";
    return "운영중";
  }

  function load() {
    db.ref('companies').on('value', (ss) => {
      const val = ss.val();
      DATA = val ? Object.entries(val).map(([k, v]) => ({ ...v, key: k })) : [];
      render();
    });
  }

  async function uploadExcel() {
    if (LOCK) return;
    const file = document.getElementById('excel-input').files[0];
    if (!file) return alert("파일을 선택하세요.");
    
    showLoading(true);
    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        const updates = {};
        rows.forEach(r => {
          if (r['기업명']) {
            const key = db.ref().child('companies').push().key;
            const period = r['운영기간'] || '';
            updates[`/companies/${key}`] = {
              name: r['기업명'], code: r['기업코드'] || '',
              period: period, url: r['연수원 URL'] || '',
              status: parseStatus(period)
            };
          }
        });
        await db.ref().update(updates);
        alert(Object.keys(updates).length + "건 등록 완료");
      } catch (err) { alert("오류 발생"); }
      showLoading(false);
      document.getElementById('excel-input').value = "";
    };
    reader.readAsArrayBuffer(file);
  }

  async function addOne() {
    if (LOCK) return;
    const n = document.getElementById('in-name').value;
    const p = document.getElementById('in-period').value;
    if(!n) return alert("기업명 입력!");
    showLoading(true);
    await db.ref('companies').push({
      name: n, code: document.getElementById('in-code').value,
      url: document.getElementById('in-url').value,
      period: p, status: parseStatus(p)
    });
    showLoading(false);
    document.getElementById('in-name').value = "";
    alert("등록 완료");
  }

  function render() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const f = DATA.filter(d => d.name.toLowerCase().includes(q));
    document.getElementById('list-body').innerHTML = f.reverse().map(d => `
      <tr><td style="font-weight:800;">${d.name}</td><td>${d.code}</td><td>${d.period}</td>
      <td style="color:${d.status==='운영중'?'#2e6ff2':'#94a3b8'}; font-weight:800;">${d.status}</td>
      <td>${d.url}</td><td><button class="del-btn" onclick="del('${d.key}')">삭제</button></td></tr>`).join('');
  }

  function deleteAllData() { if(confirm("전체 삭제?")) db.ref('companies').remove(); }
  function del(k) { if(confirm("삭제?")) db.ref('companies').child(k).remove(); }
  function toggleAdmin() { ADMIN = !ADMIN; document.getElementById('app-body').classList.toggle('admin-mode', ADMIN); render(); }
  function downloadSample() {
    const data = [["기업명", "기업코드", "운영기간", "연수원 URL"], ["운영예시", "A01", "2026.01~", "on.hunet.co.kr"], ["종료예시", "B01", "2025.01~2025.12", "off.hunet.co.kr"]];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), "Sheet1");
    XLSX.writeFile(wb, "WorkHub_샘플.xlsx");
  }
  window.onload = load;
</script>
</body>
</html>
