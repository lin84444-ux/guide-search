<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro | 통합 관리 시스템</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    --bg-color: #f4f7ff;
    --primary: #6366f1;
    --text-dark: #1e293b;
    --text-light: #64748b;
    --white: #ffffff;
    --border: #e2e8f0;
    --accent: #f43f5e;
  }

  body { font-family: 'Pretendard', sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-dark); }
  
  header { padding: 60px 20px 30px; text-align: center; position: relative; }
  .logo { font-size: 36px; font-weight: 900; color: #0f172a; margin-bottom: 25px; letter-spacing: -1px; }

  /* 관리자 전환 버튼 (상단 고정) */
  .admin-btn {
    position: absolute; top: 20px; right: 20px;
    padding: 10px 20px; border-radius: 14px; border: 1.5px solid var(--border);
    background: var(--white); color: var(--text-light); font-weight: 800; font-size: 13px;
    cursor: pointer; transition: 0.3s; z-index: 100;
  }
  .admin-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  .nav-tabs { display: inline-flex; background: var(--white); padding: 6px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 40px; }
  .nav-btn {
    padding: 12px 30px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s;
    background: transparent; color: var(--text-light); font-size: 14px;
  }
  .nav-btn.active { background: var(--primary); color: var(--white); }

  main { max-width: 1300px; margin: 0 auto 50px; padding: 0 20px; }
  .tab-content { display: none; grid-template-columns: 1.8fr 1.1fr; gap: 30px; }
  .tab-content.active { display: grid; }

  .card { background: var(--white); border-radius: 28px; padding: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.02); height: fit-content; }
  .card-title { font-size: 20px; font-weight: 800; margin-bottom: 22px; display: flex; align-items: center; gap: 10px; }
  .card-title::before { content: ''; width: 4px; height: 20px; background: var(--primary); border-radius: 10px; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
  .stat-box { background: #f8faff; border: 1px solid #eef2ff; padding: 18px; border-radius: 20px; text-align: center; }
  .stat-val { font-size: 24px; font-weight: 900; color: var(--primary); }

  input, textarea, select {
    width: 100%; box-sizing: border-box; padding: 15px; border-radius: 14px;
    border: 1.5px solid #f1f5f9; background: #f8fafc; outline: none; font-size: 14px; margin-bottom: 12px;
  }
  input:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.05); }

  .btn-primary { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--primary); color: white; font-weight: 800; cursor: pointer; transition: 0.2s; }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

  .excel-box { border: 2px dashed #cbd5e1; border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 20px; background: #fcfdff; }
  .sample-link { display: inline-block; margin-top: 10px; font-size: 12px; color: var(--primary); text-decoration: underline; cursor: pointer; font-weight: 700; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th { text-align: left; padding: 14px; font-size: 12px; color: var(--text-light); border-bottom: 2px solid #f1f5f9; }
  td { padding: 16px 14px; font-size: 14px; border-bottom: 1px solid #f8fafc; }
  
  .del-btn { display: none; border: none; color: var(--accent); cursor: pointer; background: none; font-size: 12px; font-weight: bold; }
  .admin-active .del-btn { display: inline-block; }

  .badge { padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; background: #eef2ff; color: var(--primary); }

  @media (max-width: 1100px) { .tab-content { grid-template-columns: 1fr; } }
</style>
</head>
<body id="main-body">

<header>
  <button class="admin-btn" id="admin-toggle-btn" onclick="toggleAdminMode()">⚙️ 관리자 모드</button>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab('corp-tab', this)">🏢 기업관리시스템</button>
    <button class="nav-btn" onclick="switchTab('guide-tab', this)">🚀 워크허브</button>
  </div>
</header>

<main>
  <div id="corp-tab" class="tab-content active">
    <section class="card">
      <div class="card-title">기업 현황 관리</div>
      <div class="stats-grid">
        <div class="stat-box"><span style="font-size:12px; color:var(--text-light);">전체 기업</span><br><b class="stat-val" id="ca">0</b></div>
        <div class="stat-box"><span style="font-size:12px; color:var(--text-light);">운영 중</span><br><b class="stat-val" id="co">0</b></div>
        <div class="stat-box"><span style="font-size:12px; color:var(--text-light);">종료</span><br><b class="stat-val" id="cf">0</b></div>
      </div>
      <input type="text" id="cs" placeholder="기업명으로 검색 (Enter)" onkeyup="if(event.key==='Enter') renderCorps()">
      <div style="overflow-x: auto;">
        <table>
          <thead><tr><th>기업명</th><th>상태</th><th>기간</th><th>관리</th></tr></thead>
          <tbody id="corp-list-body"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-title">신규 기업 등록</div>
      <div class="excel-box">
        <span style="font-size:13px; font-weight:800; color:var(--primary);">기업 일괄 등록 (CSV)</span>
        <input type="file" onchange="uploadCSV(this, 'corp')" style="font-size:11px; margin-top:10px; width:100%;">
      </div>
      <input id="in-cn" placeholder="기업명">
      <input id="in-cc" placeholder="기업코드">
      <input id="in-cu" placeholder="기업 URL (http://...)">
      <input id="in-cp" placeholder="운영기간 (예: 24년 상반기)">
      <select id="in-cs"><option>운영중</option><option>종료</option></select>
      <button class="btn-primary" onclick="addNewCorp()">기업 추가하기</button>
    </section>
  </div>

  <div id="guide-tab" class="tab-content">
    <section class="card">
      <div class="card-title">가이드 보관함</div>
      <input type="text" id="gs" placeholder="내용 또는 키워드 검색 (공란 Enter 시 전체 노출)" onkeyup="if(event.key==='Enter') renderGuides()">
      <div id="guide-list-area" style="margin-top:20px;"></div>
    </section>

    <section class="card">
      <div class="card-title">데이터 등록 센터</div>
      <div class="excel-box">
        <span style="font-size:13px; font-weight:800; color:var(--primary);">가이드 일괄 등록</span>
        <input type="file" onchange="uploadCSV(this, 'guide')" style="font-size:11px; margin-top:10px; width:100%;">
        <span class="sample-link" onclick="downloadGuideSample()">[샘플 양식 다운로드]</span>
      </div>
      <input id="in-gn" placeholder="기업명 (예: GS건설)">
      <input id="in-gk" placeholder="키워드 (쉼표 구분)">
      <textarea id="in-gt" placeholder="가이드 상세 내용" rows="4"></textarea>
      <button class="btn-primary" style="background:#1e293b;" onclick="addNewGuide()">가이드 저장</button>
    </section>
  </div>
</main>

<script>
  let DB_CORPS = JSON.parse(localStorage.getItem("db_corps") || "[]");
  let DB_GUIDES = JSON.parse(localStorage.getItem("db_guides") || "[]");
  let IS_ADMIN = false;

  // 관리자 모드 전환 (비번 6559)
  function toggleAdminMode() {
    if(!IS_ADMIN) {
      if(prompt("관리자 비밀번호를 입력하세요.") === "6559") {
        IS_ADMIN = true;
        document.getElementById("main-body").classList.add("admin-active");
        document.getElementById("admin-toggle-btn").classList.add("active");
        document.getElementById("admin-toggle-btn").innerText = "🔓 관리자 On";
      } else { alert("비밀번호가 올바르지 않습니다."); }
    } else {
      IS_ADMIN = false;
      document.getElementById("main-body").classList.remove("admin-active");
      document.getElementById("admin-toggle-btn").classList.remove("active");
      document.getElementById("admin-toggle-btn").innerText = "⚙️ 관리자 모드";
    }
    renderCorps(); renderGuides();
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  // --- 기업 관리 함수 ---
  function addNewCorp() {
    const name = document.getElementById("in-cn").value;
    if(!name) return alert("기업명을 입력하세요.");
    DB_CORPS.unshift({
      name, 
      code: document.getElementById("in-cc").value,
      url: document.getElementById("in-cu").value,
      period: document.getElementById("in-cp").value,
      status: document.getElementById("in-cs").value
    });
    saveDB();
    ["in-cn","in-cc","in-cu","in-cp"].forEach(id => document.getElementById(id).value = "");
  }

  function renderCorps() {
    const q = document.getElementById("cs").value.trim().toLowerCase();
    const filtered = DB_CORPS.filter(c => c.name.toLowerCase().includes(q));
    
    document.getElementById("ca").innerText = DB_CORPS.length;
    document.getElementById("co").innerText = DB_CORPS.filter(c => c.status === '운영중').length;
    document.getElementById("cf").innerText = DB_CORPS.filter(c => c.status === '종료').length;

    document.getElementById("corp-list-body").innerHTML = filtered.map((c, i) => `
      <tr>
        <td style="font-weight:800;">${c.name}</td>
        <td style="color:${c.status==='운영중'?'#6366f1':''}">${c.status}</td>
        <td style="font-size:12px; color:var(--text-light);">${c.period || '-'}</td>
        <td><button class="del-btn" onclick="deleteData('corp', ${i})">삭제</button></td>
      </tr>`).join('') || '<tr><td colspan="4" style="text-align:center; padding:40px;">데이터가 없습니다.</td></tr>';
  }

  // --- 워크허브 함수 ---
  function addNewGuide() {
    const name = document.getElementById("in-gn").value;
    const txt = document.getElementById("in-gt").value;
    if(!name || !txt) return alert("기업명과 내용을 모두 입력하세요.");
    DB_GUIDES.unshift({
      category: name,
      keywords: document.getElementById("in-gk").value.split(',').map(s=>s.trim()).filter(Boolean),
      text: txt
    });
    saveDB();
    ["in-gn","in-gk","in-gt"].forEach(id => document.getElementById(id).value = "");
  }

  function renderGuides() {
    const q = document.getElementById("gs").value.trim().toLowerCase();
    const filtered = DB_GUIDES.filter(g => 
      !q || g.text.toLowerCase().includes(q) || g.category.toLowerCase().includes(q) || g.keywords.some(k => k.toLowerCase().includes(q))
    );

    document.getElementById("guide-list-area").innerHTML = filtered.map((g, i) => `
      <div style="border:1px solid #f1f5f9; padding:25px; border-radius:20px; margin-bottom:15px; background:#fff;">
        <span class="badge">${g.category}</span>
        <div style="margin:15px 0; font-weight:700; line-height:1.5;">${g.text}</div>
        <div style="font-size:12px; color:var(--primary); font-weight:600;">${g.keywords.map(k => '#'+k).join(' ')}</div>
        <button class="del-btn" style="margin-top:15px;" onclick="deleteData('guide', ${i})">삭제</button>
      </div>`).join('') || '<p style="text-align:center; padding:50px; color:var(--text-light);">검색 결과가 없습니다.</p>';
  }

  function deleteData(type, i) {
    if(!confirm("정말 삭제하시겠습니까?")) return;
    if(type === 'corp') DB_CORPS.splice(i, 1);
    else DB_GUIDES.splice(i, 1);
    saveDB();
  }

  function saveDB() {
    localStorage.setItem("db_corps", JSON.stringify(DB_CORPS));
    localStorage.setItem("db_guides", JSON.stringify(DB_GUIDES));
    renderCorps(); renderGuides();
  }

  function downloadGuideSample() {
    const csv = "\uFEFF기업명,키워드,내용\n샘플기업,태그1|태그2,가이드 상세 내용입니다.";
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob); link.download = "workhub_guide_sample.csv"; link.click();
  }

  function uploadCSV(input, type) {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const lines = e.target.result.split(/\r?\n/).slice(1).filter(l => l.trim());
      lines.forEach(l => {
        const p = l.split(',');
        if(p.length >= 3) {
          if(type === 'corp') DB_CORPS.unshift({ name: p[0], code: p[1], status: p[2], period: p[3]||'', url: p[4]||'' });
          else DB_GUIDES.unshift({ category: p[0], keywords: p[1].split('|'), text: p.slice(2).join(',') });
        }
      });
      saveDB();
      alert("일괄 등록 완료!");
    };
    reader.readAsText(file, "UTF-8");
  }

  window.onload = () => { renderCorps(); renderGuides(); };
</script>
</body>
</html>
