<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro | 긴급 복구 v25</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --bg-color: #f4f7ff; --primary: #2563eb; --text-dark: #1e293b; --text-light: #64748b; --white: #ffffff; --border: #e2e8f0; }
  body { font-family: 'Pretendard', sans-serif; margin: 0; background-color: var(--bg-color); }
  header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border); background: var(--white); }
  .logo { font-size: 24px; font-weight: 900; color: var(--primary); }
  main { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  .card { background: var(--white); border-radius: 20px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid var(--border); }
  .card-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; color: var(--text-dark); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 12px; font-size: 12px; color: var(--text-light); border-bottom: 2px solid #f1f5f9; }
  td { padding: 12px; border-bottom: 1px solid #f8fafc; font-size: 14px; }
  input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 10px; box-sizing: border-box; }
  .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: 700; cursor: pointer; }
  .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: #eee; }
  .status-on { background: #dbeafe; color: #2563eb; }
</style>
</head>
<body>

<header><div class="logo">WorkHub Pro 긴급모드</div></header>

<main>
  <section class="card">
    <div class="card-title">데이터 리스트 (실시간 동기화 중)</div>
    <div id="debug-info" style="font-size:11px; color:red; margin-bottom:10px;"></div>
    <table>
      <thead><tr><th>기업명</th><th>코드</th><th>상태</th><th>URL</th></tr></thead>
      <tbody id="list-body">
        <tr><td colspan="4" style="text-align:center; padding:40px; color:#aaa;">데이터를 불러오는 중입니다...</td></tr>
      </tbody>
    </table>
  </section>

  <aside class="card">
    <div class="card-title">기업 등록</div>
    <input id="f-name" placeholder="기업명 (필수)">
    <input id="f-code" placeholder="기업코드">
    <input id="f-url" placeholder="URL">
    <select id="f-status"><option value="운영중">운영중</option><option value="종료">종료</option></select>
    <button class="btn" onclick="saveData()">지금 등록하기</button>
  </aside>
</main>

<script>
  // 사용자님 설정값
  const firebaseConfig = {
    apiKey: "AIzaSyB7pI15lC-L2U_Y_uE888pZpZpZpZpZpZ",
    authDomain: "workhub-pro.firebaseapp.com",
    databaseURL: "https://workhub-pro-default-rtdb.firebaseio.com",
    projectId: "workhub-pro",
    storageBucket: "workhub-pro.appspot.com",
    messagingSenderId: "338870335028",
    appId: "1:338870335028:web:785f7560879f874f67609a"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // [수정 핵심] '/' 경로를 읽되, 구조가 어떻든 최대한 뽑아냅니다.
  function startSync() {
    db.ref('/').on('value', (snapshot) => {
      const data = snapshot.val();
      const listBody = document.getElementById('list-body');
      const debugInfo = document.getElementById('debug-info');
      
      if (!data) {
        listBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">데이터베이스가 비어있습니다.</td></tr>';
        return;
      }

      // 데이터 변환 및 렌더링
      const items = Object.entries(data).map(([key, value]) => ({ ...value, key }));
      
      // name이 없는 설정 데이터는 제외하고 리스트 생성
      const filtered = items.filter(item => item.name);
      
      if (filtered.length === 0) {
        listBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">등록된 기업 데이터가 없습니다. (형식 불일치)</td></tr>';
        debugInfo.innerText = "가져온 원본 키 개수: " + items.length + "개 (필터링됨)";
        return;
      }

      listBody.innerHTML = filtered.reverse().map(item => `
        <tr>
          <td style="font-weight:bold;">${item.name || '이름 없음'}</td>
          <td>${item.code || '-'}</td>
          <td><span class="status-badge ${item.status === '운영중' ? 'status-on' : ''}">${item.status || '상태 미정'}</span></td>
          <td><small>${item.url || '-'}</small></td>
        </tr>
      `).join('');
      
      debugInfo.innerText = ""; // 정상 작동 시 에러 메시지 삭제
    }, (err) => {
      document.getElementById('debug-info').innerText = "연결 오류: " + err.message;
    });
  }

  function saveData() {
    const name = document.getElementById('f-name').value.trim();
    if(!name) return alert("기업명을 입력해 주세요.");

    db.ref('/').push({
      name: name,
      code: document.getElementById('f-code').value,
      url: document.getElementById('f-url').value,
      status: document.getElementById('f-status').value,
      timestamp: Date.now()
    }).then(() => {
      alert("등록 완료!");
      document.getElementById('f-name').value = "";
    }).catch(e => alert("저장 실패: " + e.message));
  }

  window.onload = startSync;
</script>
</body>
</html>
