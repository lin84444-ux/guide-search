<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<div class="card admin-only">
  <h2>엑셀 데이터 등록</h2>
  <div class="file-upload-box">
    <p style="font-size: 13px; margin-bottom: 10px; color: #888;">
      엑셀 파일(.xlsx)을 업로드하여 데이터를 일괄 추가합니다.<br>
      (열 제목: <b>category, text, keywords</b> 가 반드시 포함되어야 합니다.)
    </p>
    <input type="file" id="file-input" accept=".xlsx, .xls" style="display: none;">
    <button onclick="document.getElementById('file-input').click()" style="background: var(--secondary-color); color: #666; margin-right: 5px;">엑셀 선택</button>
    <button onclick="uploadExcel()">데이터 병합하기</button>
  </div>
</div>

<script>
/* ... (기존 변수 설정 동일) ... */

// 3. 엑셀 업로드 처리 함수 (새로 작성)
function uploadExcel() {
  const fileInput = document.getElementById('file-input');
  const file = fileInput.files[0];

  if (!file) {
    alert("먼저 엑셀 파일을 선택해주세요.");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });

    // 첫 번째 시트 선택
    const sheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[sheetName];

    // 시트 데이터를 JSON으로 변환
    const jsonData = XLSX.utils.sheet_to_json(worksheet);

    if (jsonData.length > 0) {
      // 엑셀의 데이터를 가공 (keywords가 콤마로 구분된 문자열일 경우 배열로 변환)
      const formattedData = jsonData.map(item => ({
        category: item.category || "미분류",
        text: item.text || "",
        keywords: item.keywords ? String(item.keywords).split(",").map(k => k.trim()) : []
      }));

      // 기존 데이터와 병합 (새 데이터를 맨 위로)
      GUIDE = [...formattedData, ...GUIDE];
      localStorage.setItem("guide", JSON.stringify(GUIDE));
      renderGuides();
      
      alert(`${formattedData.length}개의 데이터가 엑셀에서 추가되었습니다.`);
      fileInput.value = ""; // 초기화
    } else {
      alert("엑셀 파일에 데이터가 없거나 형식이 잘못되었습니다.");
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ... (나머지 renderGuides, addGuide 등 기존 함수 동일) ... */
</script>
