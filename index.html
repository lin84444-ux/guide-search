<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --main-blue: #2e6ff2; --bg: #f4f7ff; --white: #ffffff; --border: #eef2f8; --text: #1e293b; --light-gray: #94a3b8; }
  body { font-family: 'Pretendard', sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  
  header { padding: 40px 20px 10px; text-align: center; position: relative; }
  .logo { font-size: 32px; font-weight: 900; color: #0f172a; margin-bottom: 25px; }
  .admin-btn { position: absolute; top: 20px; right: 25px; padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: #64748b; font-size: 13px; font-weight: 600; }
  
  .nav-tabs { display: inline-flex; background: var(--white); padding: 6px; border-radius: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 40px; }
  .nav-btn { padding: 12px 28px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; background: transparent; color: #94a3b8; font-size: 14px; }
  .nav-btn.active { background: var(--main-blue); color: #fff; }

  main { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: grid; grid-template-columns: 1.8fr 1.1fr; gap: 30px; }

  .summary-bar { display: flex; gap: 20px; margin-bottom: 30px; }
  .summary-item { flex: 1; background: var(--white); padding: 30px 20px; border-radius: 25px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.02); }
  .summary-val { font-size: 30px; font-weight: 900; color: #0f172a; }

  .card { background: var(--white); border-radius: 35px; padding: 35px; margin-bottom: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.03); }
  .card-title { font-size: 20px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
  .card-title::before { content: 'ㅣ'; color: var(--main-blue); font-weight: 900; }

  input, select { width: 100%; padding: 18px 20px; border-radius: 16px; border: 1.5px solid #f1f5f9; margin-bottom: 15px; box-sizing: border-box; background: #f8fafc; font-size: 15px; outline: none; }
  
  .btn-submit { width: 100%; padding: 20px; border-radius: 18px; border: none; background: var(--main-blue); color: #fff; font-weight: 800; cursor: pointer; font-size: 16px; transition: 0.2s; }
  .btn-dark { background: #1e293b; margin-top: 10px; }

  .list-table { width: 100%; border-collapse: collapse; }
  .list-table th { text-align: left; padding: 15px; font-size: 12.5px; color: var(--light-gray); border-bottom: 2px solid #f8fafc; }
  .list-table td { padding: 22px 15px; border-bottom: 1px solid #fbfcfe; font-size: 14.5px; color: #334155; }
  
  .del-btn { display: none; color: #ef4444; border: none; background: none; cursor: pointer; font-weight: bold; }
  .admin-mode .del-btn { display: inline-block; }
</style>
</head>
<body id="app-body">

<header>
  <button class="admin-btn" onclick="toggleAdmin()">⚙️ 관리자 모드</button>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active">🏢 기업관리시스템</button>
    <button class="nav-btn">🚀 워크허브</button>
  </div>
</header>

<main>
  <div>
    <div class="summary-bar">
      <div class="summary-item">전체<br><div class="summary-val" id="cnt-all">0</div></div>
      <div class="summary-item">운영중<br><div class="summary-val" id="cnt-on" style="color:var(--main-blue)">0</div></div>
      <div class="summary-item">종료<br><div class="summary-val" id="cnt-off">0</div></div>
    </div>
    <section class="card">
      <div class="card-title">기업 현황 리스트</div>
      <input type="text" id="search-input" placeholder="기업명 검색" onkeyup="render()">
      <table class="list-table">
        <thead><tr><th>기업명</th><th>코드</th><th>운영기간</th><th>상태</th><th>연수원 URL</th><th class="del-btn">관리</th></tr></thead>
        <tbody id="list-body"></tbody>
      </table>
    </section>
  </div>

  <div>
    <section class="card">
      <div class="card-title">기업 등록</div>
      <input id="in-name" placeholder="기업명">
      <input id="in-code" placeholder="기업코드">
      <input id="in-url" placeholder="URL (000.hunet.co.kr)">
      <select id="in-status"><option value="운영중">운영중</option><option value="종료">종료</option></select>
      <input id="in-period" placeholder="운영기간 (~)">
      <button class="btn-submit" onclick="addOne()">데이터 등록</button>
    </section>
    <section class="card">
      <div class="card-title">파일 등록</div>
      <button class="btn-submit btn-dark" style="margin-bottom:15px;" onclick="downloadSample()">📥 샘플 양식 받기</button>
      <input type="file" id="excel-input" accept=".xlsx, .xls, .csv" style="margin-bottom:15px;">
      <button class="btn-submit" onclick="uploadExcel()">파일 등록</button>
    </section>
  </div>
</main>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAtn4kWV3_D18zivOHIEAkW09Lqt2ZjHqE",
    authDomain: "workhub-pro-be742.firebaseapp.com",
    databaseURL: "https://workhub-pro-be742-default-rtdb.firebaseio.com/",
    projectId: "workhub-pro-be742",
    storageBucket: "workhub-pro-be742.firebasestorage.app",
    messagingSenderId: "547958464107",
    appId: "1:547958464107:web:3c78c150e0b3c77969db2e"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let DATA = [], ADMIN = false;

  function load() {
    db.ref('/').on('value', (ss) => {
      const val = ss.val();
      DATA = val ? Object.entries(val).map(([k, v]) => ({ ...v, key: k })).filter(i => i.name) : [];
      document.getElementById('cnt-all').innerText = DATA.length;
      document.getElementById('cnt-on').innerText = DATA.filter(d => d.status === '운영중').length;
      document.getElementById('cnt-off').innerText = DATA.filter(d => d.status === '종료').length;
      render();
    });
  }

  // 1. [신규] 샘플 엑셀 파일 생성 및 다운로드
  function downloadSample() {
    const data = [
      ["기업명", "기업코드", "운영기간", "상태", "연수원 URL"],
      ["샘플기업A", "A001", "2026.01~2026.12", "운영중", "sample.hunet.co.kr"]
    ];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
    XLSX.writeFile(wb, "WorkHub_샘플양식.xlsx");
  }

  // 2. 엑셀 업로드 기능
  function uploadExcel() {
    const file = document.getElementById('excel-input').files[0];
    if (!file) return alert("파일을 선택해주세요.");

    const reader = new FileReader();
    reader.onload = function(e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

      let count = 0;
      rows.forEach(row => {
        const name = row['기업명'] || row['name'];
        if (name) {
          db.ref('/').push({
            name: name,
            code: row['기업코드'] || row['code'] || '',
            period: row['운영기간'] || row['period'] || '~',
            url: row['연수원 URL'] || row['url'] || '',
            status: row['상태'] || '운영중'
          });
          count++;
        }
      });
      alert(count + "건 등록 완료!");
    };
    reader.readAsArrayBuffer(file);
  }

  function addOne() {
    const n = document.getElementById('in-name').value.trim();
    if(!n) return alert("기업명 필수!");
    db.ref('/').push({
      name: n, code: document.getElementById('in-code').value,
      url: document.getElementById('in-url').value,
      status: document.getElementById('in-status').value,
      period: document.getElementById('in-period').value || "~"
    }).then(() => alert("등록 성공"));
  }

  function render() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const f = DATA.filter(d => d.name.toLowerCase().includes(q));
    document.getElementById('list-body').innerHTML = f.reverse().map(d => `
      <tr>
        <td style="font-weight:800;">${d.name}</td>
        <td>${d.code || '-'}</td>
        <td>${d.period || '-'}</td>
        <td><span style="color:${d.status==='운영중'?'#2e6ff2':'#94a3b8'}; font-weight:800;">${d.status}</span></td>
        <td>${d.url || '-'}</td>
        <td><button class="del-btn" onclick="del('${d.key}')">삭제</button></td>
      </tr>`).join('');
  }

  function del(k) { if(confirm("삭제?")) db.ref('/').child(k).remove(); }
  function toggleAdmin() {
    ADMIN = !ADMIN;
    document.getElementById('app-body').classList.toggle('admin-mode', ADMIN);
    render();
  }

  window.onload = load;
</script>
</body>
</html>
