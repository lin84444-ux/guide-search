<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkHub Pro | 기업 관리 시스템</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --primary-blue: #6366f1; /* 메인 블루 */
            --pastel-blue: #e0e7ff;  /* 연한 파스텔 블루 */
            --muted-blue: #94a3b8;   /* 차분한 블루 그레이 */
            --bg-light: #f8fafc;
            --white: #ffffff;
            --text-dark: #1e293b;
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            margin: 0; background-color: var(--bg-light); color: var(--text-dark);
        }

        /* 헤더 섹션 */
        .header {
            background: linear-gradient(135deg, var(--pastel-blue) 0%, #f1f5f9 100%);
            padding: 40px 20px; text-align: center;
        }
        .header h1 { margin: 0; font-size: 32px; color: #334155; }

        .container { max-width: 1200px; margin: -40px auto 60px; padding: 0 20px; }

        /* 통계 카드 (기존 팀원분 레이아웃 적용) */
        .stats-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; 
        }
        .stat-card {
            background: var(--white); border-radius: 20px; padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); text-align: center;
            border-bottom: 4px solid var(--pastel-blue);
        }
        .stat-card h3 { margin: 0; font-size: 14px; color: var(--muted-blue); }
        .stat-card .count { font-size: 32px; font-weight: 800; color: var(--primary-blue); margin-top: 10px; }

        /* 메인 카드 스타일 */
        .card { 
            background: var(--white); border-radius: 24px; padding: 30px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); margin-bottom: 25px;
        }

        /* 입력 및 검색바 */
        .input-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 15px; }
        input, select { 
            padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 12px; 
            font-size: 14px; outline: none; transition: 0.2s;
        }
        input:focus { border-color: var(--primary-blue); }

        .btn { 
            padding: 12px 24px; border: none; border-radius: 12px; cursor: pointer; 
            font-weight: 700; transition: 0.2s; 
        }
        .btn-primary { background: var(--primary-blue); color: white; }
        .btn-excel { background: #10b981; color: white; } /* 엑셀은 가시성을 위해 그린 계열 유지 */

        /* 테이블 스타일 */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f1f5f9; padding: 15px; text-align: left; font-size: 13px; color: var(--muted-blue); }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }

        .excel-upload-zone {
            background: #eef2ff; border: 2px dashed var(--primary-blue);
            padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🏢 WorkHub Pro 기업 관리</h1>
</div>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card"><h3>전체 기업</h3><div class="count" id="total-count">0</div></div>
        <div class="stat-card"><h3>운영 중</h3><div class="count" id="active-count">0</div></div>
        <div class="stat-card"><h3>관리 종료</h3><div class="count" id="closed-count">0</div></div>
    </div>

    <div class="card excel-upload-zone">
        <p style="margin-top:0; font-weight:700;">📊 엑셀 파일로 데이터 일괄 등록</p>
        <input type="file" id="excelFile" accept=".xlsx, .xls" style="margin-right:10px;">
        <button onclick="uploadExcel()" class="btn btn-excel">엑셀 업로드</button>
    </div>

    <div class="card">
        <div class="input-row">
            <input id="in-name" placeholder="기업명">
            <input id="in-code" placeholder="기업코드">
            <select id="in-status">
                <option value="운영중">운영 중</option>
                <option value="종료">종료</option>
            </select>
            <input id="in-period" placeholder="운영기간 (예: 2026)">
            <button onclick="saveData()" class="btn btn-primary">+ 기업 등록</button>
        </div>
        <hr style="border:0; border-top:1px solid #f1f5f9; margin:25px 0;">
        <input id="search-bar" onkeyup="render()" placeholder="🔍 등록된 기업명 또는 코드 검색..." style="width:100%; box-sizing:border-box;">
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>기업명</th><th>코드</th><th>상태</th><th>기간</th><th>관리</th></tr>
                </thead>
                <tbody id="data-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Firebase 설정
    const firebaseConfig = {
        apiKey: "AIzaSyATn4kWV3_D18zivOHIEAkW09Lqt2ZjHqE",
        authDomain: "workhub-pro-be742.firebaseapp.com",
        databaseURL: "https://workhub-pro-be742-default-rtdb.firebaseio.com/",
        projectId: "workhub-pro-be742",
        storageBucket: "workhub-pro-be742.firebasestorage.app",
        messagingSenderId: "547958464107",
        appId: "1:547958464107:web:3c78c150e0b3c77969db2e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let DATA = [];

    // 데이터 불러오기 및 실시간 업데이트
    db.ref('guides').on('value', (snap) => {
        const val = snap.val();
        DATA = val ? Object.keys(val).map(k => ({id: k, ...val[k]})) : [];
        updateStats();
        render();
    });

    function updateStats() {
        document.getElementById('total-count').innerText = DATA.length;
        document.getElementById('active-count').innerText = DATA.filter(d => d.status === '운영중').length;
        document.getElementById('closed-count').innerText = DATA.filter(d => d.status === '종료').length;
    }

    function saveData() {
        const name = document.getElementById('in-name').value;
        const code = document.getElementById('in-code').value;
        const status = document.getElementById('in-status').value;
        const period = document.getElementById('in-period').value;

        if(!name) return alert("기업명을 입력하세요.");
        db.ref('guides').push({ name, code, status, period, timestamp: Date.now() });
        
        // 입력창 비우기
        document.querySelectorAll('.input-row input').forEach(el => el.value = "");
    }

    function render() {
        const q = document.getElementById('search-bar').value.toLowerCase();
        const tbody = document.getElementById('data-list');
        
        const filtered = DATA.filter(d => 
            d.name.toLowerCase().includes(q) || (d.code && d.code.toLowerCase().includes(q))
        );

        tbody.innerHTML = filtered.map(d => `
            <tr>
                <td><strong>${d.name}</strong></td>
                <td>${d.code || '-'}</td>
                <td><span style="color:${d.status === '운영중' ? '#6366f1' : '#94a3b8'}; font-weight:700;">${d.status}</span></td>
                <td>${d.period || '-'}</td>
                <td><button onclick="deleteItem('${d.id}')" style="background:none; border:none; color:#f43f5e; cursor:pointer; font-size:12px;">삭제</button></td>
            </tr>
        `).join('') || "<tr><td colspan='5' style='text-align:center; padding:40px; color:#94a3b8;'>검색 결과가 없습니다.</td></tr>";
    }

    function deleteItem(id) {
        if(confirm("이 기업 데이터를 삭제하시겠습니까?")) db.ref(`guides/${id}`).remove();
    }

    function uploadExcel() {
        const file = document.getElementById('excelFile').files[0];
        if(!file) return alert("파일을 선택해주세요.");
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            json.forEach(row => {
                db.ref('guides').push({
                    name: row['기업명'] || "미분류",
                    code: String(row['기업코드'] || "-"),
                    status: row['운영여부'] || "운영중",
                    period: row['운영기간'] || "-",
                    timestamp: Date.now()
                });
            });
            alert("업로드 완료!");
        };
        reader.readAsArrayBuffer(file);
    }
</script>

</body>
</html>
