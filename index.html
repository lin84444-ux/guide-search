<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro | 통합 관리 시스템</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    --bg-main: #f8fafc;
    --header-grad: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%);
    --card-bg: #ffffff;
    --primary: #6366f1;
    --accent: #f43f5e;
    --secondary: #94a3b8;
    --text-main: #1e293b;
    --text-sub: #475569;
    --border-color: #f1f5f9;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
  }

  body { 
    font-family: 'Pretendard', sans-serif; 
    margin: 0; background-color: var(--bg-main); color: var(--text-main);
    line-height: 1.6; word-break: keep-all;
  }

  header { 
    background: var(--header-grad); padding: 50px 20px 100px; text-align: center; 
    position: relative; z-index: 1; clip-path: ellipse(150% 100% at 50% 0%);
  }

  /* 탭 메뉴 스타일 */
  .nav-tabs { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
  .nav-btn {
    padding: 12px 35px; border-radius: 50px; border: none;
    background: white; color: var(--secondary); font-weight: 700; cursor: pointer;
    box-shadow: var(--shadow); transition: 0.3s;
  }
  .nav-btn.active { background: var(--primary); color: white; }

  .admin-toggle-btn { 
    position: absolute; top: 30px; right: 40px; 
    background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.05); 
    padding: 10px 22px; border-radius: 14px; color: #475569; cursor: pointer; 
    backdrop-filter: blur(10px); transition: 0.3s; font-size: 13px; font-weight: 700;
  }

  main { 
    max-width: 1400px; margin: -60px auto 80px; padding: 0 25px; position: relative; z-index: 10; 
  }

  .content-section { display: none; flex-direction: column; gap: 25px; }
  .content-section.active { display: flex; }

  /* 카드 및 공통 스타일 */
  .card { background: var(--card-bg); border-radius: 24px; padding: 30px; box-shadow: var(--shadow); border: 1px solid #ffffff; }
  .title-area { font-size: 20px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .title-area i { width: 6px; height: 20px; border-radius: 3px; background: var(--primary); }

  /* [메뉴 1] 기업관리시스템 전용 스타일 */
  .stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .stat-card { padding: 25px; border-radius: 20px; text-align: center; color: white; }
  .stat-card.all { background: linear-gradient(135deg, #6366f1, #a855f7); }
  .stat-card.on { background: linear-gradient(135deg, #10b981, #34d399); }
  .stat-card.off { background: linear-gradient(135deg, #f43f5e, #fb923c); }
  .stat-val { font-size: 32px; font-weight: 900; }

  .upload-pink-bar {
    background: linear-gradient(to right, #f472b6, #fb7185);
    padding: 15px 25px; border-radius: 15px; display: flex; align-items: center; gap: 15px; color: white; margin-bottom: 20px;
  }

  /* 테이블 스타일 */
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th { background: #6366f1; color: white; padding: 12px; font-size: 14px; }
  td { padding: 12px; text-align: center; border-bottom: 1px solid var(--border-color); font-size: 14px; }

  /* [메뉴 2] 워크허브 전용 스타일 (기존 스타일 복구) */
  .hub-grid { display: grid; grid-template-columns: 1.8fr 1fr; gap: 30px; }
  .list-item { background: #ffffff; padding: 20px; border-radius: 20px; margin-bottom: 15px; border: 1.5px solid #f8fafc; }
  .badge { font-size: 11px; font-weight: 800; color: var(--primary); background: #eef2ff; padding: 4px 10px; border-radius: 8px; }
  .share-item { background: #f8fafc; padding: 18px; border-radius: 18px; margin-bottom: 12px; border: 1px solid #f1f5f9; }
  .share-item.important { background: #fff1f2; border: 2px solid var(--accent); }

  /* 공통 입력창 */
  input, textarea, select { padding: 13px; border: 1.5px solid var(--border-color); border-radius: 12px; outline: none; background: #f8fafc; }
  button { cursor: pointer; border: none; font-weight: 700; transition: 0.2s; }
  .btn-blue { background: var(--primary); color: white; border-radius: 12px; }
  
  @media (max-width: 1000px) { .hub-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <button class="admin-toggle-btn" onclick="toggleAdmin()">⚙️ 관리자 모드</button>
  <h1 id="main-title">WorkHub Pro</h1>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab('corp-section', this)">🏢 기업관리시스템</button>
    <button class="nav-btn" onclick="switchTab('hub-section', this)">🚀 워크허브</button>
  </div>
</header>

<main>
  <section id="corp-section" class="content-section active">
    <div class="upload-pink-bar">
      <span style="font-weight: 800;">📊 엑셀 파일 업로드</span>
      <input type="file" id="corp-excel" style="background:white; border-radius:8px; flex:1; padding:5px;">
      <button class="btn-blue" style="padding:8px 20px; background:#6366f1; border:1px solid white;">↑ 엑셀 업로드</button>
    </div>

    <div class="stats-container">
      <div class="stat-card all"><div class="stat-val" id="c-all">0</div><div class="stat-label">전체 기업</div></div>
      <div class="stat-card on"><div class="stat-val" id="c-on">0</div><div class="stat-label">운영 중</div></div>
      <div class="stat-card off"><div class="stat-val" id="c-off">0</div><div class="stat-label">종료</div></div>
    </div>

    <div class="card" style="margin-top:20px;">
      <div style="display:flex; gap:10px; margin-bottom:15px;">
        <input id="corp-search" style="flex:1" placeholder="🔍 기업명 검색..." onkeyup="renderCorpTable()">
        <button style="background:#10b981; color:white; padding:10px 20px; border-radius:10px;">엑셀로 내보내기</button>
      </div>
      <div style="display:grid; grid-template-columns: repeat(5, 1fr) 100px; gap:8px;">
        <input id="in-name" placeholder="기업명">
        <input id="in-code" placeholder="기업코드">
        <input id="in-url" placeholder="기업URL">
        <select id="in-status"><option>운영중</option><option>종료</option></select>
        <input id="in-period" placeholder="운영기간">
        <button onclick="addCorpData()" class="btn-blue">등록</button>
      </div>
      <table>
        <thead>
          <tr><th>기업명</th><th>기업코드</th><th>기업URL</th><th>운영여부</th><th>운영기간</th><th>관리</th></tr>
        </thead>
        <tbody id="corp-table-body"></tbody>
      </table>
    </div>
  </section>

  <section id="hub-section" class="content-section">
    <div class="hub-grid">
      <div class="card">
