<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro | 통합 관리 시스템</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  :root {
    --bg-color: #f4f7ff;
    --primary: #6366f1; /* 사용자 선호 블루 */
    --text-dark: #1e293b;
    --text-light: #64748b;
    --white: #ffffff;
    --border: #e2e8f0;
    --accent: #f43f5e;
  }

  body { font-family: 'Pretendard', sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-dark); }
  
  header { padding: 50px 20px 30px; text-align: center; }
  .logo { font-size: 36px; font-weight: 900; color: #0f172a; margin-bottom: 25px; letter-spacing: -1px; }

  /* 통합 탭 네비게이션 */
  .nav-tabs { display: inline-flex; background: var(--white); padding: 6px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 40px; }
  .nav-btn {
    padding: 12px 30px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s;
    background: transparent; color: var(--text-light); font-size: 14px;
  }
  .nav-btn.active { background: var(--primary); color: var(--white); }

  main { max-width: 1300px; margin: 0 auto 50px; padding: 0 20px; }
  .tab-content { display: none; grid-template-columns: 1.8fr 1fr; gap: 25px; }
  .tab-content.active { display: grid; }

  .card { background: var(--white); border-radius: 24px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.02); height: fit-content; }
  .card-title { font-size: 19px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .card-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 10px; }

  /* 통계 섹션 */
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-box { background: #f8faff; border: 1px solid #eef2ff; padding: 15px; border-radius: 16px; text-align: center; }
  .stat-val { font-size: 22px; font-weight: 900; color: var(--primary); }

  /* 입력 & 버튼 */
  input, textarea, select {
    width: 100%; box-sizing: border-box; padding: 14px; border-radius: 12px;
    border: 1px solid #f1f5f9; background: #f8fafc; outline: none; font-size: 14px; margin-bottom: 12px;
  }
  input:focus { border-color: var(--primary); background: var(--white); }

  .btn-primary { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 700; cursor: pointer; }
  .excel-box { border: 2px dashed #cbd5e1; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
  .sample-btn { font-size: 12px; color: var(--primary); text-decoration: underline; cursor: pointer; font-weight: 700; margin-top: 10px; display: inline-block; }

  /* 테이블 & 리스트 */
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th { text-align: left; padding: 12px; font-size: 12px; color: var(--text-light); border-bottom: 2px solid #f1f5f9; }
  td { padding: 14px 12px; font-size: 14px; border-bottom: 1px solid #f8fafc; }
  .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; background: #eef2ff; color: var(--primary); }

  @media (max-width: 1000px) { .tab-content { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab('corp-section', this)">🏢 기업관리시스템</button>
    <button class="nav-btn" onclick="switchTab('guide-section', this)">🚀 워크허브</button>
  </div>
</header>

<main>
  <div id="corp-section" class="tab-content active">
    <section class="card">
      <div class="card-title">기업 현황 관리</div>
      <div class="stats-grid">
        <div class="stat-box"><span style="font-size:11px;">전체</span><br><b class="stat-val" id="c-all">0</b></div>
        <div class="stat-box"><span style="font-size:11px;">운영중</span><br><b class="stat-val" id="c-on">0</b></div>
        <div class="stat-box"><span style="font-size:11px;">종료</span><br><b class="stat-val" id="c-off">0</b></div>
      </div>
      <input type="text" id="c-search" placeholder="기업명 검색 (Enter)" onkeyup="if(event.key==='Enter') renderCorp()">
      <table>
        <thead><tr><th>기업명</th><th>코드</th><th>상태</th><th>관리</th></tr></thead>
        <tbody id="corp-list"></tbody>
      </table>
    </section>

    <section class="card">
      <div class="card-title">기업 등록</div>
      <div class="excel-box">
        <span style="font-size:13px; font-weight:800; color:var(--primary);">엑셀 일괄 등록</span>
        <input type="file" id="c-file" style="font-size:11px;" onchange="uploadCorp(this)">
      </div>
      <input id="cn" placeholder="기업명">
      <input id="cc" placeholder="기업코드">
      <select id="cs"><option>운영중</option><option>종료</option></select>
      <button class="btn-primary" onclick="addCorp()">추가하기</button>
    </section>
  </div>

  <div id="guide-section" class="tab-content">
    <section class="card">
      <div class="card-title">가이드 보관함</div>
      <input type="text" id="g-search" placeholder="내용 또는 키워드 검색 (Enter)" onkeyup="if(event.key==='Enter') renderGuide()">
      <div id="guide-list" style="margin-top:20px;"></div>
    </section>

    <section class="card">
      <div class="card-title">지식 등록</div>
      <div class="excel-box">
        <span style="font-size:13px; font-weight:800; color:var(--primary);">가이드 일괄 등록</span>
        <input type="file" onchange="uploadGuide(this)" style="font-size:11px;">
        <span class="sample-btn" onclick="downloadSample()">[양식 다운로드]</span>
      </div>
      <input id="gn" placeholder="기업명 (예: 삼성전자)">
      <input id="gk" placeholder="키워드 (쉼표 구분)">
      <textarea id="gt" placeholder="가이드 상세 내용" rows="4"></textarea>
      <button class="btn-primary" style="background:#1e293b;" onclick="addGuide()">지식 저장</button>
    </section>
  </div>
</main>

<script>
  let CORPS = JSON.parse(localStorage.getItem("wh_corps") || "[]");
  let GUIDES = JSON.parse(localStorage.getItem("wh_guides") || "[]");

  function switchTab(id, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }

  // --- 기업 관리 로직 ---
  function addCorp() {
    const name = document.getElementById("cn").value;
    if(!name) return;
    CORPS.unshift({ name, code: document.getElementById("cc").value, status: document.getElementById("cs").value });
    saveAndRender();
    document.getElementById("cn").value = ""; document.getElementById("cc").value = "";
  }

  function renderCorp() {
    const q = document.getElementById("c-search").value.toLowerCase();
    const filtered = CORPS.filter(c => c.name.toLowerCase().includes(q));
    document.getElementById("c-all").innerText = CORPS.length;
    document.getElementById("c-on").innerText = CORPS.filter(c => c.status === '운영중').length;
    document.getElementById("c-off").innerText = CORPS.filter(c => c.status === '종료').length;

    document.getElementById("corp-list").innerHTML = filtered.map((c, i) => `
      <tr>
        <td style="font-weight:700;">${c.name}</td>
        <td>${c.code}</td>
        <td style="color:${c.status==='운영중'?'#6366f1':''}">${c.status}</td>
        <td><button onclick="delCorp(${i})" style="border:none; color:red; cursor:pointer; background:none;">삭제</button></td>
      </tr>`).join('');
  }

  function delCorp(i) { CORPS.splice(i,1); saveAndRender(); }

  // --- 워크허브 로직 ---
  function downloadSample() {
    const csv = "\uFEFF기업명,키워드,내용\n샘플기업,태그1|태그2,가이드 내용입니다.";
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob); link.download = "workhub_sample.csv"; link.click();
  }

  function addGuide() {
    const name = document.getElementById("gn").value;
    const txt = document.getElementById("gt").value;
    if(!name || !txt) return alert("내용을 입력하세요.");
    GUIDES.unshift({ category: name, keywords: document.getElementById("gk").value.split(','), text: txt });
    saveAndRender();
    document.getElementById("gn").value=""; document.getElementById("gk").value=""; document.getElementById("gt").value="";
  }

  function renderGuide() {
    const q = document.getElementById("g-search").value.toLowerCase();
    const filtered = GUIDES.filter(g => g.text.toLowerCase().includes(q) || g.category.toLowerCase().includes(q));
    document.getElementById("guide-list").innerHTML = filtered.map((g, i) => `
      <div style="border:1px solid #f1f5f9; padding:20px; border-radius:15px; margin-bottom:10px;">
        <span class="badge">${g.category}</span>
        <div style="margin:10px 0; font-weight:600;">${g.text}</div>
        <div style="font-size:11px; color:#6366f1;">${g.keywords.map(k => '#'+k.trim()).join(' ')}</div>
        <button onclick="delGuide(${i})" style="margin-top:10px; border:none; color:red; cursor:pointer; background:none; font-size:11px;">삭제</button>
      </div>`).join('') || '<p style="text-align:center; color:#94a3b8;">결과가 없습니다.</p>';
  }

  function delGuide(i) { GUIDES.splice(i,1); saveAndRender(); }

  function saveAndRender() {
    localStorage.setItem("wh_corps", JSON.stringify(CORPS));
    localStorage.setItem("wh_guides", JSON.stringify(GUIDES));
    renderCorp(); renderGuide();
  }

  // 파일 업로드 통합 로직
  function uploadFile(file, type) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const lines = e.target.result.split(/\r?\n/).slice(1);
      lines.forEach(l => {
        const p = l.split(',');
        if(p.length >= 3) {
          if(type === 'corp') CORPS.unshift({ name: p[0], code: p[1], status: p[2] });
          else GUIDES.unshift({ category: p[0], keywords: p[1].split('|'), text: p[2] });
        }
      });
      saveAndRender();
    };
    reader.readAsText(file, "UTF-8");
  }

  function uploadCorp(input) { if(input.files[0]) uploadFile(input.files[0], 'corp'); }
  function uploadGuide(input) { if(input.files[0]) uploadFile(input.files[0], 'guide'); }

  window.onload = () => { renderCorp(); renderGuide(); };
</script>
</body>
</html>
