<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --main-purple: #6366f1; --bg-light: #f8fafc; --white: #ffffff; --text-dark: #1e293b; --border-color: #e2e8f0; }
  body { font-family: 'Pretendard', sans-serif; margin: 0; background: var(--bg-light); color: var(--text-dark); }
  
  /* 사내망 차단 안내 바 */
  #network-alert { display: none; background: #fee2e2; color: #b91c1c; text-align: center; padding: 12px; font-weight: 700; border-bottom: 1px solid #fecaca; }
  
  header { padding: 40px 20px; text-align: center; background: #fff; }
  .logo { font-size: 36px; font-weight: 900; color: #1e293b; margin-bottom: 25px; }
  
  .nav-tabs { display: inline-flex; background: #f1f5f9; padding: 6px; border-radius: 12px; margin-bottom: 30px; }
  .nav-btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; color: #64748b; background: transparent; transition: 0.3s; }
  .nav-btn.active { background: var(--main-purple); color: #fff; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); }

  main { max-width: 1400px; margin: 0 auto; padding: 20px; display: none; grid-template-columns: 2fr 1fr; gap: 25px; }
  main.active { display: grid; }

  .card { background: var(--white); border-radius: 20px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border-color); }
  .card-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; }
  .card-title::before { content: ''; width: 4px; height: 18px; background: var(--main-purple); margin-right: 10px; border-radius: 10px; }

  input, textarea, select { width: 100%; padding: 15px; border-radius: 12px; border: 1.5px solid var(--border-color); margin-bottom: 15px; box-sizing: border-box; font-size: 15px; background: #fcfdfe; }
  .btn-primary { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--main-purple); color: #fff; font-weight: 700; cursor: pointer; font-size: 16px; }
  .btn-sample { background: #1e293b; margin-bottom: 10px; }

  .list-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .list-table th { text-align: left; padding: 12px; color: #64748b; border-bottom: 2px solid #f1f5f9; font-size: 14px; }
  .list-table td { padding: 18px 12px; border-bottom: 1px solid #f1f5f9; font-size: 15px; }

  #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; align-items: center; justify-content: center; z-index: 100; font-weight: 700; color: var(--main-purple); }
</style>
</head>
<body>

<div id="network-alert">⚠️ 현재 사내망 보안 정책으로 인해 데이터 서버 연결이 차단되었습니다. IT팀에 문의하세요.</div>
<div id="loading">데이터 동기화 중...</div>

<header>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab(0)">🏢 기업관리시스템</button>
    <button class="nav-btn" onclick="switchTab(1)">🚀 워크허브</button>
  </div>
</header>

<main id="tab-0" class="active">
  <section class="card">
    <div class="card-title">기업 현황 리스트</div>
    <input type="text" id="search-comp" placeholder="기업명 검색..." onkeyup="renderCompanies()">
    <table class="list-table">
      <thead><tr><th>기업명</th><th>코드</th><th>운영기간</th><th>상태</th><th>연수원 URL</th></tr></thead>
      <tbody id="company-list"></tbody>
    </table>
  </section>
  <aside>
    <section class="card">
      <div class="card-title">엑셀 데이터 등록</div>
      <button class="btn-primary btn-sample" onclick="downloadSample()">📥 샘플 양식 받기</button>
      <input type="file" id="excel-file" accept=".xlsx">
      <button class="btn-primary" onclick="uploadExcel()">파일 등록하기</button>
    </section>
  </aside>
</main>

<main id="tab-1">
  <section class="card">
    <div class="card-title">가이드 보관함</div>
    <div style="display:flex; gap:10px;">
      <input type="text" placeholder="가이드 제목 검색..." style="flex:2;">
      <select style="flex:1;"><option>전체 기업</option></select>
    </div>
    <div style="text-align:center; padding:50px; color:#94a3b8;">검색 결과가 없습니다.</div>
  </section>
  <aside>
    <section class="card">
      <div class="card-title">오늘의 공유사항</div>
      <textarea placeholder="공유할 내용을 입력하세요..." style="height:100px;"></textarea>
      <button class="btn-primary">소식 공유</button>
    </section>
    <section class="card" style="margin-top:20px;">
      <div class="card-title">가이드 등록</div>
      <input placeholder="대상 기업명">
      <input placeholder="키워드 (쉼표 구분)">
      <textarea placeholder="상세 가이드 내용" style="height:100px;"></textarea>
      <button class="btn-primary" style="background:#eef2ff; color:var(--main-purple);">가이드 저장</button>
    </section>
  </aside>
</main>

<script>
  // Firebase 설정
  const firebaseConfig = {
    apiKey: "AIzaSyAtn4kWV3_D18zivOHIEAkW09Lqt2ZjHqE",
    authDomain: "workhub-pro-be742.firebaseapp.com",
    databaseURL: "https://workhub-pro-be742-default-rtdb.firebaseio.com/",
    projectId: "workhub-pro-be742"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let COMPANIES = [];

  // 초기화 및 연결 체크
  function init() {
    const loading = document.getElementById('loading');
    loading.style.display = 'flex';

    // 사내망 차단 체크 (3초간 무응답 시 안내)
    const timeout = setTimeout(() => {
      document.getElementById('network-alert').style.display = 'block';
      loading.style.display = 'none';
    }, 3000);

    db.ref('companies').on('value', snap => {
      clearTimeout(timeout);
      const data = snap.val();
      COMPANIES = data ? Object.values(data) : [];
      renderCompanies();
      loading.style.display = 'none';
      document.getElementById('network-alert').style.display = 'none';
    });
  }

  function switchTab(idx) {
    document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
    document.querySelectorAll('main').forEach((m, i) => m.classList.toggle('active', i === idx));
  }

  function renderCompanies() {
    const q = document.getElementById('search-comp').value.toLowerCase();
    const filtered = COMPANIES.filter(c => c.name.toLowerCase().includes(q));
    document.getElementById('company-list').innerHTML = filtered.map(c => `
      <tr><td><b>${c.name}</b></td><td>${c.code}</td><td>${c.period}</td>
      <td style="color:${c.status==='운영중'?'#2e6ff2':'#94a3b8'}; font-weight:800;">${c.status}</td>
      <td><a href="https://${c.url}" target="_blank">${c.url}</a></td></tr>`).join('');
  }

  async function uploadExcel() {
    const file = document.getElementById('excel-file').files[0];
    if(!file) return alert("파일을 선택하세요.");
    
    document.getElementById('loading').style.display = 'flex';
    const reader = new FileReader();
    reader.onload = async (e) => {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type: 'array'});
      const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
      
      const updates = {};
      rows.forEach(r => {
        if(r['기업명']) {
          const newKey = db.ref().child('companies').push().key;
          updates[`/companies/${newKey}`] = {
            name: r['기업명'], code: r['기업코드']||'', period: r['운영기간']||'',
            url: r['연수원 URL']||'', status: r['상태']||'운영중'
          };
        }
      });
      await db.ref().update(updates);
      document.getElementById('loading').style.display = 'none';
      alert("등록 완료!");
    };
    reader.readAsArrayBuffer(file);
  }

  function downloadSample() {
    const data = [["기업명", "기업코드", "운영기간", "상태", "연수원 URL"], ["샘플기업", "C001", "2026.01~", "운영중", "test.hunet.co.kr"]];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
    XLSX.writeFile(wb, "WorkHub_기업양식.xlsx");
  }

  window.onload = init;
</script>
</body>
</html>
