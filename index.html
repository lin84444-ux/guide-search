<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub | 업무 가이드 & 공유</title>
<style>
  :root {
    --bg-color: #f8f9fa;
    --primary-color: #a2d2ff;
    --red-zone: #fff5f5;
    --green-zone: #f4fff4;
    --text-dark: #212529;
    --white: #ffffff;
    --shadow: 0 4px 15px rgba(0,0,0,0.05);
  }

  body {
    font-family: 'Pretendard', sans-serif;
    margin: 0; padding: 0;
    background-color: var(--bg-color);
  }

  header {
    background: linear-gradient(135deg, var(--primary-color), #92a8d1);
    padding: 20px; text-align: center; color: white;
  }

  /* 메인 그리드 레이아웃 */
  main {
    display: grid;
    grid-template-columns: 1.5fr 1fr; /* 왼쪽과 오른쪽 비율 */
    grid-template-rows: auto auto;
    gap: 20px;
    max-width: 1400px;
    margin: 20px auto;
    padding: 0 20px;
  }

  /* 영역별 스타일 */
  .black-zone { grid-row: span 2; border: 2px solid #333; } /* 검은 네모 */
  .red-zone { border: 2px solid #ff6b6b; background: var(--red-zone); } /* 빨간 네모 */
  .green-zone { border: 2px solid #51cf66; background: var(--green-zone); } /* 초록 네모 */

  .card {
    background: var(--white);
    padding: 20px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow-y: auto;
    max-height: 80vh;
  }

  h2 { font-size: 1.1rem; margin-top: 0; display: flex; align-items: center; gap: 8px; }
  
  .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
  input, textarea, select {
    padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
  }

  button {
    padding: 10px; border: none; border-radius: 8px; cursor: pointer;
    background: var(--primary-color); color: white; font-weight: bold;
  }

  .list-item {
    padding: 12px; border-bottom: 1px solid #eee; background: #fff;
    margin-bottom: 8px; border-radius: 6px;
  }
  
  .file-link {
    display: inline-block; margin-top: 5px; font-size: 12px;
    color: #007bff; text-decoration: none;
  }

  .admin-only { display: none; }
  
  /* 반응형 */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .black-zone { grid-row: auto; }
  }
</style>
</head>
<body>

<header>
  <button style="float:right; background:rgba(255,255,255,0.3)" onclick="toggleAdmin()">관리자 전환</button>
  <h1>WorkHub</h1>
  <p id="mode-text" style="font-size: 0.9rem; opacity: 0.8;">사용자 모드입니다</p>
</header>

<main>
  <section class="card black-zone">
    <h2>🔍 가이드 검색 / 전체보기</h2>
    <div style="display:flex; gap:5px; margin-bottom:20px;">
        <input id="q" style="flex:1" placeholder="검색어를 입력하고 'Enter'를 누르세요" 
               onkeyup="if(event.key==='Enter') renderGuides();">
        <button onclick="renderGuides()">검색</button>
    </div>
    <div id="guide-result">
        <p style="text-align:center; color:#999; margin-top:50px;">검색어를 입력하거나 빈칸에서 엔터를 치면 데이터가 나타납니다.</p>
    </div>
  </section>

  <section class="card red-zone">
    <h2 style="color:#e03131;">📢 오늘의 공유건</h2>
    <div id="share-result"></div>
    <hr style="border: 0.5px dashed #ffc9c9; margin: 15px 0;">
    <div class="input-group">
        <textarea id="share-text" placeholder="공유사항 직접 등록 (공유창 전용)" rows="2"></textarea>
        <button onclick="addShare()" style="background:#ff6b6b;">공유 등록</button>
    </div>
  </section>

  <section class="card green-zone">
    <h2 style="color:#2f9e44;">✍️ 새 가이드 등록</h2>
    <div class="input-group">
        <input id="new-category" placeholder="카테고리 (예: 업무팁, 인사)">
        <input id="new-keywords" placeholder="키워드 (쉼표로 구분)">
        <textarea id="new-text" placeholder="상세 내용을 입력하세요" rows="3"></textarea>
        
        <div style="font-size: 13px;">
            <label>📎 파일 첨부: </label>
            <input type="file" id="new-file" style="border:none; padding:0;">
        </div>

        <div style="font-size: 13px; display:flex; align-items:center; gap:5px;">
            <input type="checkbox" id="sync-share" style="width:auto;">
            <label for="sync-share">등록 시 '오늘의 공유사항'에도 올리기</label>
        </div>

        <button onclick="addGuide()" style="background:#51cf66;">DB 저장하기</button>
    </div>
    
    <div class="admin-only" style="margin-top:10px; border-top:1px solid #ddd; pt:10px;">
        <p style="font-size:11px; color:#666;">데이터 가져오기(JSON)</p>
        <input type="file" id="json-upload" accept=".json" onchange="uploadJSON()" style="font-size:11px;">
    </div>
  </section>
</main>

<script>
let GUIDE = JSON.parse(localStorage.getItem("guide") || "[]");
let SHARES = JSON.parse(localStorage.getItem("shares") || "[]");
let isAdmin = false;

// 1. 가이드 렌더링 (엔터 시에만 작동)
function renderGuides() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const container = document.getElementById("guide-result");
    
    // 필터링 (빈값이면 전체)
    const filtered = q === "" ? GUIDE : GUIDE.filter(item => 
        item.text.toLowerCase().includes(q) || 
        item.category.toLowerCase().includes(q) ||
        (item.keywords && item.keywords.some(k => k.toLowerCase().includes(q)))
    );

    if(filtered.length === 0) {
        container.innerHTML = "<p style='text-align:center; padding:20px;'>결과가 없습니다.</p>";
        return;
    }

    container.innerHTML = filtered.map((item, idx) => `
        <div class="list-item">
            <span style="font-size:11px; background:#eef6ff; color:#4a90e2; padding:2px 6px; border-radius:4px;">${item.category}</span>
            <div style="margin-top:5px; color:#333;">${item.text}</div>
            ${item.fileName ? `<a href="${item.fileData}" download="${item.fileName}" class="file-link">📁 ${item.fileName} 다운로드</a>` : ''}
            <div style="margin-top:5px; font-size:11px; color:#bbb;">${item.keywords.map(k=>'#'+k).join(' ')}</div>
            ${isAdmin ? `<button onclick="deleteGuide(${idx})" style="padding:2px 5px; font-size:10px; background:#ff8787; margin-top:5px;">삭제</button>` : ''}
        </div>
    `).join('');
}

// 2. 가이드 등록 (파일 첨부 로직 포함)
async function addGuide() {
    const cat = document.getElementById("new-category").value;
    const txt = document.getElementById("new-text").value;
    const kw = document.getElementById("new-keywords").value.split(",").map(k=>k.trim());
    const fileInput = document.getElementById("new-file");
    const isSync = document.getElementById("sync-share").checked;

    if(!cat || !txt) return alert("카테고리와 내용을 입력하세요.");

    let fileData = null;
    let fileName = null;

    if(fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileName = file.name;
        fileData = await toBase64(file); // 파일을 텍스트로 변환하여 저장
    }

    const newEntry = { category: cat, text: txt, keywords: kw, fileName, fileData, date: new Date().toLocaleDateString() };
    
    GUIDE.unshift(newEntry);
    localStorage.setItem("guide", JSON.stringify(GUIDE));

    if(isSync) {
        addShare(txt); // 공유사항 동시 등록
    }

    alert("등록되었습니다.");
    location.reload(); // 간편한 UI 갱신을 위해 리로드
}

// 3. 공유사항 등록/렌더링
function addShare(directText = null) {
    const txt = directText || document.getElementById("share-text").value;
    if(!txt) return;

    SHARES.unshift({ text: txt, date: new Date().toLocaleTimeString() });
    localStorage.setItem("shares", JSON.stringify(SHARES));
    renderShares();
    if(!directText) document.getElementById("share-text").value = "";
}

function renderShares() {
    const container = document.getElementById("share-result");
    container.innerHTML = SHARES.map((s, idx) => `
        <div style="font-size:13px; margin-bottom:8px; border-left:3px solid #ff8787; padding-left:8px;">
            <div>${s.text}</div>
            <span style="font-size:10px; color:#999;">${s.date}</span>
            ${isAdmin ? `<span onclick="deleteShare(${idx})" style="cursor:pointer; color:red; margin-left:5px;">[x]</span>` : ''}
        </div>
    `).join('') || "<p style='color:#ccc; font-size:12px;'>오늘의 공유사항이 없습니다.</p>";
}

// 유틸리티: 파일을 Base64로 변환
const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
});

// 관리자 모드
function toggleAdmin() {
    if(!isAdmin && prompt("비밀번호를 입력하세요(6559)") === "6559") {
        isAdmin = true;
        document.getElementById("mode-text").innerText = "관리자 모드";
        document.querySelectorAll(".admin-only").forEach(el => el.style.display = "block");
    } else {
        isAdmin = false;
        document.getElementById("mode-text").innerText = "사용자 모드";
        document.querySelectorAll(".admin-only").forEach(el => el.style.display = "none");
    }
    renderShares();
}

function deleteGuide(idx) { if(confirm("삭제할까요?")) { GUIDE.splice(idx,1); localStorage.setItem("guide", JSON.stringify(GUIDE)); renderGuides(); } }
function deleteShare(idx) { SHARES.splice(idx,1); localStorage.setItem("shares", JSON.stringify(SHARES)); renderShares(); }

window.onload = () => {
    renderShares();
};
</script>
</body>
</html>
