<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub | 업무 가이드 & 공유</title>
<style>
  :root {
    --bg-color: #f8f9fa;
    --primary-color: #a2d2ff;
    --secondary-color: #d1d8e0;
    --accent-color: #bde0fe;
    --text-main: #495057;
    --text-dark: #212529;
    --white: #ffffff;
    --shadow: 0 4px 15px rgba(0,0,0,0.05);
  }

  body {
    font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
    margin: 0; padding: 0;
    background-color: var(--bg-color);
    color: var(--text-main);
    line-height: 1.6;
  }

  /* --- 헤더 --- */
  header {
    background: linear-gradient(135deg, var(--primary-color), #92a8d1);
    padding: 40px 20px 60px;
    text-align: center;
    color: var(--white);
    position: relative;
  }
  header h1 { margin: 0; font-size: 32px; letter-spacing: -1px; }
  header .admin-toggle-btn {
    position: absolute; top: 20px; right: 20px;
    background: rgba(255,255,255,0.2); border: 1px solid white;
    padding: 5px 12px; border-radius: 20px; color: white; cursor: pointer; font-size: 12px;
  }

  main { max-width: 900px; margin: -40px auto 50px; padding: 0 20px; position: relative; }

  /* --- 카드 스타일 --- */
  .card {
    background: var(--white);
    padding: 25px;
    border-radius: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 25px;
    animation: fadeIn 0.5s ease-out;
  }
  h2 { font-size: 18px; color: var(--text-dark); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: '•'; color: var(--primary-color); font-size: 24px; }

  /* --- 입력창 & 버튼 --- */
  .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
  input, textarea {
    flex: 1; padding: 12px 15px; border: 1px solid #eee;
    border-radius: 10px; outline: none; transition: 0.3s; background: #fcfcfc; font-family: inherit;
  }
  input:focus { border-color: var(--primary-color); }
  
  button {
    padding: 12px 24px; border: none; border-radius: 10px;
    cursor: pointer; font-weight: 600; transition: 0.2s;
    background: var(--primary-color); color: white;
  }
  button:hover { opacity: 0.8; transform: translateY(-1px); }

  /* --- 리스트 아이템 --- */
  .list-item { 
    padding: 18px; background: #fff; border-bottom: 1px solid #f1f1f1;
    display: flex; justify-content: space-between; align-items: flex-start; position: relative;
  }
  .item-content { flex: 1; }
  .badge {
    display: inline-block; padding: 3px 12px; border-radius: 20px;
    font-size: 11px; font-weight: bold; background: #eef6ff; color: #4a90e2; margin-bottom: 8px;
  }
  .content-text { font-size: 15px; color: var(--text-dark); word-break: keep-all; }
  .keyword-area { margin-top: 10px; border-top: 1px dashed #f1f1f1; padding-top: 8px; }
  .kw-tag { font-size: 11px; color: #aaa; background: #f8f9fa; padding: 2px 8px; border-radius: 4px; margin-right: 5px; border: 1px solid #f1f1f1; }

  /* --- 메뉴(점세개) --- */
  .dot-btn { background: none; color: #ccc; padding: 5px; font-size: 20px; line-height: 1; transition: 0.2s; }
  .dot-btn:hover { color: var(--primary-color); }
  .dropdown {
    display: none; position: absolute; right: 10px; top: 40px; 
    background: white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-radius: 8px; z-index: 100; min-width: 100px;
  }
  .dropdown button {
    display: block; width: 100%; background: none; color: #ff6b6b; padding: 10px 15px; font-size: 13px; text-align: left; border-radius: 0;
  }

  .admin-only { display: none; }
  .completed { opacity: 0.5; text-decoration: line-through; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<header>
  <button class="admin-toggle-btn" onclick="toggleAdmin()">관리자 전환</button>
  <h1>WorkHub</h1>
  <p id="mode-text">사용자 모드입니다</p>
</header>

<main>
  <div class="card">
    <h2>가이드 검색</h2>
    <div class="input-group">
      <input id="q" placeholder="검색어를 입력하세요 (엔터 시 전체 데이터 노출)" onkeydown="if(event.key==='Enter') renderGuides()">
      <button onclick="renderGuides()">검색</button>
    </div>
    <div id="guide-result"></div>
  </div>

  <div class="card">
    <h2>오늘의 공유사항</h2>
    <div id="share-result"></div>
    <div class="admin-only" style="margin-top:20px; padding-top:20px; border-top: 1px dashed #eee;">
      <div class="input-group">
        <textarea id="share-text" placeholder="공유할 내용을 입력하세요..."></textarea>
        <button onclick="addShare()">등록</button>
      </div>
    </div>
  </div>

  <div class="card admin-only">
    <h2>새 가이드 등록</h2>
    <div class="input-group">
      <input id="new-category" placeholder="카테고리 (예: 오류)">
      <input id="new-keywords" placeholder="키워드 (쉼표 구분)">
    </div>
    <textarea id="new-text" placeholder="상세 내용을 입력하세요..." style="width:100%; margin-bottom:10px; height: 80px;"></textarea>
    <button onclick="addGuide()" style="width:100%;">DB 저장하기</button>
  </div>

  <div class="card admin-only">
    <h2>휴지통 (완료된 공유 보관)</h2>
    <div id="trash-list" style="font-size:13px; color:#999; line-height: 1.8;"></div>
  </div>
</main>

<script>
/* --- 기본 데이터 (제공된 리스트 적용) --- */
const DEFAULT_GUIDE = [
  { category: "재응시", text: "GS건설 신규입사자 온보딩 과정 재응시는 사내 담당자 안내", keywords: ["재응시","GS건설","과락","GS"] },
  { category: "오류", text: "에러코드 224002: 캐시삭제로 해결", keywords: ["에러코드","오류코드","오류"] },
  { category: "오류", text: "에러코드 232011, 102630: 네트워크 불안정(사내망 보안 설정이나 와이파이 문제), 데이터누적사유(캐시), 브라우저 버전 문제", keywords: ["에러코드","오류코드","오류"] },
  { category: "오류", text: "포트가 사용중입니다. 기기를 재부팅하세요.: 어플삭제, 기기재부팅, 어플재설치 하면 대부분 해결", keywords: ["에러코드","오류코드","어플"] },
  { category: "오류", text: "플레이어에서 오류가 발생하여 종료합니다.: 데이터환경불안정, 기기 메모리 부족 등의 문제", keywords: ["에러코드","오류코드","오류"] },
  { category: "오류", text: "우호! 뭔가 잘못되었습니다. 파일을 열 수 없습니다.: PDF Reader 앱이 APK 파일을 잘못된 형식의 문서로 인식했을 때 뜨는 오류", keywords: ["에러코드","오류코드","오류"] },
  { category: "오류", text: "패키지 파싱오류: 학습자 휴대폰 캐시 삭제로 해결", keywords: ["에러코드","오류코드","파싱"] },
  { category: "재응시", text: "GS리테일 재응시 가능", keywords: ["GS","GS리테일","재응시","과락"] },
  { category: "가입", text: "지해로 개인가입 2월 말 오픈 예정", keywords: ["지해로","가입","해양수산부"] },
  { category: "학습", text: "차그룹 안전보건교육 기간연장 불가", keywords: ["차그룹","연장","기간연장","안전"] },
  { category: "학습", text: "차그룹 신청일 포함 3일 이내 취소 가능", keywords: ["차그룹","신청","수강신청","취소"] },
  { category: "대관", text: "휴넷캠퍼스 대관은 임재훈님 문의", keywords: ["문의","대관","휴넷캠퍼스"] },
  { category: "학습", text: "네이버커넥트 부스트캠프 OT 및 학습 관련 문의 시 boost_help@naver.com", keywords: ["네이버","부스트캠프","커넥트","네이버커넥트"] },
  { category: "재응시", text: "국립암센터 재응시 문의 시 교육수련팀 안내", keywords: ["국립암센터","암센터","재응시","과락"] },
  { category: "학습", text: "국립암센터 취소 문의 시 교육훈련팀 안내", keywords: ["국립암센터","암센터","취소","신청"] },
  { category: "재응시", text: "국민건강보험공단[특별안전보건교육]_4.폭발성물질, 인화성액체의 취급작업 등 과정 재응시 문의 시 사내 송정아 대리 안내", keywords: ["국민건강보험공단","건보","재응시","과락"] },
  { category: "학습", text: "국민건강보험공단 수시과정 취소 불가", keywords: ["국민건강보험공단","건보","신청","취소"] },
  { category: "재응시", text: "국민연금공단 노후준비지원실 기업 재응시 모두 사내문의", keywords: ["국민연금공단","노후준비지원실","재응시","과락"] },
  { category: "재응시", text: "대한적십자사 인재개발원 재응시 사내문의", keywords: ["대한적십자사 인재개발원","적십자","재응시"] },
  { category: "학습", text: "건강보험심사평가원 밀리의서재 수료기준 1개월 1권 완독", keywords: ["수료","수료기준","밀리의서재"] },
  { category: "학습", text: "클리드아카데미 경상북도 울진군 교재 미제공 연수원", keywords: ["클리드","지역정보개발원","교재"] },
  { category: "학습", text: "클리드아카데미 인천광역시 중구 홀수달에만 수강 가능", keywords: ["클리드","지역정보개발원","신청"] },
  { category: "학습", text: "클리드아카데미 강원특별자치도 인제군 월별 신청과정수 제한 없음", keywords: ["클리드","지역정보개발원","신청"] },
  { category: "학습", text: "여신금융 시험접수사이트 허용 문자 { } [ ] ( ) / | ? ! . * ~ ‘ ^ - _ + # $ % =", keywords: ["여신","여신금융협회","가입"] },
  { category: "학습", text: "여신금융 시험 4지선다형 40문항, 진위형(O/X) 10문항으로 총50문항", keywords: ["여신","여신금융협회","시험"] },
  { category: "학습", text: "맥스 AI 구독권 수료기준 학습완료티켓 8회", keywords: ["맥스","구독권","수료"] },
  { category: "학습", text: "부커스 구독권 수료기준 1권 기준 80%이상 열람", keywords: ["부커스","구독권","수료"] },
  { category: "학습", text: "성희롱예방교육 문의처 고용노동부 1350", keywords: ["법정교육","필수","문의"] },
  { category: "학습", text: "개인정보보호교육 문의처 한국인터넷진흥원 1544-5118", keywords: ["법정교육","필수교육","문의"] },
  { category: "학습", text: "장애인인식개선교육 문의처 한국장애인고용공단 1588-1519", keywords: ["법정교육","필수교육","문의"] },
  { category: "학습", text: "퇴직연금교육 문의처 근로복지공단 1661-0075", keywords: ["법정교육","필수교육","문의"] }
];

let GUIDE = JSON.parse(localStorage.getItem("guide")) || DEFAULT_GUIDE;
let shares = JSON.parse(localStorage.getItem("shares")) || [];
let trash = JSON.parse(localStorage.getItem("trash")) || [];
let isAdmin = false;

// 관리자 전환
function toggleAdmin() {
  if(!isAdmin) {
    if(prompt("관리자 암호를 입력하세요") === "6559") {
      isAdmin = true;
      document.getElementById("mode-text").innerText = "관리자 모드 (수정 가능)";
      document.querySelectorAll(".admin-only").forEach(el => el.style.display = "block");
    }
  } else {
    isAdmin = false;
    document.getElementById("mode-text").innerText = "사용자 모드입니다";
    document.querySelectorAll(".admin-only").forEach(el => el.style.display = "none");
  }
  renderGuides();
  renderShares();
}

// 가이드 렌더링 (아무것도 입력 안하고 검색 시 전체 노출)
function renderGuides() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const container = document.getElementById("guide-result");
  
  // 검색어가 없으면 전체 출력, 있으면 필터링
  const filtered = q === "" 
    ? GUIDE 
    : GUIDE.filter(i => 
        i.text.toLowerCase().includes(q) || 
        i.category.toLowerCase().includes(q) ||
        i.keywords.some(k => k.toLowerCase().includes(q))
      );

  container.innerHTML = filtered.map((i, idx) => `
    <div class="list-item">
      <div class="item-content">
        <span class="badge">${i.category}</span>
        <div class="content-text">${i.text}</div>
        ${isAdmin ? `<div class="keyword-area">${i.keywords.map(k => `<span class="kw-tag">${k}</span>`).join('')}</div>` : ''}
      </div>
      ${isAdmin ? `
        <div class="more-menu">
          <button class="dot-btn" onclick="toggleDrop('g-${idx}')">⋮</button>
          <div id="g-${idx}" class="dropdown">
            <button onclick="deleteGuide(${idx})">항목 삭제</button>
          </div>
        </div>
      ` : ''}
    </div>
  `).join('') || "<div style='padding:40px; text-align:center; color:#ccc;'>검색 결과가 없습니다.</div>";
}

// 오늘의 공유 렌더링 (2일 자동삭제 / 완료 후 1일 뒤 휴지통)
function renderShares() {
  const container = document.getElementById("share-result");
  const now = Date.now();

  shares = shares.filter(s => {
    const ageHours = (now - s.created) / (1000 * 60 * 60);
    if (s.status === 'completed' && ageHours >= 24) { trash.push(s); return false; }
    if (ageHours >= 48) return false;
    return true;
  });

  container.innerHTML = shares.map((s, idx) => `
    <div class="list-item" style="border-left: 4px solid ${s.status === 'completed' ? '#ddd' : 'var(--primary-color)'}">
      <div class="item-content ${s.status === 'completed' ? 'completed' : ''}">
        <div class="content-text">${s.text}</div>
        <div style="font-size:11px; color:#bbb; margin-top:5px;">${new Date(s.created).toLocaleString()}</div>
      </div>
      ${isAdmin ? `
        <div class="more-menu">
          <button class="dot-btn" onclick="toggleDrop('s-${idx}')">⋮</button>
          <div id="s-${idx}" class="dropdown">
            <button onclick="completeShare(${idx})" style="color:#4a90e2">${s.status === 'active' ? '완료 처리' : '진행중으로 복구'}</button>
            <button onclick="deleteShare(${idx})">즉시 삭제</button>
          </div>
        </div>
      ` : ''}
    </div>
  `).join('') || "<div style='color:#ccc; text-align:center; padding:20px; font-size:13px;'>공유된 내용이 없습니다.</div>";
  
  renderTrash();
  save();
}

function addGuide() {
  const cat = document.getElementById("new-category").value;
  const txt = document.getElementById("new-text").value;
  const kw = document.getElementById("new-keywords").value.split(",").map(k => k.trim()).filter(k => k !== "");
  if(cat && txt) {
    GUIDE.unshift({category: cat, text: txt, keywords: kw});
    save(); renderGuides();
    document.getElementById("new-text").value = "";
    alert("새 가이드가 등록되었습니다.");
  } else {
    alert("카테고리와 내용을 모두 입력해주세요.");
  }
}

function addShare() {
  const txt = document.getElementById("share-text").value;
  if(!txt) return;
  shares.unshift({text: txt, created: Date.now(), status: "active"});
  document.getElementById("share-text").value = "";
  renderShares();
}

function completeShare(idx) {
  shares[idx].status = shares[idx].status === 'active' ? 'completed' : 'active';
  renderShares();
}

function deleteGuide(idx) { if(confirm("이 가이드를 영구 삭제하시겠습니까?")) { GUIDE.splice(idx, 1); save(); renderGuides(); } }
function deleteShare(idx) { shares.splice(idx, 1); save(); renderShares(); }

function toggleDrop(id) {
  const el = document.getElementById(id);
  const isShow = el.style.display === 'block';
  document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none');
  if(!isShow) el.style.display = 'block';
}

function renderTrash() {
  document.getElementById("trash-list").innerHTML = trash.map(t => `<div style="margin-bottom:5px;">• ${t.text} (${new Date(t.created).toLocaleDateString()})</div>`).join('') || "휴지통이 비어있습니다.";
}

function save() {
  localStorage.setItem("guide", JSON.stringify(GUIDE));
  localStorage.setItem("shares", JSON.stringify(shares));
  localStorage.setItem("trash", JSON.stringify(trash));
}

// 클릭 시 드롭다운 닫기
window.onclick = (e) => { if(!e.target.matches('.dot-btn')) document.querySelectorAll('.dropdown').forEach(d => d.style.display = 'none'); }

// 초기 실행 (페이지 로드 시 전체 데이터 로딩)
document.addEventListener('DOMContentLoaded', () => {
  renderGuides();
  renderShares();
});
</script>
</body>
</html>
