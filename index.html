<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkHub Pro</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { --main-blue: #2e6ff2; --bg: #f4f7ff; --white: #ffffff; --border: #eef2f8; --text: #1e293b; --light-gray: #94a3b8; }
  body { font-family: 'Pretendard', sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  
  /* [사진 반영] 상단 로고 및 관리자 버튼 레이아웃 */
  header { padding: 40px 20px 10px; text-align: center; position: relative; }
  .logo { font-size: 32px; font-weight: 900; color: #0f172a; margin-bottom: 25px; letter-spacing: -0.5px; }
  .admin-btn { position: absolute; top: 20px; right: 25px; padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: #64748b; font-size: 13px; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
  
  /* [사진 반영] 타원형 탭 메뉴 */
  .nav-tabs { display: inline-flex; background: var(--white); padding: 6px; border-radius: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 40px; }
  .nav-btn { padding: 12px 28px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; background: transparent; color: #94a3b8; display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .nav-btn.active { background: var(--main-blue); color: #fff; }

  main { max-width: 1400px; margin: 0 auto; padding: 0 20px; display: grid; grid-template-columns: 1.8fr 1.1fr; gap: 30px; }

  /* [사진 반영] 요약 수치 카드 */
  .summary-bar { display: flex; gap: 20px; margin-bottom: 30px; }
  .summary-item { flex: 1; background: var(--white); padding: 30px 20px; border-radius: 25px; text-align: center; border: 1px solid rgba(0,0,0,0.01); box-shadow: 0 10px 25px rgba(0,0,0,0.02); }
  .summary-label { font-size: 13px; color: var(--light-gray); margin-bottom: 10px; font-weight: 700; }
  .summary-val { font-size: 30px; font-weight: 900; color: #0f172a; }

  /* [사진 반영] 둥근 모서리 카드 섹션 */
  .card { background: var(--white); border-radius: 35px; padding: 35px; border: 1px solid rgba(0,0,0,0.01); margin-bottom: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.03); }
  .card-title { font-size: 20px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
  .card-title::before { content: 'ㅣ'; color: var(--main-blue); font-weight: 900; }

  /* 입력 필드 디자인 */
  input, select { width: 100%; padding: 18px 20px; border-radius: 16px; border: 1.5px solid #f1f5f9; margin-bottom: 15px; box-sizing: border-box; background: #f8fafc; font-size: 15px; outline: none; }
  input:focus { border-color: var(--main-blue); background: #fff; }
  
  /* 버튼 스타일 */
  .btn-submit { width: 100%; padding: 20px; border-radius: 18px; border: none; background: var(--main-blue); color: #fff; font-weight: 800; cursor: pointer; font-size: 16px; transition: all 0.2s; box-shadow: 0 4px 15px rgba(46, 111, 242, 0.2); }
  .btn-dark { background: #1e293b; margin-top: 10px; box-shadow: none; }

  /* 리스트 테이블 */
  .list-table { width: 100%; border-collapse: collapse; }
  .list-table th { text-align: left; padding: 15px; font-size: 12.5px; color: var(--light-gray); border-bottom: 2px solid #f8fafc; }
  .list-table td { padding: 22px 15px; border-bottom: 1px solid #fbfcfe; font-size: 14.5px; color: #334155; }
  
  .del-btn { display: none; color: #ef4444; border: none; background: none; cursor: pointer; font-weight: bold; }
  .admin-mode .del-btn { display: inline-block; }
</style>
</head>
<body id="app-body">

<header>
  <button class="admin-btn" onclick="toggleAdmin()">⚙️ 관리자 모드</button>
  <div class="logo">WorkHub Pro</div>
  <div class="nav-tabs">
    <button class="nav-btn active">🏢 기업관리시스템</button>
    <button class="nav-btn">🚀 워크허브</button>
  </div>
</header>

<main>
  <div>
    <div class="summary-bar">
      <div class="summary-item"><div class="summary-label">전체</div><div class="summary-val" id="cnt-all">0</div></div>
      <div class="summary-item"><div class="summary-label">운영중</div><div class="summary-val" id="cnt-on" style="color:var(--main-blue)">0</div></div>
      <div class="summary-item"><div class="summary-label">종료</div><div class="summary-val">0</div></div>
    </div>
    <section class="card">
      <div class="card-title">기업 현황 리스트</div>
      <input type="text" id="search-input" placeholder="기업명 검색" onkeyup="render()">
      <table class="list-table">
        <thead><tr><th>기업명</th><th>코드</th><th>운영기간</th><th>상태</th><th>연수원 URL</th><th class="del-btn">관리</th></tr></thead>
        <tbody id="list-body"></tbody>
      </table>
    </section>
  </div>

  <div>
    <section class="card">
      <div class="card-title">기업 등록</div>
      <input id="in-name" placeholder="기업명">
      <input id="in-code" placeholder="기업코드">
      <input id="in-url" placeholder="URL (000.hunet.co.kr)">
      <select id="in-status"><option value="운영중">운영중</option><option value="종료">종료</option></select>
      <input id="in-period" placeholder="운영기간 (~)">
      <button class="btn-submit" onclick="add()">데이터 등록</button>
    </section>
    <section class="card">
      <div class="card-title">파일 등록</div>
      <button class="btn-submit btn-dark" style="margin-bottom:15px;">📥 샘플 양식 받기</button>
      <input type="file" id="file-input">
      <button class="btn-submit btn-dark" onclick="alert('파일 등록 기능은 현재 개발 중입니다.')">파일 등록</button>
    </section>
  </div>
</main>

<script>
  // 기반의 실제 Firebase 설정값
  const firebaseConfig = {
    apiKey: "AIzaSyAtn4kWV3_D18zivOHIEAkW09Lqt2ZjHqE",
    authDomain: "workhub-pro-be742.firebaseapp.com",
    databaseURL: "https://workhub-pro-be742-default-rtdb.firebaseio.com/",
    projectId: "workhub-pro-be742",
    storageBucket: "workhub-pro-be742.firebasestorage.app",
    messagingSenderId: "547958464107",
    appId: "1:547958464107:web:3c78c150e0b3c77969db2e"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let DATA = [], ADMIN = false;

  function load() {
    db.ref('/').on('value', (ss) => {
      const val = ss.val();
      DATA = val ? Object.entries(val).map(([k, v]) => ({ ...v, key: k })).filter(i => i.name) : [];
      document.getElementById('cnt-all').innerText = DATA.length;
      document.getElementById('cnt-on').innerText = DATA.filter(d => d.status === '운영중').length;
      render();
    });
  }

  function add() {
    const n = document.getElementById('in-name').value.trim();
    if(!n) return alert("기업명을 입력하세요.");
    db.ref('/').push({
      name: n,
      code: document.getElementById('in-code').value,
      url: document.getElementById('in-url').value,
      status: document.getElementById('in-status').value,
      period: document.getElementById('in-period').value || "~"
    }).then(() => {
      alert("등록되었습니다!");
      document.getElementById('in-name').value = "";
      document.getElementById('in-code').value = "";
      document.getElementById('in-url').value = "";
    });
  }

  function render() {
    const q = document.getElementById('search-input').value.toLowerCase();
    const f = DATA.filter(d => d.name.toLowerCase().includes(q));
    document.getElementById('list-body').innerHTML = f.reverse().map(d => `
      <tr>
        <td style="font-weight:800; color:#0f172a;">${d.name}</td>
        <td>${d.code || '-'}</td>
        <td>${d.period || '-'}</td>
        <td><span style="color:${d.status==='운영중'?'#2e6ff2':'#94a3b8'}; font-weight:800;">${d.status}</span></td>
        <td><a href="https://${d.url}" target="_blank" style="color:var(--main-blue); text-decoration:none;">${d.url || '-'}</a></td>
        <td><button class="del-btn" onclick="del('${d.key}')">삭제</button></td>
      </tr>`).join('');
  }

  function del(k) { if(confirm("삭제할까요?")) db.ref('/').child(k).remove(); }
  function toggleAdmin() {
    ADMIN = !ADMIN;
    document.getElementById('app-body').classList.toggle('admin-mode', ADMIN);
    render();
  }

  window.onload = load;
</script>
</body>
</html>
